<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCS PIP SHED</title>
<link rel="icon" type="image/png" href="__ASSET_FAVICON__">
</head>
<body>
<title>Garden Shed Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#4a2f1c; --wood:#7c4d2c; --wood-light:#a06f43;
    --cream:#faf3e3; --ink:#3a2a1c; --moss:#5f7a44; --terracotta:#bf4e2c;
    --page-bg:#eee3cf; --card:#fffaf0; --shadow:rgba(40,25,10,.35);
    /* Ask Pip's own light-green border color, matched from app.askpip.garden. */
    --pip-border:#c7ddc2;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0; background:#000; font-family:'Nunito',sans-serif; color:var(--ink);
    overflow:hidden;
    height:100vh; height:100dvh;
  }
  .wrap{ position:fixed; inset:0; width:100%; height:100vh; height:100dvh; margin:0; padding:0; }

  /* Full-bleed: the scene fills the whole viewport, no frame, no page margins, no letterbox bands. */
  .stage-frame{ position:relative; width:100%; height:100%; overflow:hidden; }
  .stage-ratio{ position:absolute; inset:0; }
  .stage-ratio.mobile{ display:block; }
  .stage-ratio.desktop{ display:none; }
  .stage{ position:absolute; inset:0; overflow:hidden; }
  .scene-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* On phones, a plain edge-to-edge crop of the office scene cuts off the bookshelf on the
     right. Here (main app view only, not the lock screen) we zoom the art out a little so a
     slice of the bookshelf shows. Sized from WIDTH (not height) on purpose: that guarantees
     the art always spans the full screen width on any phone shape, so any margin this
     introduces can only ever show up above/below the art, never at the sides.
     Nudge width/left together (and the bookshelf/cabinet/board/rug hotspot cx/cy values
     below) if it needs retuning. */
  #stageMobile{ background:var(--wood-dark); }
  #stageMobile .scene-bg{
    top:50%; left:-12.5%; right:auto; bottom:auto;
    width:125%; height:auto;
    transform:translateY(-50%);
  }

  @media (min-width: 760px){
    .stage-ratio.mobile{ display:none; }
    .stage-ratio.desktop{ display:block; }
  }

  /* Pip */
  .pip-wrap{ position:absolute; top:1.5%; left:3%; display:flex; align-items:flex-start; gap:10px; z-index:5; }
  .pip-avatar{ width:56px; height:auto; filter:drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
  .speech{
    background:var(--cream); border:2px solid var(--wood); border-radius:14px 14px 14px 3px;
    padding:8px 12px; font-family:'Kalam',cursive; font-size:.78rem; color:var(--ink);
    box-shadow:2px 3px 6px rgba(0,0,0,.25); max-width:210px; line-height:1.3;
    transition:opacity 1.1s ease;
  }
  @media (min-width:760px){
    .pip-avatar{ width:70px; }
    .speech{ font-size:.88rem; max-width:280px; }
  }

  /* "Signed in as ..." badge, shown once the passphrase resolves to a named user. */
  .active-user-badge{
    position:absolute; top:1.5%; right:3%; z-index:5; display:none;
    background:var(--cream); border:2px solid var(--wood); border-radius:14px;
    padding:6px 12px; font-family:'Kalam',cursive; font-size:.78rem; color:var(--ink);
    box-shadow:2px 3px 6px rgba(0,0,0,.25);
  }
  @media (min-width:760px){
    .active-user-badge{ font-size:.88rem; }
  }


  /* Hotspots: small round buttons centered on a single point */
  .hotspot{
    position:absolute; transform:translate(-50%,-50%);
    width:36px; height:36px; border-radius:50%;
    border:1.5px solid rgba(74,47,28,.55); background:rgba(70,48,28,.32);
    -webkit-backdrop-filter:blur(1.5px); backdrop-filter:blur(1.5px);
    color:var(--cream); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:1rem; box-shadow:0 2px 6px rgba(0,0,0,.25);
    transition:transform .15s ease, background .15s ease; z-index:3;
    animation:pulse 2.6s ease-in-out infinite;
  }
  .hotspot:hover, .hotspot:focus-visible{
    transform:translate(-50%,-50%) scale(1.14);
    background:rgba(70,48,28,.55); outline:none;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 2px 6px rgba(0,0,0,.25), 0 0 0 0 rgba(255,235,180,.35); }
    50%{ box-shadow:0 2px 6px rgba(0,0,0,.25), 0 0 0 6px rgba(255,235,180,0); }
  }
  .hotspot .tag{
    position:absolute; left:50%; bottom:120%; transform:translateX(-50%);
    background:var(--wood-dark); color:var(--cream); font-family:'Kalam',cursive;
    font-size:.72rem; padding:2px 8px; border-radius:8px; white-space:nowrap;
    opacity:0; transition:opacity .15s ease; pointer-events:none;
  }
  .hotspot:hover .tag{ opacity:1; }
  /* Pending count on a hotspot -- Notice Board (notices awaiting a decision) and To-Do List
     (tasks not yet Completed) -- hidden (no inline display set) until updateBoardBadge()/
     updateTodoBadge() gives it a non-zero count. */
  .hotspot-badge{
    position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 4px;
    border-radius:9px; background:#a33; color:#fff; font-family:'Nunito',sans-serif;
    font-weight:700; font-size:.68rem; display:none; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.4); z-index:4;
  }
  .hotspot-badge.show{ display:flex; }

  /* The Desk: any number of items (documents/notices/books) can be open at once, sharing a
     single window frame per stage -- browser-tab style. With one item open, the frame shows
     a plain titlebar (title + maximize/restore + close). With two or more, a tab strip
     replaces the titlebar: click a tab to switch which document is showing, click its own
     little x to close just that one. Because every open item always has its own reachable
     tab, there's no more layering/peeking to manage -- the old "can't reach a window buried
     behind another" problem this replaced can't happen: nothing is ever hidden behind
     anything else. */
  .desk-stack{ position:absolute; inset:0; z-index:15; pointer-events:none; overflow:hidden; }
  /* Default size is deliberately small and corner-anchored -- roughly phone-card-sized --
     rather than covering most of the desk, so the hotspots behind it (Notice Board and
     To-Do List above all) stay reachable while a document or notice is open. Fixed 2026-09-09
     after the previous min(680px,86%) x min(560px,80%) default was reported as blocking the
     Notice Board on an actual phone. Maximize (below) is the way to read something at the
     old larger size; this is only the resting size. */
  .desk-window{
    position:absolute; right:16px; bottom:16px; width:min(340px, 82%); height:min(400px, 55%);
    pointer-events:auto; background:var(--cream); border-radius:10px;
    box-shadow:2px 8px 20px rgba(0,0,0,.4); font-family:'Nunito',sans-serif;
    display:flex; flex-direction:column; overflow:hidden; z-index:100;
  }
  /* Full-screen reading mode, toggled by the maximize/restore button. */
  .desk-window.maximized{ width:96%; height:92%; right:2%; bottom:4%; }

  .desk-window .dw-header{ flex:none; background:var(--wood); color:var(--cream); }

  /* Exactly one item open: a plain titlebar, same shape the app always had. */
  .desk-window .dw-titlebar-single{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 10px; font-family:'Kalam',cursive; font-size:.92rem;
  }
  .desk-window .dw-titlebar-single b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  /* "Under review" indicator in an opened window's own header -- shown for a notice (or its
     linked to-do, opened via "View Notice") whose review has been requested but not yet
     decided, so that's visible the moment the window opens, not only in the closed list row
     or the To-Do List's per-row chip (11 September 2026, Founder-requested). Same colour as
     the existing .item-row-decision.decision-review chip so it reads as the same status
     wherever it appears. */
  .desk-window .dw-titlebar-badge{
    flex:none; font-family:'Nunito',sans-serif; font-size:.68rem; font-weight:700;
    color:#fff; background:var(--terracotta); border-radius:999px; padding:3px 8px;
    white-space:nowrap;
  }
  .desk-window .dw-tab-flag{ flex:none; font-size:.85em; }

  /* Two or more items open: a browser-style tab strip, window controls docked at its right
     end. Each tab carries its own close x, exactly like a browser tab, so switching which
     document is showing is always just a click on its tab -- no cycle button needed. */
  .desk-window .dw-header.tabbed{ display:flex; align-items:stretch; }
  .desk-window .dw-tabs{
    display:flex; align-items:stretch; gap:2px; overflow-x:auto; flex:1; min-width:0;
    padding:6px 4px 0;
  }
  .desk-window .dw-tab{
    position:relative; display:flex; align-items:center; gap:6px; flex:none;
    max-width:150px; min-width:70px; padding:6px 8px; border-radius:8px 8px 0 0; cursor:pointer;
    background:rgba(255,255,255,.14); font-family:'Nunito',sans-serif; font-size:.78rem;
  }
  .desk-window .dw-tab.active{ background:var(--cream); color:var(--wood-dark); }
  .desk-window .dw-tab-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  .desk-window .dw-tab-close{
    flex:none; background:transparent; border:none; color:inherit; opacity:.7;
    width:16px; height:16px; border-radius:50%; cursor:pointer; font-size:.75rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .desk-window .dw-tab-close:hover{ opacity:1; background:rgba(0,0,0,.15); }
  /* Only on the active tab, only when it remembers a Notice Board/File Cabinet/Bookshelf
     list it was opened from (win.cameFrom) -- reopens that list without closing this tab.
     Same round-button sizing as the close x it sits beside (see buildBackBtn). */
  .desk-window .dw-tab-back{
    flex:none; background:transparent; border:none; color:inherit; opacity:.7;
    width:16px; height:16px; border-radius:50%; cursor:pointer; font-size:.75rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .desk-window .dw-tab-back:hover{ opacity:1; background:rgba(0,0,0,.15); }
  .desk-window .dw-header.tabbed .dw-titlebtns{ flex:none; display:flex; align-items:center; padding:6px 8px 0; }

  /* A tab's full title on hover (desktop) or a tap (mobile -- toggled briefly by a touchstart
     handler, since a native title attribute never fires on touch). This one lives outside
     .desk-window entirely (appended straight to <body>, position:fixed, placed by JS) rather
     than nested inside the tab: the window frame and the scrolling tab strip both clip their
     own contents (needed elsewhere, for rounded corners and for many tabs to scroll), which
     would silently clip a tooltip nested inside them the moment it pokes above the tab. */
  .shed-tab-tooltip{
    position:fixed; background:var(--wood-dark); color:#fff; font-family:'Nunito',sans-serif;
    font-weight:700; font-size:.72rem; padding:5px 9px; border-radius:6px; white-space:nowrap;
    max-width:220px; overflow:hidden; text-overflow:ellipsis; box-shadow:0 2px 8px rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:500;
  }
  .shed-tab-tooltip.show{ opacity:1; }

  /* Groups the trailing titlebtns (maximize / close) so justify-content:space-between on the
     single-item titlebar puts all the space between the title and this one cluster. */
  .desk-window .dw-titlebtns{ display:flex; align-items:center; gap:6px; flex:none; }
  .desk-window .dw-titlebtn{
    flex:none; background:rgba(255,255,255,.18); border:none; color:var(--cream);
    width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:.8rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .desk-window .dw-titlebtn:hover{ background:rgba(255,255,255,.32); }

  .desk-window .dw-body-wrap{ flex:1; overflow:hidden; position:relative; }
  .desk-window .dw-body{ height:100%; overflow:auto; padding:14px 16px 16px; box-sizing:border-box; }
  .desk-window .doc-date{ display:block; font-size:.75rem; color:var(--wood); opacity:.8; margin:2px 0 10px; }
  .desk-window .linked-doc-btn{
    display:inline-flex; align-items:center; gap:6px; font-family:'Nunito',sans-serif; font-weight:700;
    font-size:.82rem; border:1.5px solid var(--pip-border); background:#fff; color:var(--wood-dark);
    border-radius:8px; padding:7px 11px; cursor:pointer; margin:2px 0 14px;
  }
  .desk-window .approval-block{ border-top:1px dashed var(--pip-border); margin-top:14px; padding-top:12px; }
  /* Multiple links on a notice (21 September 2026): the headline link stays as the big
     .linked-doc-btn above; every further document, photo or web link lives in this block. */
  .desk-window .item-links-block{ border-top:1px dashed var(--pip-border); margin-top:6px; padding-top:10px; }
  .desk-window .item-link-row{ display:flex; align-items:center; gap:8px; margin:4px 0; }
  .desk-window .item-link-row a{ flex:1; min-width:0; overflow-wrap:anywhere; font-family:'Nunito',sans-serif; font-weight:700; font-size:.85rem; color:var(--wood-dark); }
  .desk-window .item-link-add{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .desk-window .item-link-add input[type=text]{ flex:1 1 160px; min-width:0; padding:6px 8px; border:1.5px solid var(--pip-border); border-radius:6px; font-family:'Nunito',sans-serif; font-size:.85rem; }
  .create-form .item-link-add{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .create-form .item-link-add input[type=text]{ flex:1 1 160px; min-width:0; padding:6px 8px; border:1.5px solid var(--pip-border); border-radius:6px; font-family:'Nunito',sans-serif; font-size:.85rem; }
  .link-chips{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px; }
  .link-chip{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--pip-border); border-radius:14px; padding:3px 4px 3px 10px; font-family:'Nunito',sans-serif; font-size:.8rem; font-weight:700; color:var(--wood-dark); max-width:100%; }
  .link-chip .chip-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  .link-chip .chip-tag{ font-weight:400; opacity:.7; }
  .link-chip button{ border:none; background:transparent; cursor:pointer; font-size:1rem; line-height:1; padding:0 6px; color:var(--wood-dark); }
  .desk-window .approval-check{ display:flex; align-items:center; gap:8px; font-family:'Kalam',cursive; font-size:1rem; margin-bottom:8px; }
  .desk-window .approval-check input{ width:19px; height:19px; accent-color:var(--moss); }
  /* approvalMetaText's three states get distinct colors so the result of Save/Request Review
     reads at a glance, not just as a one-line text change easy to miss. */
  .desk-window .approval-meta{
    font-size:.74rem; margin:-4px 0 10px 27px; font-family:'Nunito',sans-serif; font-weight:700;
    padding:3px 7px; border-radius:6px; display:inline-block;
  }
  .desk-window .approval-meta.state-pending{ color:var(--wood-dark); opacity:.65; font-weight:400; padding:0; }
  .desk-window .approval-meta.state-approved{ color:#fff; background:var(--moss); }
  .desk-window .approval-meta.state-review{ color:#fff; background:var(--terracotta); }
  @keyframes shed-approval-flash{
    0%{ box-shadow:0 0 0 5px rgba(58,122,184,.4); }
    100%{ box-shadow:0 0 0 0 rgba(58,122,184,0); }
  }
  .desk-window .approval-meta.flash{ animation:shed-approval-flash 1.1s ease; }
  .desk-window .notes-label{ font-family:'Nunito',sans-serif; font-weight:700; font-size:.78rem; color:var(--wood-dark); display:block; margin-bottom:4px; }
  .desk-window .notes-textarea{
    width:100%; min-height:90px; font-family:'Kalam',cursive; font-size:.95rem; padding:8px 10px;
    border:1px solid var(--pip-border); border-radius:8px; background:#fffef8; box-sizing:border-box;
  }

  /* Shared notice/to-do status control (2026-09-09, replacing an earlier per-person
     Reading/Discussing tracker): sits above the shared Approved/Request Review controls,
     deliberately styled lighter/quieter than them -- it's the same New/Received/In
     Progress/Blocked/Completed status as the linked to-do (STATUS_LABELS/STATUS_ORDER),
     editable by anyone, exactly like a to-do row's own status select. */
  .desk-window .progress-block{ margin-bottom:12px; }
  .desk-window .progress-rows{ display:flex; flex-direction:column; gap:5px; }
  .desk-window .progress-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-family:'Nunito',sans-serif; font-size:.82rem;
  }
  .desk-window .progress-value{ color:var(--wood-dark); opacity:.7; }
  .desk-window .progress-select{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.72rem; border:1px solid var(--pip-border);
    border-radius:6px; padding:3px 6px; background:#fffef8; color:var(--wood-dark); cursor:pointer;
  }

  /* Overlays */
  .overlay{
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    padding:3%;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .overlay .bg{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .overlay .scrim{ position:absolute; inset:0; background:rgba(15,9,4,.55); }
  .overlay .panel{
    position:relative; z-index:2; width:100%; max-width:1300px; height:100%; max-height:94%; overflow:auto;
    background:rgba(250,243,227,.22); border:4px solid var(--pip-border);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    padding:16px 16px 20px; border-radius:16px;
    box-shadow:0 25px 60px -12px rgba(0,0,0,.65);
  }
  .overlay .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .overlay .panel-head h3{
    font-family:'Kalam',cursive; margin:0; color:var(--cream); font-size:1.2rem;
    text-shadow:0 1px 3px rgba(0,0,0,.6), 0 0 8px rgba(0,0,0,.4);
  }
  .overlay .closebtn{
    background:var(--wood-dark); color:var(--cream); border:none; width:30px; height:30px;
    border-radius:50%; font-size:1rem; cursor:pointer; line-height:1;
  }
  /* File Cabinet folder menu */
  .folder-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .folder-card{
    position:relative;
    display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left;
    background:var(--card); border:1px solid var(--pip-border); border-radius:10px;
    padding:14px; cursor:pointer; font-family:'Nunito',sans-serif;
  }
  .folder-card:hover{ background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .folder-card .folder-icon{ font-size:1.6rem; }
  .folder-card .folder-name{ font-family:'Kalam',cursive; font-size:1rem; color:var(--wood-dark); }
  .folder-card .folder-count{ font-size:.75rem; color:var(--wood); }
  /* Live count of items with a pending approval notice filed somewhere under this folder --
     same red-circle treatment as a hotspot's pending badge, so the two read as one language. */
  .folder-card .folder-pending-badge{
    position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; padding:0 5px;
    border-radius:10px; background:#a33; color:#fff; font-family:'Nunito',sans-serif;
    font-weight:700; font-size:.7rem; display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  /* Gallery (17 September 2026): thumbnail grid, same card language as .folder-card/.item-card
     (solid --card background, so default dark-on-light text needs no cream override -- see the
     brown-on-brown note above this block). .gallery-thumb uses object-fit:cover in a fixed
     square so mixed-aspect photos still line up into a tidy grid. */
  .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
  .gallery-card{
    display:flex; flex-direction:column; gap:6px; text-align:left;
    background:var(--card); border:1px solid var(--pip-border); border-radius:10px;
    padding:8px; cursor:pointer; font-family:'Nunito',sans-serif;
  }
  .gallery-card:hover{ background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .gallery-thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:6px;
    background:var(--pip-border);
  }
  .gallery-caption{
    font-size:.76rem; color:var(--wood-dark); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;
  }
  .gallery-upload-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .gallery-upload-status{ font-family:'Kalam',cursive; color:var(--cream); font-size:.85rem; }
  .gallery-viewer-img{
    display:block; max-width:100%; max-height:60vh; margin:0 auto 12px;
    border-radius:8px; box-shadow:0 3px 10px rgba(0,0,0,.3);
  }

  .backbtn{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.8rem; cursor:pointer;
    background:transparent; border:1.5px solid var(--pip-border); color:var(--wood-dark);
    border-radius:8px; padding:6px 10px; margin-bottom:10px;
  }
  .empty-note{ font-family:'Kalam',cursive; color:var(--wood-dark); opacity:.8; margin:6px 2px 14px; }

  /* Text sitting directly on an overlay panel's own translucent backdrop -- not inside a
     solid-card row/folder-card/item-card, which already carry their own light `--card`
     background and stay dark-on-light regardless -- was reading as dark wood-brown text on
     a scrim-darkened photo, i.e. barely legible "brown on brown" (reported directly, 17
     September 2026, first noticed in the Format Legal Docs tool but the same everywhere a
     label/note/back button/ghost button floats free on a panel). panel-body's own inherited
     colour covers anything with no explicit colour of its own (labels, plain notes); the few
     classes below set their own colour explicitly and need their own cream override. The two
     exceptions put wood-dark back: a ghost button that IS sitting inside one of those solid
     cards (e.g. a row's own "Desktop" button) was already fine and must stay dark-on-light. */
  .overlay .panel-body{ color:var(--cream); }
  .overlay .panel-body .notes-label{ color:var(--cream); }
  .overlay .panel-body .empty-note{ color:var(--cream); opacity:.92; }
  .overlay .panel-body .backbtn{ color:var(--cream); border-color:rgba(255,255,255,.55); }
  .overlay .panel-body .bin-count{ color:var(--cream); }
  .overlay .panel-body .btn.ghost{ color:var(--cream); border-color:rgba(255,255,255,.55); }
  .overlay .panel-body .item-row .btn.ghost,
  .overlay .panel-body .bin-item .btn.ghost,
  .overlay .panel-body .item-series .btn.ghost{ color:var(--wood-dark); border-color:var(--pip-border); }

  /* Second pass on the same bug (17 September 2026, reported again -- "calendar, new note
     etc" still brown-on-brown): the first pass only caught classes with NO colour of their
     own, which inherit panel-body's cream automatically. These calendar/to-do classes set
     colour:var(--wood-dark) explicitly, so the inherited cream never reached them -- an
     explicit colour always wins over an inherited one regardless of the ancestor rule's
     specificity. Their siblings that already sit on a solid --card background (.cal-daynum
     in a .cal-cell, .cal-event-chip, .cal-ev-title in a .detail) were correctly left alone. */
  .overlay .panel-body .cal-nav h4,
  .overlay .panel-body .cal-daylabel,
  .overlay .panel-body .cal-day-heading,
  .overlay .panel-body .todo-section-heading,
  .overlay .panel-body .todo-empty{ color:var(--cream); }

  /* The "New Notice / Document" composer (openCreatePanel) is the one overlay panel that was
     never wrapped in .panel-body at all -- its label/button/input sit directly in .panel, so
     none of the .panel-body-scoped rules above ever reached it. Giving the panel itself a
     cream default fixes every plain-text child (the template-picker label, the "requires
     approval" checkbox text, the linked-document name) the same way panel-body does elsewhere;
     .btn.ghost still needs its own explicit override, same reason as above. The two inputs
     and the existing-notice warning box already carry their own light background and stay
     dark-on-light correctly, so they're deliberately not touched here. */
  .overlay .panel.create-form{ color:var(--cream); }
  .overlay .panel.create-form .btn.ghost{ color:var(--cream); border-color:rgba(255,255,255,.55); }

  .item-list{ display:grid; gap:8px; }

  /* A row in the Notice Board / File Cabinet / Bookshelf item list: title + a "Desktop"
     button only, no preview -- see buildItemListEl's comment for why. */
  .item-row{
    display:flex; align-items:center; justify-content:flex-start; gap:10px;
    background:var(--card); border:1px solid var(--pip-border); border-radius:8px;
    padding:10px 12px; font-family:'Nunito',sans-serif; font-size:.9rem;
  }
  .item-row:hover{ background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  /* flex:1 so the title alone absorbs all the row's slack width -- previously every badge
     (status/decision) and the Desktop button shared `justify-content:space-between`'s leftover
     space between them too, so their horizontal position drifted row to row depending on how
     long each title happened to be, instead of sitting as one steady, right-anchored group
     (reported directly, 10 September 2026, from a screenshot showing them "all over the
     place"). With the title alone taking the slack, everything after it -- badges, then
     Desktop -- now sits flush together against the row's right edge on every row. */
  .item-row-title{
    flex:1 1 auto;
    font-family:'Kalam',cursive; font-size:1rem; color:var(--wood-dark);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
  }
  .item-row .send-row{ flex:none; font-size:.78rem; padding:6px 10px; }
  /* Marks a document that has a pending (unapproved, not yet review-requested-and-resolved)
     approval notice linked to it -- in a list row, and again inside its own desk panel. */
  .pending-notice-badge{
    flex:none; font-family:'Nunito',sans-serif; font-weight:700; font-size:.68rem;
    color:#fff; background:var(--terracotta); border-radius:6px; padding:3px 7px;
  }
  .item-row .pending-notice-badge{ margin-right:4px; }
  /* A notice row's shared status, at a glance in the Notice Board list -- same status as
     the linked to-do (see buildItemListEl and renderDeskPanelBody's Status control), shown
     read-only here since this list stays click-to-open for anything editable. */
  .item-row-status{
    flex:none; font-family:'Nunito',sans-serif; font-weight:700; font-size:.68rem;
    color:var(--wood-dark); background:#efe9dc; border:1px solid var(--pip-border);
    border-radius:6px; padding:3px 7px; margin-right:4px; opacity:.85;
  }
  /* A notice's OWN decision -- separate from the to-do-status chip above, which only says
     how the linked task is progressing, not whether the notice itself has been approved
     (2026-09-10, after that exact gap let a to-do read "Completed" with nothing approved).
     Same colour language as the open panel's .approval-meta states, so the two always agree. */
  .item-row-decision{
    flex:none; font-family:'Nunito',sans-serif; font-weight:700; font-size:.68rem;
    border-radius:6px; padding:3px 7px; margin-right:4px;
  }
  .item-row-decision.decision-pending{ color:var(--wood-dark); background:#efe9dc; border:1px solid var(--pip-border); opacity:.7; }
  .item-row-decision.decision-approved{ color:#fff; background:var(--moss); }
  .item-row-decision.decision-review{ color:#fff; background:var(--terracotta); }
  /* A same-series revision group (9 September 2026), collapsed into one row in the item
     list -- see groupIntoSeries/buildItemListEl. Purely a display grouping: no data changes,
     every revision is still its own full row (with its own Desktop button) once expanded. */
  .item-series{
    border:1px solid var(--pip-border); border-radius:8px; background:var(--card);
    overflow:hidden;
  }
  .item-series-header{
    display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box;
    padding:10px 12px; font:inherit; background:none; border:none; cursor:pointer;
    text-align:left;
  }
  .item-series-header:hover{ background:#fff; }
  .item-series-title{
    flex:1; min-width:0; font-family:'Kalam',cursive; font-size:1rem; color:var(--wood-dark);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .item-series-count{
    flex:none; font-family:'Nunito',sans-serif; font-weight:700; font-size:.68rem;
    color:var(--wood-dark); background:#efe9dc; border:1px solid var(--pip-border);
    border-radius:6px; padding:3px 7px; opacity:.85;
  }
  .item-series-chevron{
    flex:none; font-size:.75rem; color:var(--wood-dark); opacity:.6;
    transition:transform .15s ease;
  }
  .item-series.open .item-series-chevron{ transform:rotate(90deg); }
  .item-series-members{
    display:none; flex-direction:column; gap:6px; padding:0 10px 10px; box-sizing:border-box;
  }
  .item-series.open .item-series-members{ display:flex; }
  .item-series-members .item-row{ margin-left:16px; background:#fffef8; }
  .doc-page .pending-notice-link{
    display:inline-flex; align-items:center; gap:6px; font-family:'Nunito',sans-serif; font-weight:700;
    font-size:.82rem; border:1.5px solid var(--terracotta); background:#fff; color:var(--terracotta);
    border-radius:8px; padding:7px 11px; cursor:pointer; margin:2px 0 14px;
  }

  .item-group{ display:grid; gap:0; }
  .item-card{
    text-align:left; width:100%; background:var(--card); border:1px solid var(--pip-border); border-radius:8px;
    padding:10px 12px; cursor:pointer; font-family:'Nunito',sans-serif; font-size:.9rem;
  }
  .item-card b{ display:block; font-family:'Kalam',cursive; font-size:1rem; color:var(--wood-dark); margin-bottom:2px; }
  .item-date{ display:block; font-family:'Nunito',sans-serif; font-size:.7rem; color:var(--wood); opacity:.8; margin-bottom:4px; }
  .item-card:hover{ background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .item-group.open .item-card{
    border-radius:8px 8px 0 0; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }

  .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }

  .detail{
    background:var(--card); border:1px solid var(--pip-border); border-top:none;
    border-radius:0 0 8px 8px; padding:0 12px 12px; display:none;
  }
  .item-group.open .detail{ display:block; }
  .detail .actions{
    display:flex; gap:8px; flex-wrap:wrap;
    position:sticky; top:0; z-index:1; background:var(--card);
    margin:0 -12px 10px; padding:10px 12px 8px; border-bottom:1px solid var(--pip-border);
  }
  .btn{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.85rem; border:none;
    border-radius:8px; padding:8px 12px; cursor:pointer; background:var(--moss); color:#fff;
  }
  .btn.alt{ background:var(--terracotta); }
  .btn.ghost{ background:transparent; border:1.5px solid var(--pip-border); color:var(--wood-dark); }
  .btn.danger{ background:#a33; }
  .btn:disabled{ opacity:.5; cursor:default; }

  /* Annotate Photo tool (23 September 2026): canvas-based arrow/text annotation over an
     uploaded or existing (Gallery) photo. Toolbar buttons mirror .btn/.btn.ghost's language;
     .annotate-tool-btn.active marks whichever of Arrow/Text is the current draw mode. */
  .annotate-source-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .annotate-toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .annotate-tool-btn.active{ background:var(--terracotta); color:#fff; border-color:var(--terracotta); }
  .annotate-color-input{ width:34px; height:34px; padding:0; border:1.5px solid var(--pip-border); border-radius:8px; background:none; cursor:pointer; }
  .annotate-size-label{ display:flex; align-items:center; gap:6px; font-family:'Nunito',sans-serif; font-size:.8rem; color:var(--wood-dark); opacity:.85; }
  .annotate-size-input{ width:90px; cursor:pointer; }
  .annotate-canvas-wrap{ position:relative; display:inline-block; max-width:100%; margin-bottom:12px; }
  .annotate-canvas-wrap canvas{ display:block; max-width:100%; border-radius:8px; box-shadow:0 3px 10px rgba(0,0,0,.3); touch-action:none; cursor:crosshair; }
  .annotate-text-input{
    position:absolute; font-family:'Nunito',sans-serif; font-size:.9rem; padding:3px 6px;
    border:1.5px dashed var(--terracotta); border-radius:4px; background:#fffef8; z-index:2; min-width:60px;
  }

  /* To-Do List */
  .todo-add{ display:flex; gap:8px; margin-bottom:16px; }
  .todo-add input[type=text]{
    flex:1; font-family:'Kalam',cursive; font-size:1.05rem; padding:8px 10px;
    border:1px solid var(--pip-border); border-radius:8px; background:#fffef8; box-sizing:border-box;
  }
  .todo-section-heading{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.75rem; text-transform:uppercase;
    letter-spacing:.04em; color:var(--wood-dark); opacity:.75; margin:18px 0 8px;
  }
  .todo-section-heading:first-of-type{ margin-top:0; }
  .todo-list{ display:grid; gap:8px; list-style:none; margin:0; padding:0; }
  .todo-row{
    display:flex; align-items:flex-start; gap:8px; background:var(--card); border:1px solid var(--pip-border);
    border-left:4px solid var(--wood-light); border-radius:8px; padding:9px 11px; font-family:'Nunito',sans-serif;
  }
  /* "new" is the true default -- a task nobody has looked at yet -- so it gets a muted,
     dashed indicator distinct from "received" (a real person has explicitly acknowledged
     it), rather than looking like just another flavor of the same solid-border states. */
  .todo-row[data-status="new"]{ border-left-color:#9a938a; border-left-style:dashed; }
  .todo-row[data-status="received"]{ border-left-color:var(--wood-light); }
  .todo-row[data-status="in_progress"]{ border-left-color:#3a7ab8; }
  .todo-row[data-status="blocked"]{ border-left-color:#a33; }
  .todo-row[data-status="completed"]{ border-left-color:var(--moss); opacity:.72; }
  .todo-row.dragging{ opacity:.4; }
  .todo-drag-handle{
    flex:none; cursor:grab; touch-action:none; color:var(--wood-dark); opacity:.55; font-size:1.1rem;
    padding:2px 2px; line-height:1; user-select:none; margin-top:1px;
  }
  .todo-row.no-drag .todo-drag-handle{ visibility:hidden; }
  .todo-body{ flex:1; min-width:0; }
  .todo-text{ font-family:'Kalam',cursive; font-size:1rem; color:var(--wood-dark); word-break:break-word; }
  .todo-row[data-status="completed"] .todo-text{ text-decoration:line-through; }
  .todo-meta{ font-size:.72rem; color:var(--wood-dark); opacity:.75; margin-top:3px; }
  /* A linked notice's own approval decision, shown right on its to-do row -- reuses
     .item-row-decision (see the Notice Board list's own copy, buildItemRow) so the two
     always read the same way; just needs its own top margin outside that flex row context. */
  .todo-decision-wrap{ margin-top:4px; }
  .todo-controls{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .todo-status-select{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.72rem; border:1px solid var(--pip-border);
    border-radius:6px; padding:3px 6px; background:#fffef8; color:var(--wood-dark); cursor:pointer;
  }
  .todo-row-actions{ display:flex; gap:6px; }
  .todo-open-notice, .todo-history-toggle, .todo-delete{
    font-family:'Nunito',sans-serif; font-size:.68rem; border:none; background:transparent; cursor:pointer;
    color:var(--wood-dark); opacity:.65; padding:0; text-decoration:underline;
  }
  .todo-delete{ color:#a33; }
  .todo-open-notice{ color:var(--moss); opacity:.85; }
  .todo-history{ display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--pip-border); }
  .todo-history.show{ display:block; }
  .todo-history ul{ margin:0; padding-left:16px; font-size:.72rem; color:var(--wood-dark); opacity:.85; }
  .todo-history li{ margin-bottom:2px; }
  .todo-empty{ font-family:'Kalam',cursive; color:var(--wood-dark); opacity:.7; margin:0 0 14px; }

  /* Settings menu, next to the "Signed in as ..." badge */
  .settings-btn{
    position:absolute; top:1.5%; right:3%; z-index:6; margin-top:34px;
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--wood);
    background:var(--cream); color:var(--wood-dark); font-size:.85rem; cursor:pointer;
    display:none; align-items:center; justify-content:center; box-shadow:2px 3px 6px rgba(0,0,0,.25);
  }
  @media (min-width:760px){ .settings-btn{ margin-top:38px; } }
  .settings-popover{
    position:absolute; top:calc(1.5% + 64px); right:3%; z-index:7; display:none;
    background:var(--cream); border:2px solid var(--wood); border-radius:12px; padding:14px;
    width:230px; box-shadow:2px 4px 10px rgba(0,0,0,.3); font-family:'Nunito',sans-serif;
  }
  .settings-popover.show{ display:block; }
  .settings-popover h5{ font-family:'Kalam',cursive; margin:0 0 8px; font-size:.95rem; color:var(--wood-dark); }
  .settings-popover input[type=password]{
    width:100%; font-size:.85rem; padding:6px 8px; margin-bottom:6px;
    border:1px solid var(--pip-border); border-radius:6px; background:#fffef8; box-sizing:border-box;
  }
  .settings-popover .btn{ font-size:.78rem; padding:6px 10px; }
  .settings-msg{ font-size:.72rem; margin:4px 0 8px; }
  .settings-msg.err{ color:#a33; }
  .settings-msg.ok{ color:var(--moss); }
  .settings-divider{ border:none; border-top:1px solid var(--pip-border); margin:10px 0; }

  /* Recycle Bin */
  .bin-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .bin-count{ font-family:'Nunito',sans-serif; font-size:.85rem; color:var(--wood-dark); }
  .bin-item{
    display:flex; align-items:flex-start; gap:10px; background:var(--card); border:1px solid var(--pip-border);
    border-radius:8px; padding:10px 12px; font-family:'Nunito',sans-serif; font-size:.9rem;
  }
  .bin-item input[type=checkbox]{ margin-top:3px; width:18px; height:18px; flex:none; accent-color:var(--moss); }
  .bin-item .bin-item-body{ flex:1; min-width:0; }
  .bin-item .bin-item-body b{ display:block; font-family:'Kalam',cursive; font-size:1rem; color:var(--wood-dark); margin-bottom:2px; }
  .bin-item .bin-item-actions{ flex:none; display:flex; gap:6px; flex-wrap:wrap; }

  /* Calendar */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav h4{ font-family:'Kalam',cursive; margin:0; font-size:1.1rem; color:var(--wood-dark); }
  .cal-nav .navbtn{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.9rem; border:none;
    border-radius:8px; padding:6px 12px; cursor:pointer; background:var(--moss); color:#fff;
  }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-daylabel{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:.7rem; text-align:center;
    color:var(--wood-dark); opacity:.7; padding:4px 0;
  }
  .cal-cell{
    min-height:58px; background:var(--card); border:1px solid var(--pip-border); border-radius:6px;
    padding:4px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:2px;
    font-family:'Nunito',sans-serif;
  }
  .cal-cell:hover{ background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .cal-cell.other-month{ opacity:.4; }
  .cal-cell.today{ border-color:var(--terracotta); border-width:2px; }
  .cal-cell .cal-daynum{ font-family:'Kalam',cursive; font-size:.9rem; color:var(--wood-dark); }
  .cal-event-chip{
    font-size:.62rem; background:var(--moss); color:#fff; border-radius:4px; padding:1px 4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cal-event-chip.more{ background:transparent; color:var(--wood-dark); opacity:.75; padding-left:0; }
  .cal-day-heading{ font-family:'Kalam',cursive; margin:0 0 10px; color:var(--wood-dark); font-size:1.15rem; }
  .cal-ev-title{ display:block; font-family:'Kalam',cursive; font-size:1rem; color:var(--wood-dark); margin-bottom:4px; }
  .cal-day-events{ display:grid; gap:8px; margin-bottom:16px; }
  .cal-day-add{ border-top:1px solid var(--pip-border); padding-top:14px; }
  .cal-day-add input[type=text]{
    width:100%; font-family:'Kalam',cursive; font-size:1.05rem; padding:8px 10px; margin-bottom:8px;
    border:1px solid var(--pip-border); border-radius:8px; background:#fffef8; box-sizing:border-box;
  }
  .cal-day-add textarea{
    width:100%; min-height:70px; font-family:'Kalam',cursive; font-size:1rem; padding:8px 10px; margin-bottom:8px;
    border:1px solid var(--pip-border); border-radius:8px; background:#fffef8; resize:vertical; box-sizing:border-box;
  }

  .edit-mode input[type=text], .edit-mode textarea{
    width:100%; font-family:'Kalam',cursive; font-size:1rem; padding:8px 10px; margin-bottom:8px;
    border:1px solid var(--pip-border); border-radius:8px; background:#fffef8; box-sizing:border-box;
  }
  .edit-mode textarea{ min-height:140px; resize:vertical; }

  /* Expanded viewable doc overlay (opened via "Send to desk") */
  .doc-panel{ max-height:94%; max-width:900px; }
  .doc-page{
    background:#fffdf6; border-radius:6px; padding:22px 20px; box-shadow:0 2px 10px rgba(0,0,0,.15);
    font-family:'Kalam',cursive; font-size:1.05rem; line-height:1.5; white-space:pre-wrap;
  }
  /* Markdown display for synced documents (21 September 2026) -- see renderMarkdownInto. */
  .doc-page.md-doc{ white-space:normal; font-family:'Nunito',sans-serif; font-size:.95rem; line-height:1.55; max-width:860px; margin:0 auto; }
  .doc-page.md-doc .md-h{ font-family:'Kalam',cursive; color:var(--wood-dark); line-height:1.25; margin:1.4em 0 .4em; }
  .doc-page.md-doc h2.md-h{ font-size:1.5rem; border-bottom:2px solid var(--pip-border); padding-bottom:3px; }
  .doc-page.md-doc h3.md-h{ font-size:1.25rem; }
  .doc-page.md-doc h4.md-h{ font-size:1.1rem; margin-bottom:.3em; }
  .doc-page.md-doc h5.md-h, .doc-page.md-doc h6.md-h{ font-size:1rem; }
  .doc-page.md-doc p{ margin:.55em 0; }
  .doc-page.md-doc ul, .doc-page.md-doc ol{ margin:.4em 0 .6em; padding-left:1.4em; }
  .doc-page.md-doc li{ margin:.15em 0; }
  .doc-page.md-doc blockquote{ margin:.7em 0; padding:.1em 0 .1em 12px; border-left:3px solid var(--pip-border); background:#f8f6ec; }
  .doc-page.md-doc code{ font-family:Consolas,Menlo,monospace; font-size:.85em; background:#f1ede0; border-radius:3px; padding:0 4px; }
  .doc-page.md-doc pre{ background:#f1ede0; border-radius:6px; padding:8px 10px; overflow-x:auto; }
  .doc-page.md-doc pre code{ background:transparent; padding:0; }
  .doc-page.md-doc hr{ border:none; border-top:1px solid var(--pip-border); margin:1.2em 0; }
  .doc-page.md-doc a{ color:#2f6f3a; text-decoration:underline; }
  .doc-page.md-doc .md-tablewrap{ overflow-x:auto; margin:.7em 0; }
  .doc-page.md-doc table{ border-collapse:collapse; font-size:.86rem; min-width:60%; }
  .doc-page.md-doc th, .doc-page.md-doc td{ border:1px solid var(--pip-border); padding:5px 8px; vertical-align:top; text-align:left; }
  .doc-page.md-doc th{ background:#eef4e6; }
  /* Fillable forms (21 September 2026) -- see renderFormBody. */
  .doc-page.fm-form{ max-width:820px; margin:0 auto; white-space:normal; font-family:'Nunito',sans-serif; font-size:.95rem; line-height:1.45; padding:16px 18px 22px; }
  .fm-form h4{ font-family:'Kalam',cursive; }
  .fm-bar{ position:sticky; top:-14px; z-index:3; background:#fffdf6; margin:0 -18px 10px; padding:10px 18px 8px; border-bottom:1px solid var(--pip-border); }
  .fm-bar-top{ display:flex; justify-content:space-between; gap:10px; font-size:.82rem; font-weight:700; color:var(--wood-dark); }
  .fm-save-text{ font-weight:400; opacity:.75; text-align:right; }
  .fm-save-text.bad{ color:#a33; opacity:1; }
  .fm-track{ height:6px; border-radius:3px; background:#e6ecd9; margin:6px 0 8px; overflow:hidden; }
  .fm-fill{ height:100%; width:0; background:var(--moss); transition:width .25s; }
  .fm-bar-btns{ display:flex; gap:8px; flex-wrap:wrap; }

          <img class="scene-bg" src="__ASSET_LOCK_DESKTOP__" alt="The Garden Shed, from outside">

      <!-- A single shared form (2026-09-10, replacing separate #lockFormMobile/#lockFormDesktop
           forms) -- see #lockForm's CSS below for why: having two live password fields in the
           DOM at once, each toggled only by display:none, was the likely cause of repeated
           failed unlock attempts reported directly ("taken 3 attempts... entered my passcode 3
           times"). Only the background art still switches per breakpoint; the form itself, and
           its one password field, now exists exactly once regardless of viewport. -->
      <form class="lock-box" id="lockForm" autocomplete="off">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://lapscltduzkbldfwcemq.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhcHNjbHRkdXprYmxkZndjZW1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMzgxMDQsImV4cCI6MjEwMjkxNDEwNH0.W_jcvK9xX9K66JGilWLNy5bW0FJiCrFBDaVCnnVhncI";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.SHED_PASSPHRASE = null;
  // The display name resolved from whichever passphrase was entered (e.g. "Shaphan" or
  // "Karla"), via the shed_identify_user RPC. Used only for display/attribution -- the
  // actual access gate is still the passphrase itself, checked server-side on every call.
  window.SHED_ACTIVE_USER = null;

  var SAVED_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  // Formats an ISO timestamp (shed_items.updated_at) into a short "Saved ..." line.
  // Returns "" when there's nothing to show, so callers can skip rendering it.
  function fmtSavedDate(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    return "Saved " + SAVED_MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }
  // Same as fmtSavedDate, but appends who last saved it (item.updatedBy), when known.
  function fmtSavedLine(item){
    var d = fmtSavedDate(item.updatedAt);
    if(!d) return "";
    return item.updatedBy ? (d + " by " + item.updatedBy) : d;
  }
  // Updates every active-user badge on the page. Called once the passphrase has been
  // resolved to a name at unlock time. Just the name, not "Signed in as <name>" -- being on
  // this page at all already implies you're signed in, and the shorter badge leaves enough
  // room on mobile to not overlap Pip's speech bubble on the opposite side of the header.
  function updateActiveUserBadge(){
    var name = window.SHED_ACTIVE_USER;
    document.querySelectorAll(".active-user-badge").forEach(function(el){
      if(name){
        el.textContent = name;
        el.style.display = "block";
      } else {
        el.style.display = "none";
      }
    });
    document.querySelectorAll(".settings-btn").forEach(function(el){
      el.style.display = name ? "flex" : "none";
    });
  }

  var CONTENT = {
    board: {
      title: "Notice Board",
      bg: "__ASSET_BOARD__",
      items: []
    },
    todo: {
      title: "To-Do List",
      bg: "__ASSET_BOARD__",
      items: []
    },
    cabinet: {
      title: "File Cabinet",
      bg: "__ASSET_CABINET__",
      items: []
    },
    bookshelf: {
      title: "Bookshelf",
      bg: "__ASSET_BOOKSHELF__",
      items: []
    },
    rug: {
      title: "Info",
      bg: "__ASSET_RUG__",
      items: []
    },
    bin: {
      title: "Recycle Bin",
      bg: "__ASSET_BIN__",
      items: []
    },
    calendar: {
      title: "Calendar",
      bg: "__ASSET_CALENDAR__",
      items: []
    },
    // Gallery (17 September 2026, Founder instruction): photos live here as their own flat
    // (no-folder) location, each item = one shed_items row + exactly one attachment, same
    // convention as every other Cabinet document -- see the migration note on
    // shed_items_location_check and openGallery() below.
    gallery: {
      title: "Gallery",
      bg: "__ASSET_GALLERY__",
      items: []
    }
  };

  // Attachments (shed_item_attachments rows) keyed by item_id, refreshed alongside CONTENT
  // in fetchAllItems -- kept as a flat side-map, the same pattern boardTodoStatus already
  // uses for todos, rather than nested onto each item object.
  var ATTACHMENTS = {};

  // Extra links on a notice (shed_item_links rows, 21 September 2026), keyed by the notice's
  // item id: any number of further documents, photos or web addresses beyond the single
  // "headline" linked_item_id. Same flat side-map pattern as ATTACHMENTS.
  var ITEM_LINKS = {};
  function applyItemLinks(rows){
    ITEM_LINKS = {};
    (rows || []).forEach(function(row){
      if(!ITEM_LINKS[row.item_id]) ITEM_LINKS[row.item_id] = [];
      ITEM_LINKS[row.item_id].push(row);
    });
  }
  // Only ordinary web addresses may be linked (never javascript:, data: etc.).
  function safeHttpUrl(u){
    try{
      var x = new URL(String(u || "").trim());
      return (x.protocol === "http:" || x.protocol === "https:") ? x.href : null;
    }catch(e){ return null; }
  }

  // Reusable notice shapes (shed_notice_templates), loaded once at unlock -- not passphrase
  // sensitive, so this can be fetched even before the New Notice composer is opened.
  var NOTICE_TEMPLATES = [];

  // Item content now lives in Supabase (shed_items table) and is fetched after the
  // passphrase gate succeeds. Deleting an item is a soft-delete (deleted_at gets set) --
  // such rows are routed into CONTENT.bin instead of their original location, and keep
  // their original loc/folder so they can be put back exactly where they came from.
  function applyItems(rows){
    CONTENT.board.items = [];
    CONTENT.cabinet.items = [];
    CONTENT.bookshelf.items = [];
    CONTENT.rug.items = [];
    CONTENT.bin.items = [];
    CONTENT.gallery.items = [];
    (rows || []).forEach(function(row){
      var loc = row.location;
      if(!CONTENT[loc]) return;
      var item = {
        id: row.id, title: row.title, body: row.body, folder: row.folder, source: row.source, loc: loc,
        createdAt: row.created_at, updatedAt: row.updated_at, createdBy: row.created_by, updatedBy: row.updated_by,
        requiresApproval: row.requires_approval, linkedItemId: row.linked_item_id,
        approved: row.approved, approvedBy: row.approved_by, approvedAt: row.approved_at, notes: row.notes,
        reviewRequested: row.review_requested, reviewRequestedBy: row.review_requested_by, reviewRequestedAt: row.review_requested_at,
        todoId: row.todo_id,
        hasReply: row.has_reply, hasUpload: row.has_upload,
        replyBody: row.reply_body, replyBy: row.reply_by, replyAt: row.reply_at
      };
      if(row.deleted_at){
        CONTENT.bin.items.push(item);
      } else {
        CONTENT[loc].items.push(item);
      }
    });
  }

  // Moves an item from its current CONTENT list into the bin's, after a successful
  // shed_delete_item call (which soft-deletes it server-side).
  function moveItemToBin(item){
    if(item.loc && CONTENT[item.loc]){
      var arr = CONTENT[item.loc].items;
      var idx = arr.findIndex(function(it){ return it.id === item.id; });
      if(idx > -1) arr.splice(idx, 1);
    }
    if(!CONTENT.bin.items.some(function(it){ return it.id === item.id; })){
      CONTENT.bin.items.unshift(item);
    }
    updateBoardBadge();
  }

  // Moves an item from the bin back into its original CONTENT list, after a successful
  // shed_restore_item call.
  function moveItemFromBin(item){
    var idx = CONTENT.bin.items.findIndex(function(it){ return it.id === item.id; });
    if(idx > -1) CONTENT.bin.items.splice(idx, 1);
    if(item.loc && CONTENT[item.loc]){
      CONTENT[item.loc].items.unshift(item);
    }
    updateBoardBadge();
  }

  function applyAttachments(rows){
    ATTACHMENTS = {};
    (rows || []).forEach(function(row){
      if(!ATTACHMENTS[row.item_id]) ATTACHMENTS[row.item_id] = [];
      ATTACHMENTS[row.item_id].push(row);
    });
  }

  function fetchAllItems(pass){
    return Promise.all([
      sb.rpc("shed_list_items", { p: pass }),
      sb.rpc("shed_list_attachments", { p: pass }),
      sb.rpc("shed_list_item_links", { p: pass })
    ]).then(function(results){
      var itemsRes = results[0], attachRes = results[1], linksRes = results[2];
      if(itemsRes.error){ throw itemsRes.error; }
      applyItems(itemsRes.data);
      if(!attachRes.error){ applyAttachments(attachRes.data); }
      if(linksRes && !linksRes.error){ applyItemLinks(linksRes.data); }
      updateBoardBadge();
    });
  }

  // Loaded once at unlock -- see NOTICE_TEMPLATES above for why this doesn't need the
  // passphrase-gated fetchAllItems path.
  function fetchNoticeTemplates(){
    return sb.rpc("shed_list_notice_templates", {}).then(function(res){
      if(!res.error){ NOTICE_TEMPLATES = res.data || []; }
    });
  }

  function showApp(){ document.body.classList.add("unlocked"); }
  function showLock(){ document.body.classList.remove("unlocked"); }

  function setLockBtns(disabled){
    var b = document.getElementById("lockBtn");
    if(b) b.disabled = disabled;
  }

  // No persistence: the passphrase is asked for fresh on every visit/reload,
  // it is never written to localStorage or any other browser storage. The resolved
  // display name (SHED_ACTIVE_USER) is likewise held only in memory for this page load.
  //
  // unlockInFlight guards against two submits racing each other on this one form -- some
  // browsers' password-manager autofill can auto-submit a saved credential on its own;
  // without this guard, that auto-submit and a manual tap/Enter shortly after could both call
  // tryUnlock() and interleave in ways that are hard to reason about. With it, a submit that
  // arrives while one is already resolving is simply ignored. (Until 10 September 2026 there
  // were actually TWO lock forms in the DOM at once -- #lockFormMobile/#lockFormDesktop, only
  // one ever display:none'd off per breakpoint -- reported directly as needing 3 passphrase
  // attempts most logins. The likely cause: two live password fields sharing the page gave a
  // password manager two autofill targets to reconcile, and this guard could only make a
  // resulting double-submit fail silently, not prevent it. Collapsed to the single #lockForm
  // above -- one password field, full stop -- which removes that failure mode outright rather
  // than adding another heuristic on top of it.)
  var unlockInFlight = false;
  function tryUnlock(pass){
    if(unlockInFlight) return Promise.resolve(false);
    unlockInFlight = true;
    var err = document.getElementById("lockError");
    setLockBtns(true); err.style.display = "none";
    return sb.rpc("shed_identify_user", { p: pass }).then(function(idRes){
      if(idRes.error){ throw idRes.error; }
      if(!idRes.data){ throw new Error("invalid passphrase"); }
      return Promise.all([fetchAllItems(pass), fetchTodoBadgeCount(pass), fetchNoticeTemplates()]).then(function(){
        window.SHED_PASSPHRASE = pass;
        window.SHED_ACTIVE_USER = idRes.data;
        updateActiveUserBadge();
        showApp();
        setLockBtns(false);
        unlockInFlight = false;
        return true;
      });
    }).catch(function(e){
      setLockBtns(false);
      err.textContent = "That passphrase didn't work. Try again.";
      err.style.display = "block";
      unlockInFlight = false;
      return false;
    });
  }

  document.getElementById("lockForm").addEventListener("submit", function(e){

    // through to the browser's own native submission, which (this form has no `action`)
    // would GET-reload the page and silently drop back to the lock screen, since nothing
    // here is persisted by design.
    e.preventDefault();

  function buildHotspots(stageEl, list){

  // ---- The Desk: any number of items (documents/notices/books) can be open at once, but
  // there's only ever one visible window frame per stage (stageEl._deskFrame). With one item
  // open it's a plain titlebar; with two or more, a browser-style tab strip appears so any
  // open item is always one click away -- see renderDeskChrome. stageEl._deskWindows tracks
  // which items are open, ordered back -> front; the last entry is always the active tab. ----

  function deskWindowFor(stageEl, itemId){
    return (stageEl._deskWindows || []).filter(function(w){ return itemId != null && w.item.id === itemId; })[0] || null;
  }

  function findItemById(id){
    var locs = ["board", "cabinet", "bookshelf", "rug", "bin", "gallery"];
    for(var i = 0; i < locs.length; i++){
      var arr = CONTENT[locs[i]] && CONTENT[locs[i]].items;
      if(!arr) continue;
      for(var j = 0; j < arr.length; j++){
        if(arr[j].id === id) return arr[j];
      }
    }
    return null;
  }

  // Finds the notice whose shared to-do is `todoId`, wherever that notice currently lives --
  // a completed-and-approved notice auto-archives into the File Cabinet's Completed Tasks
  // folder now (10 September 2026; see shed_set_todo_status), so it's no longer safe to
  // assume every notice is still in CONTENT.board the way findNoticeByTodoId's one caller
  // (buildRow's "View Notice" link/decision badge) used to.
  function findNoticeByTodoId(todoId){
    var locs = ["board", "cabinet", "bookshelf", "rug", "bin"];
    for(var i = 0; i < locs.length; i++){
      var arr = CONTENT[locs[i]] && CONTENT[locs[i]].items;
      if(!arr) continue;
      for(var j = 0; j < arr.length; j++){
        if(arr[j].todoId === todoId) return arr[j];
      }
    }
    return null;
  }

  // A notice is created with location='board', and only ever leaves it once approved (auto-
  // archived into the File Cabinet's Completed Tasks folder when its to-do reaches Completed
  // -- see shed_set_todo_status), so an UNapproved notice is always still in CONTENT.board;
  // un-approving one that had been archived moves it straight back (shed_set_notice_approval/
  // shed_request_notice_review). "Pending" here means still awaiting a decision either way --
  // approved is its own resolved state, so an approved notice no longer counts even though
  // requiresApproval stays true -- which is exactly the state this board-only scoping relies
  // on never being violated.
  function pendingNoticesFor(documentId){
    return (CONTENT.board.items || []).filter(function(it){
      return it.requiresApproval && !it.approved && it.linkedItemId === documentId;
    });
  }

  // Shared everywhere a to-do/notice workflow status is shown or set -- the To-Do List, a
  // notice's own desk-panel Status control, and the compact per-row glance in the Notice
  // Board list (buildItemListEl) -- one label/order definition so all three views can never
  // drift apart. A requires-approval notice and its linked to-do (shed_items.todo_id) share
  // this exact same status value in the database (see shed_set_todo_status/shed_list_todos),
  // so this isn't just shared labels -- changing the status from either view changes the
  // same underlying row and both views show the result.
  var STATUS_LABELS = { new:"New", received:"Received", in_progress:"In Progress", blocked:"Blocked", completed:"Completed" };
  var STATUS_ORDER = ["new","received","in_progress","blocked","completed"];

  // Refreshes the small red count badge on the Notice Board hotspot (both stages) to the
  // number of notices still awaiting a decision. Call this after anything that can change
  // that count: initial load, a new notice pinned, an approval/review-request saved, or a
  // notice deleted/restored.
  function updateBoardBadge(){
    var count = (CONTENT.board.items || []).filter(function(it){ return it.requiresApproval && !it.approved; }).length;
    document.querySelectorAll('.hotspot[data-key="board"] .hotspot-badge').forEach(function(el){
      el.textContent = String(count);
      el.classList.toggle("show", count > 0);
    });
  }

  // Refreshes the small red count badge on the To-Do List hotspot (both stages) to the
  // number of tasks not yet ticked off in any way -- i.e. anything other than Completed
  // (Received, In Progress and Blocked all still count, same as the "Active" section of the
  // to-do panel itself). Takes the raw rows from shed_list_todos directly, since -- unlike
  // notices -- to-do tasks aren't part of CONTENT/shed_list_items.
  function updateTodoBadge(todos){
    var count = (todos || []).filter(function(t){ return t.status !== "completed"; }).length;
    document.querySelectorAll('.hotspot[data-key="todo"] .hotspot-badge').forEach(function(el){
      el.textContent = String(count);
      el.classList.toggle("show", count > 0);
    });
  }

  // Lightweight fetch just for the badge count, called at unlock (so the number is right
  // before the to-do panel has ever been opened this session) -- the panel's own loadTodos()
  // keeps it current afterward, since every add/status-change/delete there re-fetches and
  // calls updateTodoBadge() itself.
  function fetchTodoBadgeCount(pass){
    return sb.rpc("shed_list_todos", { p: pass }).then(function(res){
      if(res.error) return;
      updateTodoBadge(res.data);
    });
  }

  // One shared tooltip bubble for the whole page (only one tab can be hovered/touched at a
  // time), appended straight to <body> and positioned with fixed coordinates from the
  // hovered tab's own getBoundingClientRect -- see the .shed-tab-tooltip CSS comment for why
  // it can't just live inside the tab.
  var tabTooltipEl = document.createElement("div");
  tabTooltipEl.className = "shed-tab-tooltip";
  document.body.appendChild(tabTooltipEl);

  function showTabTooltip(tabEl, text){
    tabTooltipEl.textContent = text;
    tabTooltipEl.classList.add("show");
    var r = tabEl.getBoundingClientRect();
    var tw = tabTooltipEl.offsetWidth;
    var left = r.left + r.width / 2 - tw / 2;
    left = Math.max(4, Math.min(left, window.innerWidth - tw - 4));
    tabTooltipEl.style.left = left + "px";
    tabTooltipEl.style.top = (r.top - tabTooltipEl.offsetHeight - 8) + "px";
  }

  function hideTabTooltip(){
    tabTooltipEl.classList.remove("show");
  }

  // Builds (or rebuilds) the maximize/restore button -- shared by both the single-item
  // titlebar and the tab strip's control cluster, since maximize is a property of the one
  // shared frame, not of any individual tab.
  function buildMaximizeBtn(stageEl){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dw-titlebtn";
    btn.innerHTML = "&#10530;";
    var label = stageEl._deskMaximized ? "Restore size" : "Maximize";
    btn.setAttribute("aria-label", label);
    btn.title = label;
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      stageEl._deskMaximized = !stageEl._deskMaximized;
      renderDeskChrome(stageEl);
    });
    return btn;
  }

  // Only rendered next to a window's close x when that window actually remembers where it
  // was opened from (win.cameFrom -- see addToDesk). Reopens that same Notice Board/File
  // Cabinet/Bookshelf list (at the exact folder, for the cabinet) on top of the desk, leaving
  // this window open underneath exactly as it was -- closing that reopened list just reveals
  // it again, so back-and-forth between a list and an item it opened never loses either side.
  // `className` lets the caller use the small in-tab close-button sizing (dw-tab-back) in
  // tabbed mode, or the titlebar's larger round button (dw-titlebtn) in single mode.
  function buildBackBtn(stageEl, win, className){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = className;
    btn.innerHTML = "&#8592;";
    var label = "Back to " + win.cameFrom.label;
    btn.setAttribute("aria-label", label);
    btn.title = label;
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      openPanel(win.cameFrom.key, stageEl, win.cameFrom.path);
    });
    return btn;
  }

  // (Re)builds the whole frame for a stage: hidden when nothing's open, a plain titlebar for
  // exactly one open item, or a tab strip for two or more. Also makes sure every open item's
  // body element is in the DOM and shows only the active (last) one. Call this after any
  // change to stageEl._deskWindows, stageEl._deskMaximized, or which window is active.
  function renderDeskChrome(stageEl){
    // Any tab this rebuild is about to remove or reorder can't fire its own mouseleave
    // (it's gone from the DOM, not moved away from by the pointer), so a tooltip left
    // showing from it would otherwise stay stuck on screen indefinitely -- clear it
    // unconditionally before rebuilding, since every tab-strip change (open, close,
    // switch, maximize/restore) runs through here.
    hideTabTooltip();

    var wins = stageEl._deskWindows || [];
    var frame = stageEl._deskFrame;

    if(wins.length === 0){
      frame.style.display = "none";
      frame.innerHTML = "";
      return;
    }

    frame.style.display = "flex";
    frame.classList.toggle("maximized", !!stageEl._deskMaximized);
    var active = wins[wins.length - 1];

    var header = document.createElement("div");
    header.className = "dw-header" + (wins.length > 1 ? " tabbed" : "");

    if(wins.length > 1){
      var tabRow = document.createElement("div");
      tabRow.className = "dw-tabs";
      wins.forEach(function(w){
        var tab = document.createElement("div");
        tab.className = "dw-tab" + (w === active ? " active" : "");

        var t = document.createElement("span");
        t.className = "dw-tab-title";
        t.textContent = w.item.title;
        tab.appendChild(t);

        // Same "under review" signal as the single titlebar below, just icon-only here --
        // a tab is too narrow for the full badge text.
        var tabTooltipText = w.item.title;
        if(w.item.reviewRequested){
          var flag = document.createElement("span");
          flag.className = "dw-tab-flag";
          flag.textContent = "⚑";
          tab.insertBefore(flag, t.nextSibling);
          tabTooltipText += " — Review Requested";
        }

        // Only the active tab gets a back button -- it's the one actually on screen, and
        // only when it remembers a list it was opened from (win.cameFrom; see addToDesk).
        if(w === active && w.cameFrom){
          tab.appendChild(buildBackBtn(stageEl, w, "dw-tab-back"));
        }

        var closeBtn = document.createElement("button");
        closeBtn.type = "button";
        closeBtn.className = "dw-tab-close";
        closeBtn.innerHTML = "&times;";
        closeBtn.setAttribute("aria-label", "Close " + w.item.title);
        closeBtn.addEventListener("click", function(e){
          e.stopPropagation();
          closeDeskWindow(stageEl, w);
        });
        tab.appendChild(closeBtn);

        tab.addEventListener("click", function(){ bringDeskWindowToFront(stageEl, w); });
        tab.addEventListener("mouseenter", function(){ showTabTooltip(tab, tabTooltipText); });
        tab.addEventListener("mouseleave", hideTabTooltip);
        // Touch devices never get a hover, so a tap shows the tooltip for a couple of
        // seconds instead -- the only way to read a truncated title without opening the tab.
        tab.addEventListener("touchstart", function(){
          showTabTooltip(tab, tabTooltipText);
          clearTimeout(tab._tipTimer);
          tab._tipTimer = setTimeout(hideTabTooltip, 1800);
        }, {passive:true});

        tabRow.appendChild(tab);
      });
      header.appendChild(tabRow);
      header.appendChild(buildMaximizeBtn(stageEl));
    } else {
      var titlebar = document.createElement("div");
      titlebar.className = "dw-titlebar-single";
      var titleEl = document.createElement("b");
      titleEl.textContent = active.item.title;
      titleEl.title = active.item.title;
      titlebar.appendChild(titleEl);

      // "Under review" indicator -- shown the moment this window opens (Notice Board or via
      // a linked to-do's "View Notice"), not only once you're already reading the body below.
      if(active.item.reviewRequested){
        var titlebarBadge = document.createElement("span");
        titlebarBadge.className = "dw-titlebar-badge";
        titlebarBadge.textContent = "⚑ Review Requested";
        titlebar.appendChild(titlebarBadge);
      }

      var btns = document.createElement("div");
      btns.className = "dw-titlebtns";
      btns.appendChild(buildMaximizeBtn(stageEl));
      // Same condition as the tabbed case above: only shown when this window remembers a
      // list it was actually opened from (win.cameFrom; see addToDesk) -- e.g. a notice
      // opened via another notice's linked-document button, or the To-Do List itself, never
      // get one, since neither was opened from a Notice Board/File Cabinet/Bookshelf list.
      if(active.cameFrom){
        btns.appendChild(buildBackBtn(stageEl, active, "dw-titlebtn"));
      }

      var closeBtn2 = document.createElement("button");
      closeBtn2.type = "button";
      closeBtn2.className = "dw-titlebtn";
      closeBtn2.innerHTML = "&times;";
      closeBtn2.setAttribute("aria-label", "Close");
      closeBtn2.title = "Close";
      closeBtn2.addEventListener("click", function(e){
        e.stopPropagation();
        closeDeskWindow(stageEl, active);
      });
      btns.appendChild(closeBtn2);

      titlebar.appendChild(btns);
      header.appendChild(titlebar);
    }

    var bodyWrap = document.createElement("div");
    bodyWrap.className = "dw-body-wrap";
    wins.forEach(function(w){
      w.bodyEl.style.display = (w === active) ? "block" : "none";
      bodyWrap.appendChild(w.bodyEl);
    });

    frame.innerHTML = "";
    frame.appendChild(header);
    frame.appendChild(bodyWrap);
  }

  // Makes `win` the active tab (last in the array) and re-renders the chrome to show it.
  // Also how a window is "brought to front" now that there's only one visible frame -- the
  // name is kept because every existing call site already means exactly this: make this the
  // one showing.
  function bringDeskWindowToFront(stageEl, win){
    var wins = stageEl._deskWindows;
    var idx = wins.indexOf(win);
    if(idx === -1) return;
    if(idx !== wins.length - 1){
      wins.splice(idx, 1);
      wins.push(win);
    }
    renderDeskChrome(stageEl);
  }

  // Removes a window (and its tab) from the desk entirely. Nothing is deleted from Supabase
  // here: being "on the desk" is purely a client-side view, so closing a window just stops
  // showing it -- the item stays exactly where it already lives (cabinet, bookshelf, board,
  // ...). If the closed window was the active tab, whichever is now last becomes active.
  function closeDeskWindow(stageEl, win){
    var wins = stageEl._deskWindows;
    var idx = wins.indexOf(win);
    if(idx > -1) wins.splice(idx, 1);
    if(win.bodyEl && win.bodyEl.parentNode) win.bodyEl.remove();
    renderDeskChrome(stageEl);
  }

  // Sends `item` to the desk: opens a new tab, or -- if that item is already open -- switches
  // to its existing tab instead of opening a duplicate. This is the one entry point every
  // "open on the desk" action goes through: a cabinet/bookshelf/board item's "Desktop"
  // button, a freshly created notice or document, and a notice's linked-document button all
  // call this. `cameFrom` (optional, {key, path, label}) is remembered on the window as
  // win.cameFrom so its desk window can offer a "back" button to whichever Notice Board/File
  // Cabinet/Bookshelf list it was actually opened from -- only the Desktop-button call sites
  // in openPanel's item rows pass this; a notice's own linked-document button, a to-do's
  // "View Notice" link and openTodoDesk all leave it unset, since none of those opened from a
  // list the way a Desktop click does. Passed again on an already-open item (bringing it back
  // to front rather than opening a duplicate) so back always points at the most recent list it
  // was actually (re-)opened from.
  function addToDesk(stageEl, item, cameFrom){
    var existing = item.id != null ? deskWindowFor(stageEl, item.id) : null;
    if(existing){
      if(cameFrom) existing.cameFrom = cameFrom;
      bringDeskWindowToFront(stageEl, existing);
      return existing;
    }
    var win = { item: item, bodyEl: document.createElement("div") };
    if(cameFrom) win.cameFrom = cameFrom;
    win.bodyEl.className = "dw-body";
    stageEl._deskWindows.push(win);
    renderDeskPanelBody(stageEl, win, win.bodyEl);
    // A fillable form opens full size, like the To-Do List: it is far too long for the small card.
    if(isShedForm(item)) stageEl._deskMaximized = true;
    renderDeskChrome(stageEl);
    return win;
  }

  // Sends the To-Do List itself to the desk, the same way any document or notice gets there
  // -- a fixed pseudo-item (its id never collides with a real shed_items id, which are all
  // numeric) so addToDesk's existing dedup logic just brings the same tab forward on a second
  // click instead of opening two. This lets the To-Do List sit in the tab strip alongside a
  // notice opened from one of its own rows (see buildRow's "View Notice" button), rather than
  // closing behind a modal the way the Notice Board/File Cabinet/Bookshelf panels still do.
  function openTodoDesk(stageEl){
    var wasAlreadyOpen = deskWindowFor(stageEl, "__todo_list__") != null;
    addToDesk(stageEl, { id: "__todo_list__", title: "To-Do List", kind: "todo-list" });
    // Opens maximized the moment it's freshly sent to the desk, so the full task list is
    // readable right away rather than starting at the small phone-card default size --
    // only on a genuinely fresh open, so switching back to an already-open tab never
    // overrides a size the user chose themselves in the meantime.
    if(!wasAlreadyOpen){
      stageEl._deskMaximized = true;
      renderDeskChrome(stageEl);
    }
  }

  // Re-renders just this window's body content in place (e.g. after a save-edit changes its
  // title or text) and refreshes the chrome so a changed title shows up in its tab/titlebar
  // immediately, without disturbing any other open tab's content.
  function refreshDeskWindow(stageEl, win){
    win.bodyEl.innerHTML = "";
    renderDeskPanelBody(stageEl, win, win.bodyEl);
    renderDeskChrome(stageEl);
  }

  // A notice's status/approval/review state and its linked to-do's row live in two entirely
  // separate desk-window closures (the notice panel and the To-Do List tab), each with its
  // own local copy of the data -- changing one does NOT touch the other's already-rendered
  // DOM. Reported directly (10 September 2026): approving a notice and changing its status
  // from the notice panel left an already-open To-Do List tab still showing "New" and no
  // approval indicator, because that tab had no way to know anything had changed elsewhere.
  // Call this after any RPC that changes shed_items.approved/review_requested or
  // shed_todos.status succeeds, from wherever it was changed -- it re-renders (via the same
  // refreshDeskWindow used for a saved edit) any other currently-open window that shows the
  // same to-do: the To-Do List tab (always, if open -- it has no single todoId of its own)
  // and any notice panel open on the matching linked notice. `skip` is the window the change
  // was just made in, already updated in place by its own handler, so it isn't redundantly
  // torn down and rebuilt here.
  function refreshRelatedDeskWindows(stageEl, opts){
    opts = opts || {};
    (stageEl._deskWindows || []).slice().forEach(function(w){
      if(opts.skip && w === opts.skip) return;
      if(w.item.kind === "todo-list"){ refreshDeskWindow(stageEl, w); return; }
      if(opts.todoId != null && w.item.todoId === opts.todoId){ refreshDeskWindow(stageEl, w); }
    });
  }

  // Renders the To-Do List's own UI into a desk window's body (see openTodoDesk) -- the same
  // task list that used to live in a standalone modal panel, now living in whichever desk
  // window tab holds it. containerEl is that window's body element (win.bodyEl).
  function renderTodoListBody(stageEl, win, containerEl){
    var todos = [];
    // "new" is the true default for every to-do, whether added manually or auto-created
    // by a trigger (a notice needing approval, a review request) -- nobody has looked at
    // it yet, so it must NOT read as "Received by <name>" until a real person explicitly
    // selects that status themselves. See buildRow()'s updatedLine for where this matters.
    // STATUS_LABELS/STATUS_ORDER are declared once at module scope (see pendingNoticesFor)
    // and shared with the notice desk panel and Notice Board list, so reuse those here too.

    function fmtWhen(iso){
      if(!iso) return "";
      var d = new Date(iso);
      if(isNaN(d.getTime())) return "";
      return SAVED_MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
    }

    function loadTodos(){
      containerEl.innerHTML = '<p class="empty-note">Loading tasks…</p>';
      // Refreshes CONTENT (see fetchAllItems) alongside the to-do fetch, not just the
      // to-dos themselves -- buildRow's "View Notice" link and its Completed-disabling check
      // both read a linked notice's current approved/reviewRequested state off CONTENT, which
      // would otherwise still be whatever it was at unlock.
      Promise.all([
        sb.rpc("shed_list_todos", { p: window.SHED_PASSPHRASE }),
        fetchAllItems(window.SHED_PASSPHRASE)
      ]).then(function(results){
        var res = results[0];
        if(res.error){
          containerEl.innerHTML = "<p class='empty-note'>Couldn't load the to-do list. Please try again.</p>";
          return;
        }
        todos = res.data || [];
        updateTodoBadge(todos);
        renderTodos();
      }).catch(function(){
        containerEl.innerHTML = "<p class='empty-note'>Couldn't load the to-do list. Please try again.</p>";
      });
    }

    function persistReorder(){
      var ids = todos.filter(function(t){ return t.status !== "completed"; }).map(function(t){ return t.id; });
      sb.rpc("shed_reorder_todos", { p: window.SHED_PASSPHRASE, ordered_ids: ids }).then(function(res){
        if(res.error){ alert("Couldn't save the new order. Please try again."); loadTodos(); }
      });
    }

    function renderTodos(){
      containerEl.innerHTML = "";

      var addWrap = document.createElement("div");
      addWrap.className = "todo-add";
      addWrap.innerHTML =
        '<input type="text" class="new-todo-text" placeholder="Add a task...">' +
        '<button type="button" class="btn add-todo">Add</button>';
      function addTask(){
        var input = addWrap.querySelector(".new-todo-text");
        var val = input.value.trim();
        if(!val) return;
        var addBtn = addWrap.querySelector(".add-todo");
        addBtn.disabled = true;
        sb.rpc("shed_add_todo", { p: window.SHED_PASSPHRASE, ttl: val }).then(function(res){
          addBtn.disabled = false;
          if(res.error){ alert("Couldn't add that task. Please try again."); return; }
          loadTodos();
        });
      }
      addWrap.querySelector(".add-todo").addEventListener("click", addTask);
      addWrap.querySelector(".new-todo-text").addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); addTask(); }
      });
      containerEl.appendChild(addWrap);
