  // Annotate Photo (23 September 2026, direct request -- "an image editor in the shed that
  // will allow for adding arrows and text to photos", placed in the Toolbox drawer, photos may
  // come from a fresh upload or an existing Gallery photo, result filed in the Cabinet).
  //
  // Source picking reuses openGalleryImagePicker as-is (already exists, used by the notice
  // composer's photo link and the desk's "Link a gallery photo" -- see its two other call
  // sites) rather than a new picker function, since it already does exactly "browse the
  // Gallery, pick a thumbnail" with no changes needed.
  //
  // The editor itself is a plain 2D canvas: the source photo is drawn once at load, then every
  // arrow/text shape is redrawn from an in-memory `shapes` array on every change (undo/clear are
  // therefore just array edits followed by a redraw, never a canvas-history stack). Pointer
  // position math always goes through the canvas's own getBoundingClientRect() and scales by
  // canvas.width/height against the rect, so it stays correct regardless of the CSS max-width
  // scaling that shrinks the canvas on a narrow window -- there is no fixed on-screen size to
  // assume. Arrow dragging uses native Pointer Events with setPointerCapture, which keeps
  // receiving pointermove/pointerup for that pointer even if it leaves the canvas mid-drag --
  // deliberately chosen over a window-level mouseup listener so there is nothing to leak or
  // clean up if the tool is opened and closed repeatedly in one browser session.
  //
  // A photo picked from the Gallery is loaded from a signed Supabase Storage URL, which is
  // cross-origin -- img.crossOrigin = "anonymous" is set before img.src for that path only, so
  // canvas.toBlob() below doesn't throw on a tainted canvas. A freshly uploaded file instead
  // becomes a same-origin blob: URL via URL.createObjectURL(file), which needs no such flag, but
  // does need revoking (on replace, on "choose a different photo," and on close) or it leaks.
  //
  // Saving mirrors openFormatLegalDocsTool's own save step exactly: shed_add_item(loc:"cabinet",
  // fld:"Annotated Photos", want_upload:true) to create the row, upload the canvas's PNG blob to
  // Storage, then shed_add_attachment to link it -- the same three-call sequence, just with a
  // canvas-produced blob standing in for the Edge Function's returned document blob.
  function openAnnotatePhotoTool(stageEl){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="bg" style="background-image:url(__ASSET_GALLERY__)"></div>' +
      '<div class="scrim"></div>' +
      '<div class="panel">' +
        '<div class="panel-head"><h3>🖊️ Annotate Photo</h3><button class="closebtn" type="button">&times;</button></div>' +
        '<div class="panel-body"></div>' +
      '</div>';
    stageEl.appendChild(overlay);
    requestAnimationFrame(function(){ overlay.classList.add("open"); });
    function close(){
      if(currentObjectUrl){ URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
      overlay.classList.remove("open");
      setTimeout(function(){ overlay.remove(); }, 250);
    }
    overlay.querySelector(".closebtn").addEventListener("click", close);
    var body = overlay.querySelector(".panel-body");

    var MAX_DIM = 900;
    var mode = "arrow";
    var currentColor = "#e53935";
    var shapes = [];
    var baseImg = null;
    var sourceName = "";
    var currentObjectUrl = null;
    var dragging = false;
    var dragStart = null;
    var dragCurrent = null;
    // Lets a placed text annotation be dragged to a new spot after the fact, rather than
    // only ever landing wherever it was first typed -- per direct request (23 September
    // 2026). Grabbing anywhere inside the text's own (padded) bounding box starts the drag;
    // see hitTestText/textShapeBounds below.
    var draggingTextShape = null;
    var dragTextOffset = null;
    // Per-request (23 September 2026): text size is now adjustable. currentFontSize is the
    // size a freshly-placed text gets; selectedTextShape is whichever placed text the size
    // slider is currently driving live (set on creation and on picking up an existing text
    // to drag), so moving the slider resizes that one rather than every piece of text.
    var currentFontSize = 40;
    var selectedTextShape = null;

    body.innerHTML =
      '<div class="annotate-source-row">' +
        '<button type="button" class="btn ghost choose-upload">Upload a Photo…</button>' +
        '<button type="button" class="btn ghost choose-gallery">Choose from Gallery…</button>' +
        '<input type="file" accept="image/*" class="annotate-file-input" style="display:none;">' +
      '</div>' +
      '<p class="empty-note annotate-source-empty">Pick a photo to start marking it up.</p>' +
      '<div class="annotate-editor" style="display:none;">' +
        '<div class="annotate-toolbar">' +
          '<button type="button" class="btn annotate-tool-btn active" data-mode="arrow">↗ Arrow</button>' +
          '<button type="button" class="btn ghost annotate-tool-btn" data-mode="text">🔤 Text</button>' +
          '<input type="color" class="annotate-color-input" value="#e53935" title="Colour">' +
          '<label class="annotate-size-label">Size<input type="range" class="annotate-size-input" min="8" max="100" step="1" title="Text size"></label>' +
          '<button type="button" class="btn ghost annotate-undo">Undo</button>' +
          '<button type="button" class="btn ghost annotate-clear">Clear</button>' +
        '</div>' +
        '<div class="annotate-canvas-wrap"><canvas></canvas></div>' +
        '<p class="empty-note tool-status" style="margin:0 0 10px;"></p>' +
        '<div class="actions"><button type="button" class="btn annotate-save">Save to Cabinet</button><button type="button" class="btn ghost annotate-start-over">Choose a Different Photo</button></div>' +
        '<div class="tool-result" style="margin-top:14px;"></div>' +
      '</div>';

    var sourceRow = body.querySelector(".annotate-source-row");
    var sourceEmpty = body.querySelector(".annotate-source-empty");
    var editorEl = body.querySelector(".annotate-editor");
    var fileInput = body.querySelector(".annotate-file-input");
    var canvas = body.querySelector(".annotate-canvas-wrap canvas");
    var ctx = canvas.getContext("2d");
    var toolBtns = body.querySelectorAll(".annotate-tool-btn");
    var sizeInput = body.querySelector(".annotate-size-input");
    var saveBtn = body.querySelector(".annotate-save");
    var statusEl = body.querySelector(".tool-status");
    var resultEl = body.querySelector(".tool-result");

    // The size a text gets when nothing else has set one: the initial default for a
    // freshly-opened photo (used to seed currentFontSize and the slider in setupEditor) and
    // a defensive fallback in redraw()/textShapeBounds() for a shape with no `.size` of its
    // own. Each placed text otherwise carries its own size, set from currentFontSize at the
    // moment it's created and adjustable afterwards via the size slider.
    function textFontSize(){
      return Math.round(Math.min(canvas.width, canvas.height) * 0.045);
    }

    // Arrowhead sits at (x1,y1) -- the point where the drag STARTED -- pointing away from
    // (x2,y2), per direct request (23 September 2026): drawing "from the thing you're pointing
    // at" reads more naturally than the usual convention of the head landing wherever the
    // drag/mouse is released.
    function drawArrow(x1, y1, x2, y2, color){
      var headLen = Math.max(8, Math.min(canvas.width, canvas.height) * 0.02);
      var angle = Math.atan2(y1 - y2, x1 - x2);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = Math.max(2, Math.min(canvas.width, canvas.height) * 0.006);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - headLen * Math.cos(angle - Math.PI / 6), y1 - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x1 - headLen * Math.cos(angle + Math.PI / 6), y1 - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function redraw(){
      if(!baseImg) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);
      shapes.forEach(function(s){
        if(s.type === "arrow"){
          drawArrow(s.x1, s.y1, s.x2, s.y2, s.color);
        } else if(s.type === "text"){
          ctx.font = "bold " + (s.size || textFontSize()) + "px 'Nunito', sans-serif";
          ctx.fillStyle = s.color;
          ctx.fillText(s.text, s.x, s.y);
        }
      });
      if(dragging && dragStart && dragCurrent){
        drawArrow(dragStart.x, dragStart.y, dragCurrent.x, dragCurrent.y, currentColor);
      }
    }

    function getCanvasPos(evt){
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      return { x: (evt.clientX - rect.left) * scaleX, y: (evt.clientY - rect.top) * scaleY };
    }

    // A little padding on every side so grabbing a placed text doesn't need pixel-perfect
    // precision. fillText's anchor (s.x, s.y) is the text's baseline-left point, so the box
    // extends up by roughly the font size and down a little for descenders.
    function textShapeBounds(s){
      var fontSize = s.size || textFontSize();
      ctx.font = "bold " + fontSize + "px 'Nunito', sans-serif";
      var width = ctx.measureText(s.text).width;
      var pad = 10;
      return {
        left: s.x - pad, right: s.x + width + pad,
        top: s.y - fontSize - pad, bottom: s.y + fontSize * 0.3 + pad
      };
    }

    // Topmost (last-drawn) matching text wins, same as z-order on screen.
    function hitTestText(pos){
      for(var i = shapes.length - 1; i >= 0; i--){
        if(shapes[i].type !== "text") continue;
        var b = textShapeBounds(shapes[i]);
        if(pos.x >= b.left && pos.x <= b.right && pos.y >= b.top && pos.y <= b.bottom) return shapes[i];
      }
      return null;
    }

    function placeTextInput(pos){
      var rect = canvas.getBoundingClientRect();
      var scaleX = rect.width / canvas.width;
      var scaleY = rect.height / canvas.height;
      var input = document.createElement("input");
      input.type = "text";
      input.className = "annotate-text-input";
      input.style.left = (pos.x * scaleX) + "px";
      input.style.top = (pos.y * scaleY) + "px";
      input.style.color = currentColor;
      input.style.fontSize = Math.max(10, Math.round(currentFontSize * scaleY)) + "px";
      body.querySelector(".annotate-canvas-wrap").appendChild(input);
      input.focus();
      var committed = false;
      function commit(){
        if(committed) return;
        committed = true;
        if(input.value && input.value.trim()){
          var shape = { type: "text", x: pos.x, y: pos.y, text: input.value.trim(), color: currentColor, size: currentFontSize };
          shapes.push(shape);
          // Newly-placed text becomes what the size slider drives, so dragging it right
          // after typing resizes what you just made rather than nothing.
          selectedTextShape = shape;
          redraw();
        }
        input.remove();
      }
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); input.blur(); }
        else if(e.key === "Escape"){ committed = true; input.remove(); }
      });
    }

    canvas.addEventListener("pointerdown", function(evt){
      // preventDefault is load-bearing for the text tool: canvas isn't natively focusable, so
      // without this the browser's own default mousedown focus-handling steals focus right back
      // off the <input> placeTextInput just created and focused, blurring it (and so committing
      // an empty, instantly-deleted text box) before a single key can be typed. Found and fixed
      // 23 September 2026 after direct report that the Text tool "does not work at all."
      evt.preventDefault();
      var pos = getCanvasPos(evt);
      if(mode === "text"){
        var hit = hitTestText(pos);
        if(hit){
          // Grabbed an existing text annotation -- drag it instead of placing a new one,
          // and hand the size slider to it so it reflects (and can adjust) this text's size.
          draggingTextShape = hit;
          dragTextOffset = { dx: pos.x - hit.x, dy: pos.y - hit.y };
          selectedTextShape = hit;
          sizeInput.value = hit.size || currentFontSize;
          canvas.setPointerCapture(evt.pointerId);
          return;
        }
        placeTextInput(pos);
        return;
      }
      dragging = true;
      dragStart = pos;
      dragCurrent = pos;
      canvas.setPointerCapture(evt.pointerId);
    });
    canvas.addEventListener("pointermove", function(evt){
      if(draggingTextShape){
        var dragPos = getCanvasPos(evt);
        draggingTextShape.x = dragPos.x - dragTextOffset.dx;
        draggingTextShape.y = dragPos.y - dragTextOffset.dy;
        redraw();
        return;
      }
      if(dragging){
        dragCurrent = getCanvasPos(evt);
        redraw();
        return;
      }
      // Not dragging anything: in Text mode, hint that a placed text can be picked up.
      if(mode === "text"){
        canvas.style.cursor = hitTestText(getCanvasPos(evt)) ? "move" : "crosshair";
      }
    });
    canvas.addEventListener("pointerup", function(evt){
      if(draggingTextShape){
        draggingTextShape = null;
        dragTextOffset = null;
        redraw();
        return;
      }
      if(!dragging) return;
      dragging = false;
      var pos = getCanvasPos(evt);
      var dx = pos.x - dragStart.x, dy = pos.y - dragStart.y;
      if(Math.sqrt(dx * dx + dy * dy) > 6){
        shapes.push({ type: "arrow", x1: dragStart.x, y1: dragStart.y, x2: pos.x, y2: pos.y, color: currentColor });
      }
      dragStart = null;
      dragCurrent = null;
      redraw();
    });

    Array.prototype.forEach.call(toolBtns, function(btn){
      btn.addEventListener("click", function(){
        mode = btn.getAttribute("data-mode");
        canvas.style.cursor = "crosshair";
        // Leaving Text mode: the slider goes back to just setting the default for the next
        // new text, rather than still quietly resizing whatever was last selected.
        if(mode !== "text") selectedTextShape = null;
        Array.prototype.forEach.call(toolBtns, function(b){
          b.classList.toggle("active", b === btn);
          b.classList.toggle("ghost", b !== btn);
        });
      });
    });
    body.querySelector(".annotate-color-input").addEventListener("input", function(e){ currentColor = e.target.value; });
    sizeInput.addEventListener("input", function(e){
      currentFontSize = parseInt(e.target.value, 10) || currentFontSize;
      if(selectedTextShape){
        selectedTextShape.size = currentFontSize;
        redraw();
      }
    });
    body.querySelector(".annotate-undo").addEventListener("click", function(){
      shapes.pop();
      if(selectedTextShape && shapes.indexOf(selectedTextShape) === -1) selectedTextShape = null;
      redraw();
    });
    body.querySelector(".annotate-clear").addEventListener("click", function(){ shapes = []; selectedTextShape = null; redraw(); });

    function setupEditor(img, name){
      baseImg = img;
      sourceName = name || "";
      shapes = [];
      draggingTextShape = null;
      dragTextOffset = null;
      selectedTextShape = null;
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      var scale = Math.min(1, MAX_DIM / Math.max(w, h));
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      currentFontSize = textFontSize();
      sizeInput.value = currentFontSize;
      // The slider's min/max can clamp the assigned value -- read it back so currentFontSize
      // always matches what's actually shown and can't drift from a tiny or huge photo's
      // computed default.
      currentFontSize = parseInt(sizeInput.value, 10) || currentFontSize;
      sourceRow.style.display = "none";
      sourceEmpty.style.display = "none";
      editorEl.style.display = "block";
      resultEl.innerHTML = "";
      statusEl.textContent = "";
      redraw();
    }

    function loadImageFromUrl(url, name, crossOrigin){
      var img = new Image();
      if(crossOrigin) img.crossOrigin = "anonymous";
      img.onload = function(){ setupEditor(img, name); };
      img.onerror = function(){ alert("Couldn't load that photo. Please try again."); };
      img.src = url;
    }

    body.querySelector(".choose-upload").addEventListener("click", function(){ fileInput.click(); });
    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      if(!file) return;
      if(currentObjectUrl){ URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
      var url = URL.createObjectURL(file);
      currentObjectUrl = url;
      loadImageFromUrl(url, file.name, false);
    });
    body.querySelector(".choose-gallery").addEventListener("click", function(){
      openGalleryImagePicker(stageEl, function(item){
        var att = (ATTACHMENTS[item.id] || [])[0];
        if(!att){ alert("That photo doesn't have a file attached."); return; }
        sb.storage.from("shed-attachments").createSignedUrl(att.storage_path, 3600).then(function(res){
          if(res.error || !res.data){ alert("Couldn't open that photo. Please try again."); return; }
          loadImageFromUrl(res.data.signedUrl, item.title, true);
        });
      });
    });
    body.querySelector(".annotate-start-over").addEventListener("click", function(){
      if(currentObjectUrl){ URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
      baseImg = null;
      shapes = [];
      draggingTextShape = null;
      dragTextOffset = null;
      selectedTextShape = null;
      editorEl.style.display = "none";
      sourceRow.style.display = "flex";
      sourceEmpty.style.display = "block";
      fileInput.value = "";
      resultEl.innerHTML = "";
      statusEl.textContent = "";
    });

    saveBtn.addEventListener("click", function(){
      if(!baseImg) return;
      saveBtn.disabled = true;
      resultEl.innerHTML = "";
      statusEl.textContent = "Saving…";
      canvas.toBlob(function(blob){
        if(!blob){
          statusEl.textContent = "";
          resultEl.innerHTML = '<p class="empty-note" style="margin:0;color:#a33;">Couldn\'t create the image file. Please try again.</p>';
          saveBtn.disabled = false;
          return;
        }
        var baseName = (sourceName || "Annotated Photo").replace(/\.[a-zA-Z0-9]+$/, "");
        var outTitle = baseName + " (Annotated).png";
        sb.rpc("shed_add_item", {
          p: window.SHED_PASSPHRASE, loc: "cabinet",
          ttl: outTitle, bdy: "Annotated with the Toolbox's Annotate Photo tool" + (sourceName ? (" from \"" + sourceName + "\".") : "."),
          fld: "Annotated Photos", want_upload: true
        }).then(function(res){
          if(res.error || !res.data) throw new Error("Couldn't file that photo in the Cabinet.");
          var newItem = itemFromRow(res.data, "cabinet");
          CONTENT.cabinet.items.unshift(newItem);
          var safeName = outTitle.replace(/[^a-zA-Z0-9._-]/g, "_");
          var path = newItem.id + "/" + Date.now() + "-" + safeName;
          return sb.storage.from("shed-attachments").upload(path, blob, { contentType: "image/png" }).then(function(upRes){
            if(upRes.error) throw new Error("Filed, but the image itself failed to upload -- open it from Annotated Photos to retry.");
            return sb.rpc("shed_add_attachment", {
              p: window.SHED_PASSPHRASE, item_id: newItem.id, file_name: outTitle, storage_path: path, size_bytes: blob.size
            }).then(function(attRes){
              if(!attRes.error && attRes.data){
                if(!ATTACHMENTS[newItem.id]) ATTACHMENTS[newItem.id] = [];
                ATTACHMENTS[newItem.id].push(attRes.data);
              }
              return { outTitle: outTitle, newItem: newItem };
            });
          });
        }).then(function(result){
          statusEl.textContent = "Done — filed in File Cabinet → Annotated Photos.";
          saveBtn.disabled = false;
          resultEl.innerHTML = '<p class="empty-note" style="margin:0 0 10px;">✅ "' + result.outTitle + '" is ready.</p>' +
            '<div class="actions"></div>';
          var resultActions = resultEl.querySelector(".actions");

          var deskBtn = document.createElement("button");
          deskBtn.type = "button";
          deskBtn.className = "btn ghost";
          deskBtn.textContent = "Desktop";
          deskBtn.addEventListener("click", function(){
            addToDesk(stageEl, result.newItem, { key: "cabinet", path: "Annotated Photos", label: "Annotated Photos" });
            close();
          });
          resultActions.appendChild(deskBtn);

          var annotatedFile = (ATTACHMENTS[result.newItem.id] || [])[0];
          if(annotatedFile){
            var viewBtn = document.createElement("button");
            viewBtn.type = "button";
            viewBtn.className = "btn ghost";
            viewBtn.textContent = "Open";
            viewBtn.addEventListener("click", function(){
              sb.storage.from("shed-attachments").createSignedUrl(annotatedFile.storage_path, 3600).then(function(res){
                if(res.error || !res.data){ alert("Couldn't open that photo. Please try again."); return; }
                window.open(res.data.signedUrl, "_blank");
              });
            });
            resultActions.appendChild(viewBtn);

            var dlBtn = document.createElement("button");
            dlBtn.type = "button";
            dlBtn.className = "btn alt";
            dlBtn.textContent = "Download";
            dlBtn.addEventListener("click", function(){
              sb.storage.from("shed-attachments")
                .createSignedUrl(annotatedFile.storage_path, 3600, { download: annotatedFile.file_name })
                .then(function(res){
                  if(res.error || !res.data){ alert("Couldn't download that photo. Please try again."); return; }
                  window.open(res.data.signedUrl, "_blank");
                });
            });
            resultActions.appendChild(dlBtn);
          }
        }).catch(function(err){
          saveBtn.disabled = false;
          statusEl.textContent = "";
          resultEl.innerHTML = '<p class="empty-note" style="margin:0;color:#a33;">' + (err && err.message ? err.message : "Something went wrong. Please try again.") + '</p>';
        });
      }, "image/png");
    });
  }

  function openCreatePanel(stageEl){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="bg" style="background-image:url(__ASSET_PAPER__)"></div>' +
      '<div class="scrim"></div>' +
      '<div class="panel create-form">' +
        '<div class="panel-head"><h3>New Notice / Document</h3><button class="closebtn" type="button">&times;</button></div>' +
        '<label class="notes-label template-picker-label" style="display:none;">Start from a template</label>' +

        '</div>' +
        '<div class="item-link-add web-add-row" style="display:none; margin-bottom:6px;">' +
          '<input type="text" class="web-url" placeholder="https://…">' +
          '<input type="text" class="web-label" placeholder="Label (optional)">' +
          '<button type="button" class="btn web-add-go">Add</button>' +
          '<span class="web-msg" style="flex-basis:100%; font-size:.78rem; color:#a33;"></span>' +
        '</div>' +
        '<div class="link-chips"></div>' +
        '<div class="existing-notice-warning" style="display:none; background:#fdecea; border:1px solid #c0392b; border-radius:6px; padding:8px 10px; margin-bottom:8px; font-size:.85rem; color:#8a2f22;"></div>' +
        '<div class="actions" style="margin-top:10px;">' +
          '<button class="btn pin">Pin to Notice Board</button>' +
          '<button class="btn alt file">File in Cabinet</button>' +
        '</div>' +
      '</div>';
    stageEl.appendChild(overlay);
    requestAnimationFrame(function(){ overlay.classList.add("open"); });

    function close(){
      overlay.classList.remove("open");
      setTimeout(function(){ overlay.remove(); }, 250);
    }
    overlay.querySelector(".closebtn").addEventListener("click", close);

    var requiresCheck = overlay.querySelector(".requires-approval-check");
    var linkRow = overlay.querySelector(".link-doc-row");
    var linkedLabel = overlay.querySelector(".linked-doc-label");
    var warningBox = overlay.querySelector(".existing-notice-warning");
    var linkedItem = null;       // the FIRST linked document/photo -- becomes the notice's headline link
    var linkedItems = [];        // every document/photo picked, in order
    var webLinks = [];           // {url, label} web addresses picked
    var chipsEl = overlay.querySelector(".link-chips");
    var blockedByExistingNotice = null; // the open notice this document already has, if any
    var pinBtn = overlay.querySelector(".pin");

    // Multiple links (21 September 2026): everything picked below is shown as a removable chip.
    // The first document/photo becomes the notice's headline link (linked_item_id, and what the
    // duplicate-open-notice check looks at); every further document/photo and every web address
    // is saved as a shed_item_links row right after the notice is created.
    function renderChips(){
      linkedItem = linkedItems[0] || null;
      chipsEl.innerHTML = "";
      function chip(text, tag, onRemove){
        var c = document.createElement("span");
        c.className = "link-chip";
        var t = document.createElement("span");
        t.className = "chip-text"; t.textContent = text; t.title = text;
        c.appendChild(t);
        if(tag){ var g = document.createElement("span"); g.className = "chip-tag"; g.textContent = tag; c.appendChild(g); }
        var x = document.createElement("button");
        x.type = "button"; x.textContent = "×"; x.title = "Remove";
        x.addEventListener("click", onRemove);
        c.appendChild(x);
        chipsEl.appendChild(c);
      }
      linkedItems.forEach(function(it, i){
        chip((it.loc === "gallery" ? "🖼️ " : "📄 ") + it.title, i === 0 ? "main" : "", function(){
          linkedItems.splice(i, 1); renderChips();
        });
      });
      webLinks.forEach(function(w, i){
        chip("🔗 " + (w.label || w.url), "", function(){ webLinks.splice(i, 1); renderChips(); });
      });
      checkExistingNotice();
    }
    function addLinkedItem(it){
      if(!linkedItems.some(function(x){ return x.id === it.id; })) linkedItems.push(it);
      renderChips();
    }

    // Notice templates (10 September 2026): reusable shapes saved server-side in
    // shed_notice_templates (see the migration's seed rows -- "founder_review" and
    // "info_request") so a repeatable kind of notice ("ask someone to find/provide
    // something", "a document awaiting Founder approval") doesn't need its title/body/flags
    // re-derived from scratch every time, by a person or by an AI session. Picking one just
    // pre-fills the fields below -- everything stays editable afterward.
    var templatePicker = overlay.querySelector(".template-picker");
    var templatePickerLabel = overlay.querySelector(".template-picker-label");
    // Every notice gets upload capability by default (10 September 2026, Founder instruction:
    // "all new notices should contain an upload or link to core document from the file
    // cabinet") -- picking a template can still override this via its own has_upload flag.
    var wantReply = false, wantUpload = true;
    if(NOTICE_TEMPLATES.length){
      templatePicker.style.display = "";
      templatePickerLabel.style.display = "";
      NOTICE_TEMPLATES.forEach(function(t){
        var opt = document.createElement("option");
        opt.value = t.key;
        opt.textContent = t.label || t.title;
        templatePicker.appendChild(opt);
      });
      templatePicker.addEventListener("change", function(){
        var t = NOTICE_TEMPLATES.filter(function(x){ return x.key === templatePicker.value; })[0];
        wantReply = t ? !!t.has_reply : false;
        wantUpload = t ? !!t.has_upload : false;
        if(t){
          overlay.querySelector(".titlein").value = t.title;
          overlay.querySelector(".bodyin").value = t.body;
          requiresCheck.checked = t.requires_approval;
          requiresCheck.dispatchEvent(new Event("change"));
        }
      });
    }

    // A document can only have one OPEN (undecided) requires-approval notice at a time -- see
    // shed_add_notice's own server-side guard (10 September 2026, added after Karla linked a new
    // notice to a document that already had one open and unresolved, silently creating a second,
    // disconnected notice instead of updating the existing one). This check mirrors that same
    // guard's condition client-side (requiresApproval && !approved, the same test
    // pendingNoticesFor already uses everywhere else), so the conflict shows up here, at the
    // moment a document is picked, instead of only after Pin is clicked and the server rejects it.
    function checkExistingNotice(){
      blockedByExistingNotice = null;
      if(linkedItem){
        var open = pendingNoticesFor(linkedItem.id);
        if(open.length) blockedByExistingNotice = open[0];
      }
      if(blockedByExistingNotice){
        warningBox.style.display = "block";
        warningBox.innerHTML = "";
        var msg = document.createElement("span");
        msg.textContent = "This document already has an open notice awaiting a decision. Open it and use its own Approve/Request Review controls, rather than starting a new one. ";
        warningBox.appendChild(msg);
        var openBtn = document.createElement("button");
        openBtn.type = "button";
        openBtn.className = "btn ghost";
        openBtn.style.cssText = "padding:3px 8px; font-size:.8rem;";
        openBtn.textContent = "Open existing notice";
        openBtn.addEventListener("click", function(){
          close();
          addToDesk(stageEl, blockedByExistingNotice);
        });
        warningBox.appendChild(openBtn);
        pinBtn.disabled = true;
      } else {
        warningBox.style.display = "none";
        warningBox.innerHTML = "";
        pinBtn.disabled = false;
      }
    }

    // Link-a-document row (10 September 2026): now shown for every notice, not only ones
    // requiring approval -- per Founder instruction that every notice should offer an upload
    // or a link to a Core document. The requires-approval checkbox still drives the duplicate-
    // notice check below, since that guard only matters for approval-gated notices.
    requiresCheck.addEventListener("change", function(){
      checkExistingNotice();
    });
    overlay.querySelector(".choose-doc").addEventListener("click", function(){
      openDocumentPicker(stageEl, function(item){ addLinkedItem(item); });
    });

    // "Link a photo..." (17 September 2026): same linkedItem/linkedLabel/checkExistingNotice
    // flow as "Link a document...", just picking from the Gallery instead of the Cabinet --
    // see openGalleryImagePicker, next to openDocumentPicker.
    overlay.querySelector(".choose-photo").addEventListener("click", function(){
      openGalleryImagePicker(stageEl, function(item){ addLinkedItem(item); });
    });

    // "Add a web link..." -- an ordinary http/https address, with an optional label.
    var webAddRow = overlay.querySelector(".web-add-row");
    var webUrlIn = overlay.querySelector(".web-url");
    var webLabelIn = overlay.querySelector(".web-label");
    var webMsgEl = overlay.querySelector(".web-msg");
    overlay.querySelector(".add-web").addEventListener("click", function(){
      webAddRow.style.display = webAddRow.style.display === "none" ? "flex" : "none";
      if(webAddRow.style.display !== "none") webUrlIn.focus();
    });
    function submitWebLink(){
      var href = safeHttpUrl(webUrlIn.value);
      if(!href){ webMsgEl.textContent = "Please enter a full web address starting with http:// or https://"; return; }
      webMsgEl.textContent = "";
      if(!webLinks.some(function(w){ return w.url === href; })) webLinks.push({ url: href, label: webLabelIn.value.trim() });
      webUrlIn.value = ""; webLabelIn.value = ""; webAddRow.style.display = "none";
      renderChips();
    }
    overlay.querySelector(".web-add-go").addEventListener("click", submitWebLink);
    webUrlIn.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submitWebLink(); } });

    // Upload a document (10 September 2026, Founder instruction): the counterpart to "Link a
    // document..." for a file that doesn't exist as a Cabinet document yet -- choosing a file
    // here files it as a new document under the File Cabinet's "From the Desk" folder (the
    // same folder the composer's own "File in Cabinet" button already uses), attaches the
    // actual file to that new document via the existing shed-attachments Storage bucket /
    // shed_item_attachments mechanism, then links it to this notice exactly like "Link a
    // document..." would -- linkedItem/linkedLabel are shared with that flow, so whichever one
    // is used last is what gets linked when Pin/File is clicked.
    var uploadDocBtn = overlay.querySelector(".upload-doc");
    var uploadDocInput = overlay.querySelector(".upload-doc-input");
    uploadDocBtn.addEventListener("click", function(){
      uploadDocInput.click();
    });
    uploadDocInput.addEventListener("change", function(){
      var file = uploadDocInput.files && uploadDocInput.files[0];
      if(!file) return;
      uploadDocBtn.disabled = true;
      linkedLabel.textContent = "Uploading " + file.name + "…";
      sb.rpc("shed_add_item", {
        p: window.SHED_PASSPHRASE, loc: "cabinet", ttl: file.name,
        bdy: "Uploaded from the New Notice box.", fld: "From the Desk", want_upload: true
      }).then(function(res){
        if(res.error || !res.data){
          uploadDocBtn.disabled = false;
          uploadDocInput.value = "";
          linkedLabel.textContent = "";
          alert("Couldn't file that upload in the Cabinet. Please try again.");
          return;
        }
        var newItem = itemFromRow(res.data, "cabinet");
        CONTENT.cabinet.items.unshift(newItem);
        var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        var path = newItem.id + "/" + Date.now() + "-" + safeName;
        sb.storage.from("shed-attachments").upload(path, file).then(function(upRes){
          uploadDocBtn.disabled = false;
          uploadDocInput.value = "";
          addLinkedItem(newItem);
          if(upRes.error){
            linkedLabel.textContent = "File upload failed for " + newItem.title + " — open it from From the Desk to retry";
            return;
          }
          sb.rpc("shed_add_attachment", { p: window.SHED_PASSPHRASE, item_id: newItem.id, file_name: file.name, storage_path: path, size_bytes: file.size }).then(function(attRes){
            if(!attRes.error && attRes.data){
              if(!ATTACHMENTS[newItem.id]) ATTACHMENTS[newItem.id] = [];
              ATTACHMENTS[newItem.id].push(attRes.data);
            }
            linkedLabel.textContent = "";
          });
        });
      });
    });

    function getEntry(){
      var t = overlay.querySelector(".titlein").value.trim() || "Untitled";
      var b = overlay.querySelector(".bodyin").value.trim() || "(no content yet)";
      return {title:t, body:b};
    }
    pinBtn.addEventListener("click", function(){
      if(blockedByExistingNotice) return; // belt and suspenders -- button is disabled in this state anyway
      var entry = getEntry();
      pinBtn.disabled = true;
      sb.rpc("shed_add_notice", {
        p: window.SHED_PASSPHRASE, ttl: entry.title, bdy: entry.body,
        req_approval: requiresCheck.checked, linked_id: linkedItem ? linkedItem.id : null,
        want_reply: wantReply, want_upload: wantUpload
      }).then(function(res){
        pinBtn.disabled = false;
        if(res.error){
          // Surface the server's own message when it has one worth showing (e.g. the
          // duplicate-open-notice guard above, if this was somehow reached anyway -- a race
          // with someone else creating the other notice in between the check and this click) --
          // falling back to the generic message only for an unexplained failure.
          var detail = (res.error && res.error.message) ? res.error.message : "";
          alert(detail || "Couldn't save that to the Notice Board. Please try again.");
          return;
        }
        var item = itemFromRow(res.data, "board");
        CONTENT.board.items.unshift(item);
        updateBoardBadge();
        // Every link beyond the headline one (linked_id above) is recorded as a shed_item_links
        // row, one after another so they keep the order they were picked in.
        var extras = linkedItems.slice(1).map(function(it){ return { p_linked_id: it.id }; })
          .concat(webLinks.map(function(w){ return { p_url: w.url, p_label: w.label || null }; }));
        var failed = 0;
        extras.reduce(function(chain, args){
          return chain.then(function(){
            var params = { p: window.SHED_PASSPHRASE, p_item_id: item.id };
            Object.keys(args).forEach(function(k){ params[k] = args[k]; });
            return sb.rpc("shed_add_item_link", params).then(function(r){
              if(r.error || !r.data){ failed++; return; }
              if(!ITEM_LINKS[item.id]) ITEM_LINKS[item.id] = [];
              ITEM_LINKS[item.id].push(r.data);
            });
          });
        }, Promise.resolve()).then(function(){
          close();
          addToDesk(stageEl, item);
          if(failed) alert("The notice was pinned, but " + failed + " link" + (failed === 1 ? "" : "s") + " couldn't be added. Open the notice and add " + (failed === 1 ? "it" : "them") + " under Links.");
        });
      });
    });
    overlay.querySelector(".file").addEventListener("click", function(){
      var entry = getEntry();
      var fileBtn = overlay.querySelector(".file");
      fileBtn.disabled = true;
      sb.rpc("shed_add_item", { p: window.SHED_PASSPHRASE, loc: "cabinet", ttl: entry.title, bdy: entry.body, fld: "From the Desk" }).then(function(res){
        fileBtn.disabled = false;
        if(res.error){
          alert("Couldn't file that in the Cabinet. Please try again.");
          return;
        }
        var item = itemFromRow(res.data, "cabinet");
        CONTENT.cabinet.items.unshift(item);
        close();
        addToDesk(stageEl, item);
      });
    });
  }
})();
</script>

</body>
</html>
