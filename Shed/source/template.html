      var active = todos.filter(function(t){ return t.status !== "completed"; })
        .sort(function(a,b){ return a.sort_order - b.sort_order; });
      var completed = todos.filter(function(t){ return t.status === "completed"; })
        .sort(function(a,b){ return new Date(b.updated_at) - new Date(a.updated_at); });

      function buildRow(t, draggable){
        var row = document.createElement("div");
        row.className = "todo-row" + (draggable ? "" : " no-drag");
        row.setAttribute("data-status", t.status);
        row.setAttribute("data-id", t.id);

        var handle = document.createElement("span");
        handle.className = "todo-drag-handle";
        handle.textContent = "⠿";
        row.appendChild(handle);

        // A to-do auto-created for a notice (shed_items.todo_id) can be opened straight from
        // here -- same addToDesk every other "open on the desk" action uses, so it lands as
        // another tab right alongside this To-Do List tab, never replacing it.
        var linkedNotice = findNoticeByTodoId(t.id);

        var body = document.createElement("div");
        body.className = "todo-body";
        var createdLine = "Added by " + t.created_by + " on " + fmtWhen(t.created_at);
        // No second line at all while status is still "new" -- there's nothing to report
        // beyond "Added by ..." yet, and showing "New by <name>" would just be a confusing
        // restatement of the same fact under a different label. The moment a real person
        // picks a status from the dropdown below, that becomes a genuine, separate event
        // worth its own line (e.g. "Received by Karla on ...").
        var statusVerb = t.status === "completed" ? "Completed" : STATUS_LABELS[t.status];
        var updatedLine = (t.status !== "new" && t.updated_by) ? (statusVerb + " by " + t.updated_by + " on " + fmtWhen(t.updated_at)) : "";
        // A linked notice's own decision (separate from the to-do status above it) --
        // Karla's own suggestion, and the exact thing missing when a status change made from
        // the notice panel didn't show up here at all (10 September 2026). Same three states,
        // same classes/colours as the Notice Board list's own decision chip (buildItemRow),
        // so the two always read the same way wherever they're seen.
        var decisionHtml = "";
        if(linkedNotice){
          var decisionClass, decisionText;
          if(linkedNotice.approved){
            decisionClass = "decision-approved"; decisionText = "✓ Approved";
          } else if(linkedNotice.reviewRequested){
            decisionClass = "decision-review"; decisionText = "⚑ Review Requested";
          } else {
            decisionClass = "decision-pending"; decisionText = "Not Yet Approved";
          }
          decisionHtml = '<span class="item-row-decision ' + decisionClass + '">' + decisionText + '</span>';
        }
        body.innerHTML =
          '<div class="todo-text"></div>' +
          '<div class="todo-meta">' + createdLine + (updatedLine ? " · " + updatedLine : "") + '</div>' +
          (decisionHtml ? '<div class="todo-decision-wrap">' + decisionHtml + '</div>' : "") +
          '<div class="todo-row-actions">' +
            (linkedNotice ? '<button type="button" class="todo-open-notice">View Notice</button>' : '') +
            '<button type="button" class="todo-history-toggle">History</button>' +
            '<button type="button" class="todo-delete">Delete</button>' +
          '</div>' +
          '<div class="todo-history"><ul></ul></div>';
        body.querySelector(".todo-text").textContent = t.text;
        if(linkedNotice){
          body.querySelector(".todo-open-notice").addEventListener("click", function(){
            addToDesk(stageEl, linkedNotice);
          });
        }
        var histUl = body.querySelector(".todo-history ul");
        (t.history || []).forEach(function(h){
          var li = document.createElement("li");
          li.textContent = STATUS_LABELS[h.status] + " by " + h.set_by + " — " + fmtWhen(h.set_at);
          histUl.appendChild(li);
        });
        body.querySelector(".todo-history-toggle").addEventListener("click", function(){
          body.querySelector(".todo-history").classList.toggle("show");
        });
        body.querySelector(".todo-delete").addEventListener("click", function(){
          if(!confirm('Delete "' + t.text + '"? This can\'t be undone.')) return;
          sb.rpc("shed_delete_todo", { p: window.SHED_PASSPHRASE, todo_id: t.id }).then(function(res){
            if(res.error){ alert("Couldn't delete that task. Please try again."); return; }
            loadTodos();
          });
        });
        row.appendChild(body);

        var controls = document.createElement("div");
        controls.className = "todo-controls";
        var select = document.createElement("select");
        select.className = "todo-status-select";
        // A to-do linked to a notice can't be marked Completed until that notice is actually
        // approved (and has no open review request) -- shed_set_todo_status enforces this
        // server-side; disabling the option here just avoids an error round-trip for the
        // obvious case. Plain manually-added tasks (no linkedNotice) are never restricted.
        var blockCompleted = !!(linkedNotice && (!linkedNotice.approved || linkedNotice.reviewRequested));
        STATUS_ORDER.forEach(function(s){
          var opt = document.createElement("option");
          opt.value = s;
          opt.textContent = STATUS_LABELS[s];
          if(s === "completed" && blockCompleted){
            opt.disabled = true;
            opt.title = "Approve the linked notice (or resolve its review request) before completing this.";
          }
          if(s === t.status) opt.selected = true;
          select.appendChild(opt);
        });
        select.addEventListener("change", function(){
          var newStatus = select.value;
          select.disabled = true;
          sb.rpc("shed_set_todo_status", { p: window.SHED_PASSPHRASE, todo_id: t.id, new_status: newStatus }).then(function(res){
            select.disabled = false;
            if(res.error){
              alert((res.error && res.error.message) || "Couldn't update that task's status. Please try again.");
              select.value = t.status;
              return;
            }
            loadTodos();
            // This tab refreshes itself via loadTodos() above; a notice panel open on the
            // linked notice (its own Status dropdown reads this same to-do row) does not,
            // so tell it directly.
            refreshRelatedDeskWindows(stageEl, { todoId: t.id, skip: win });
          });
        });
        controls.appendChild(select);
        row.appendChild(controls);

        return row;
      }

      // Pointer-based drag reorder (native HTML5 drag-and-drop doesn't fire on touch
      // devices, and this app runs on phones, so plain pointer events drive it instead).
      function makeDraggable(listEl){
        function getRowAfter(y){
          var rows = Array.prototype.slice.call(listEl.querySelectorAll(".todo-row:not(.dragging)"));
          var result = null, closestOffset = -Infinity;
          rows.forEach(function(r){
            var box = r.getBoundingClientRect();
            var offset = y - box.top - box.height / 2;
            if(offset < 0 && offset > closestOffset){ closestOffset = offset; result = r; }
          });
          return result;
        }

        listEl.querySelectorAll(".todo-drag-handle").forEach(function(handle){
          handle.addEventListener("pointerdown", function(e){
            var row = handle.closest(".todo-row");
            if(!row) return;
            e.preventDefault();
            var offsetY = e.clientY - row.getBoundingClientRect().top;
            var rect = row.getBoundingClientRect();
            var placeholder = document.createElement("div");
            placeholder.className = "todo-row";
            placeholder.style.visibility = "hidden";
            placeholder.style.height = rect.height + "px";
            row.parentNode.insertBefore(placeholder, row.nextSibling);
            row.classList.add("dragging");
            row.style.position = "fixed";
            row.style.left = rect.left + "px";
            row.style.top = rect.top + "px";
            row.style.width = rect.width + "px";
            row.style.zIndex = "1000";
            row.style.pointerEvents = "none";
            document.body.appendChild(row);

            function move(ev){
              row.style.top = (ev.clientY - offsetY) + "px";
              var after = getRowAfter(ev.clientY);
              if(after == null){ listEl.appendChild(placeholder); }
              else { listEl.insertBefore(placeholder, after); }
            }
            function up(){
              placeholder.parentNode.insertBefore(row, placeholder);
              placeholder.remove();
              row.classList.remove("dragging");
              row.style.position = ""; row.style.left = ""; row.style.top = "";
              row.style.width = ""; row.style.zIndex = ""; row.style.pointerEvents = "";
              document.removeEventListener("pointermove", move);
              document.removeEventListener("pointerup", up);

              var newOrderIds = Array.prototype.slice.call(listEl.querySelectorAll(".todo-row"))
                .map(function(r){ return +r.getAttribute("data-id"); });
              todos.sort(function(a, b){
                var ia = newOrderIds.indexOf(a.id), ib = newOrderIds.indexOf(b.id);
                if(ia === -1 || ib === -1) return 0;
                return ia - ib;
              });
              persistReorder();
            }
            document.addEventListener("pointermove", move);
            document.addEventListener("pointerup", up);
          });
        });
      }

      var activeHeading = document.createElement("div");
      activeHeading.className = "todo-section-heading";
      activeHeading.textContent = "Active";
      containerEl.appendChild(activeHeading);

      if(active.length === 0){
        var emptyA = document.createElement("p");
        emptyA.className = "todo-empty";
        emptyA.textContent = "No active tasks. Add one above.";
        containerEl.appendChild(emptyA);
      }

      var activeList = document.createElement("div");
      activeList.className = "todo-list";
      active.forEach(function(t){ activeList.appendChild(buildRow(t, true)); });
      containerEl.appendChild(activeList);
      makeDraggable(activeList);

      var completedHeading = document.createElement("div");
      completedHeading.className = "todo-section-heading";
      completedHeading.textContent = "Completed";
      containerEl.appendChild(completedHeading);

      if(completed.length === 0){
        var emptyC = document.createElement("p");
        emptyC.className = "todo-empty";
        emptyC.textContent = "Nothing completed yet.";
        containerEl.appendChild(emptyC);
      }

      var completedList = document.createElement("div");
      completedList.className = "todo-list";
      completed.forEach(function(t){ completedList.appendChild(buildRow(t, false)); });
      containerEl.appendChild(completedList);
    }

    loadTodos();
  }

  // Populates an expanded window's body: the item's own view/edit UI (same Edit/Delete/Save
  // pattern the old single desk overlay had), plus -- only when the item is a notice
  // (requiresApproval) -- a button linking to the document it's requesting approval for, an
  // approval checkbox, and a notes area, each saved independently via shed_set_notice_approval.
  function renderDeskPanelBody(stageEl, win, body){
    var item = win.item;

    // The To-Do List's pseudo-item (see openTodoDesk) gets a completely different body: the
    // task list UI, not a document/notice view. Handled entirely by renderTodoListBody and
    // nothing below this applies to it.
    if(item.kind === "todo-list"){
      renderTodoListBody(stageEl, win, body);
      return;
    }

    // A gallery photo gets a completely different body too -- just the image plus
    // Open/Download/Delete, none of the title/body-edit machinery below applies to it (see
    // renderGalleryImageBody, next to openGallery()).
    if(item.loc === "gallery"){
      renderGalleryImageBody(stageEl, win, item, body);
      return;
    }

    // A synced document marked as a fillable form (first line <!-- shed-form v1 -->) is shown
    // as a real form -- see renderFormBody. Nothing below applies to it.
    if(isShedForm(item) && item.id != null){
      renderFormBody(stageEl, win, item, body);
      return;
    }

    var editable = item.source === "user" && item.id;

    // A notice with requiresApproval gets two extra lines above the usual "Saved ..." line:
    // a subtitle naming the document it concerns (read live off the linked item, so it always
    // matches that document's current title rather than a stale copy) and a "Created ..."
    // line, plus a heading over its body text so that text reads as "things to be aware of"
    // rather than an unlabelled paragraph.
    var noticeSubtitleHtml = "", noticeCreatedHtml = "", bodyHeadingHtml = "";
    // The subtitle naming a linked document is shown whenever a document is linked, not only
    // on approval notices -- "Link a document..."/"Upload a document..." are available on any
    // note, and the saved link should be visible regardless of the approval checkbox (11 Sept
    // 2026, Founder-reported gap: a linked document was saved correctly but never displayed
    // when the note didn't require approval).
    if(item.linkedItemId){
      noticeSubtitleHtml = '<div class="notice-subtitle"></div>';
    }
    if(item.requiresApproval){
      noticeCreatedHtml = '<div class="notice-created"></div>';
      bodyHeadingHtml = '<label class="notes-label" style="margin-top:2px;">Things to be aware of</label>';
    }

    body.innerHTML =
      (editable ? '<div class="actions"><button class="btn ghost edit-item">Edit</button><button class="btn danger delete-item">Delete</button></div>' : '') +
      '<div class="doc-page view-mode"><h4></h4>' + noticeSubtitleHtml + noticeCreatedHtml + '<span class="doc-date"></span>' + bodyHeadingHtml + '<div class="body"></div></div>' +
      (editable ?
        '<div class="edit-mode" style="display:none;">' +
          '<input type="text" class="edit-title">' +
          '<textarea class="edit-body" style="min-height:160px;"></textarea>' +
          '<div class="actions"><button class="btn save-item">Save</button><button class="btn ghost cancel-edit">Cancel</button></div>' +
        '</div>' : '');
    body.querySelector(".doc-page h4").textContent = item.title;
    if(item.source === "synced"){
      // Documents synced from Core are Markdown -- show them formatted, not as raw text.
      body.querySelector(".doc-page").classList.add("md-doc");
      renderMarkdownInto(body.querySelector(".doc-page .body"), item.body);
    } else {
      body.querySelector(".doc-page .body").textContent = item.body;
    }
    body.querySelector(".doc-page .doc-date").textContent = item.source === "user" ? fmtSavedLine(item) : "";
    if(item.linkedItemId){
      var linkedForSubtitle = findItemById(item.linkedItemId);
      body.querySelector(".notice-subtitle").textContent = linkedForSubtitle ? linkedForSubtitle.title : ("Document #" + item.linkedItemId);
    }
    if(item.requiresApproval){
      body.querySelector(".notice-created").textContent = "Created " + (fmtSavedDate(item.createdAt).replace("Saved ", "") || "date unknown");
    }

    if(editable){
      var viewMode = body.querySelector(".view-mode");
      var editMode = body.querySelector(".edit-mode");
      var titleIn = body.querySelector(".edit-title");
      var bodyIn = body.querySelector(".edit-body");

      body.querySelector(".edit-item").addEventListener("click", function(){
        titleIn.value = item.title;
        bodyIn.value = item.body;
        viewMode.style.display = "none";
        editMode.style.display = "block";
      });
      body.querySelector(".cancel-edit").addEventListener("click", function(){
        editMode.style.display = "none";
        viewMode.style.display = "block";
      });
      body.querySelector(".save-item").addEventListener("click", function(){
        var newTitle = titleIn.value.trim() || "Untitled";
        var newBody = bodyIn.value.trim() || "(no content yet)";
        var saveBtn = body.querySelector(".save-item");
        saveBtn.disabled = true;
        sb.rpc("shed_update_item", { p: window.SHED_PASSPHRASE, item_id: item.id, ttl: newTitle, bdy: newBody }).then(function(res){
          saveBtn.disabled = false;
          if(res.error){
            alert("Couldn't save those changes. Please try again.");
            return;
          }
          item.title = res.data.title;
          item.body = res.data.body;
          item.updatedAt = res.data.updated_at;
          item.updatedBy = res.data.updated_by;
          if(item.loc && CONTENT[item.loc]){
            var found = CONTENT[item.loc].items.find(function(it){ return it.id === item.id; });
            if(found){ found.title = item.title; found.body = item.body; found.updatedAt = item.updatedAt; found.updatedBy = item.updatedBy; }
          }
          refreshDeskWindow(stageEl, win);
        });
      });
      body.querySelector(".delete-item").addEventListener("click", function(){
        if(!confirm('Move "' + item.title + '" to the Recycle Bin?')) return;
        var delBtn = body.querySelector(".delete-item");
        delBtn.disabled = true;
        sb.rpc("shed_delete_item", { p: window.SHED_PASSPHRASE, item_id: item.id }).then(function(res){
          delBtn.disabled = false;
          if(res.error){
            alert("Couldn't delete that. Please try again.");
            return;
          }
          moveItemToBin(item);
          closeDeskWindow(stageEl, win);
        });
      });
    }

    // The "open linked document" button is shown for any note with a linked document, not only
    // approval notices -- moved out of the requiresApproval block below for the same reason as
    // the subtitle above. Kept outside .approval-block so it isn't tied to approval styling.
    if(item.linkedItemId){
      var linkedGeneral = findItemById(item.linkedItemId);
      var linkBtnGeneral = document.createElement("button");
      linkBtnGeneral.type = "button";
      linkBtnGeneral.className = "linked-doc-btn";
      linkBtnGeneral.innerHTML = "📄 " + (item.requiresApproval ? "Review: " : "Open: ") + (linkedGeneral ? linkedGeneral.title : ("Document #" + item.linkedItemId));
      linkBtnGeneral.addEventListener("click", function(e){
        e.stopPropagation();
        var freshLinked = findItemById(item.linkedItemId);
        if(!freshLinked){
          alert("That document couldn't be found (it may have been removed).");
          return;
        }
        addToDesk(stageEl, freshLinked);
      });
      body.appendChild(linkBtnGeneral);
    }

    // Any number of further links (documents, photos, web addresses) on a notice.
    if(item.loc === "board" && item.id != null){
      body.appendChild(buildItemLinksBlock(stageEl, item));
    }

    if(item.requiresApproval){
      var block = document.createElement("div");
      block.className = "approval-block";

      // Shared workflow status (2026-09-09): a notice and the to-do that tracks it
      // (shed_items.todo_id, set automatically when the notice was created or when review
      // was last requested) are literally the same status now -- New/Received/In Progress/
      // Blocked/Completed, the exact categories the To-Do List uses (STATUS_LABELS/
      // STATUS_ORDER, shared at module scope). Changing the dropdown here calls the very
      // same shed_set_todo_status RPC the To-Do List uses, on the same row, so a change made
      // from either place shows up in both. This replaced an earlier per-person Reading/
      // Discussing tracker per the Founder's direction, once it became clear a notice and
      // its to-do are one task and should show one status, not two.
      var statusBlock = document.createElement("div");
      statusBlock.className = "progress-block";
      var statusLabel = document.createElement("label");
      statusLabel.className = "notes-label";
      statusLabel.textContent = "Status";
      statusBlock.appendChild(statusLabel);
      // Added 10 September 2026: this dropdown IS the linked to-do's own status (New/
      // Received/In Progress/Blocked/Completed) -- it says nothing about whether THIS notice
      // has actually been approved, which is the separate Approved checkbox and decision
      // below. Spelled out directly after two to-dos ended up marked Completed with nothing
      // actually approved -- the same field name ("Status") had made the two easy to conflate.
      var statusCaption = document.createElement("p");
      statusCaption.className = "empty-note";
      statusCaption.style.margin = "2px 0 6px";
      statusCaption.style.fontSize = ".76rem";
      statusCaption.textContent = "This is the linked to-do task's status, not this notice's own approval decision (see Approved below).";
      statusBlock.appendChild(statusCaption);
      var statusRowEl = document.createElement("div");
      statusRowEl.className = "progress-rows";
      statusRowEl.innerHTML = '<p class="empty-note" style="margin:2px 0;">Loading status…</p>';
      statusBlock.appendChild(statusRowEl);
      block.appendChild(statusBlock);

      // Remembers the last-loaded to-do row so a change to approval/review state (below)
      // can rebuild this select's disabled-option state immediately, without re-fetching --
      // see updateApprovalMeta's caller and refreshStatusRow.
      var lastTodoRow = null;

      function renderStatusRow(todoRow){
        lastTodoRow = todoRow;
        statusRowEl.innerHTML = "";
        if(!todoRow){
          statusRowEl.innerHTML = '<p class="empty-note" style="margin:2px 0;">No linked to-do yet.</p>';
          return;
        }
        var prow = document.createElement("div");
        prow.className = "progress-row";

        // A notice that hasn't been approved yet, or still has an open review request,
        // can't have its to-do marked Completed -- shed_set_todo_status enforces this
        // server-side too (the authoritative check); this just keeps the option from being
        // picked in the first place instead of failing after the fact.
        var blockCompleted = !item.approved || !!item.reviewRequested;

        var sel = document.createElement("select");
        sel.className = "progress-select";
        STATUS_ORDER.forEach(function(s){
          var opt = document.createElement("option");
          opt.value = s;
          opt.textContent = STATUS_LABELS[s];
          if(s === "completed" && blockCompleted){
            opt.disabled = true;
            opt.title = "Approve this notice (or resolve its review request) before marking it Completed.";
          }
          if(s === todoRow.status) opt.selected = true;
          sel.appendChild(opt);
        });
        prow.appendChild(sel);

        var metaSpan = document.createElement("span");
        metaSpan.className = "progress-value";
        metaSpan.textContent = todoRow.updated_by ? ("set by " + todoRow.updated_by) : "";
        prow.appendChild(metaSpan);

        sel.addEventListener("change", function(){
          var newStatus = sel.value;
          var prevStatus = todoRow.status;
          sel.disabled = true;
          sb.rpc("shed_set_todo_status", { p: window.SHED_PASSPHRASE, todo_id: item.todoId, new_status: newStatus }).then(function(res){
            sel.disabled = false;
            if(res.error){
              alert((res.error && res.error.message) || "Couldn't save that status. Please try again.");
              sel.value = prevStatus;
              return;
            }
            todoRow.status = res.data.status;
            todoRow.updated_by = res.data.updated_by;
            metaSpan.textContent = todoRow.updated_by ? ("set by " + todoRow.updated_by) : "";
            // This panel already updated itself above; an open To-Do List tab (and any other
            // notice panel open on the same linked notice) has its own separate copy of this
            // row and needs telling directly, or it keeps showing the old status until closed
            // and reopened (reported directly, 10 September 2026).
            refreshRelatedDeskWindows(stageEl, { todoId: item.todoId, skip: win });
          });
        });

        statusRowEl.appendChild(prow);
      }

      // Rebuilds the status row from whatever was last loaded, so an approval/review change
      // made just above (without leaving this window) immediately reflects in which options
      // are selectable -- otherwise approving the notice wouldn't unblock "Completed" here
      // until the window was closed and reopened.
      function refreshStatusRow(){
        if(lastTodoRow) renderStatusRow(lastTodoRow);
      }

      if(item.todoId == null){
        renderStatusRow(null);
      } else {
        sb.rpc("shed_list_todos", { p: window.SHED_PASSPHRASE }).then(function(res){
          if(res.error){
            statusRowEl.innerHTML = '<p class="empty-note" style="margin:2px 0;">Couldn\'t load status.</p>';
            return;
          }
          var match = (res.data || []).filter(function(t){ return t.id === item.todoId; })[0];
          renderStatusRow(match || null);
        });
      }

      // Sets both the meta line's text AND a state-<x> class (state-pending/state-approved/
      // state-review -- see the CSS) so the outcome of Save/Request Review is visible as a
      // color change, not just a small line of text easy to miss. `flash` (true after a
      // successful save, false on first render) briefly outlines the line so the change
      // catches the eye even before it's read.
      function updateApprovalMeta(flash){
        var text, state;
        if(item.approved){
          var approvedWhen = item.approvedAt ? fmtSavedDate(item.approvedAt).replace("Saved ", "") : "";
          text = "✓ Approved" + (item.approvedBy ? " by " + item.approvedBy : "") + (approvedWhen ? " on " + approvedWhen : "");
          state = "approved";
        } else if(item.reviewRequested){
          var reviewWhen = item.reviewRequestedAt ? fmtSavedDate(item.reviewRequestedAt).replace("Saved ", "") : "";
          text = "⚑ Review requested" + (item.reviewRequestedBy ? " by " + item.reviewRequestedBy : "") + (reviewWhen ? " on " + reviewWhen : "");
          state = "review";
        } else {
          text = "Not yet approved.";
          state = "pending";
        }
        meta.textContent = text;
        meta.className = "approval-meta state-" + state;
        if(flash){
          // Re-trigger the CSS animation even if the class never changed (e.g. Save with the
          // checkbox already in the same position) by removing and re-adding it next frame.
          meta.classList.remove("flash");
          void meta.offsetWidth;
          meta.classList.add("flash");
        }
      }

      var checkWrap = document.createElement("label");
      checkWrap.className = "approval-check";
      var check = document.createElement("input");
      check.type = "checkbox";
      check.checked = !!item.approved;
      var checkText = document.createElement("span");
      checkText.textContent = "Approved";
      checkWrap.appendChild(check);
      checkWrap.appendChild(checkText);
      block.appendChild(checkWrap);

      var meta = document.createElement("div");
      meta.className = "approval-meta";
      block.appendChild(meta);
      updateApprovalMeta(false);

      // Save/Request Review moved directly under the Approved checkbox (and its status line
      // just above) on 10 September 2026, per direct request: they used to sit below the
      // Notes textarea, meaning saving a plain approve/unapprove -- the common case -- always
      // required scrolling past Notes first even when there was nothing to write. Notes now
      // follows the buttons instead, kept for whenever there's something to add rather than
      // sitting in the way of the buttons every time.
      var saveRow = document.createElement("div");
      saveRow.className = "actions";
      saveRow.style.marginTop = "8px";
      var saveNotesBtn = document.createElement("button");
      saveNotesBtn.type = "button";
      saveNotesBtn.className = "btn";
      saveNotesBtn.textContent = "Save";
      saveRow.appendChild(saveNotesBtn);
      var reviewBtn = document.createElement("button");
      reviewBtn.type = "button";
      reviewBtn.className = "btn alt";
      saveRow.appendChild(reviewBtn);
      block.appendChild(saveRow);
      var reviewHint = document.createElement("p");
      reviewHint.className = "empty-note";
      reviewHint.style.margin = "6px 0 0";
      reviewHint.style.fontSize = ".76rem";
      block.appendChild(reviewHint);

      var notesLabel = document.createElement("label");
      notesLabel.className = "notes-label";
      notesLabel.style.marginTop = "14px";
      notesLabel.textContent = "Notes";
      block.appendChild(notesLabel);
      var notesArea = document.createElement("textarea");
      notesArea.className = "notes-textarea";
      notesArea.value = item.notes || "";
      block.appendChild(notesArea);

      // The review button and its hint text swap between two modes depending on whether a
      // review is currently pending, so there's always a way *out* of the review-requested
      // state that doesn't require approving -- previously the only way to clear a review
      // request was to check "Approved" (shed_set_notice_approval clears it as a side effect),
      // which meant a review request the Founder wanted to simply withdraw (no changes needed
      // after all) had no direct path back to "not yet approved."
      function updateReviewControls(){
        if(item.reviewRequested){
          reviewBtn.textContent = "Cancel Review Request";
          reviewHint.textContent = "\"Cancel Review Request\" withdraws the request and returns this notice to Not Yet Approved, without approving it.";
        } else {
          reviewBtn.textContent = "Request Review";
          reviewHint.textContent = "\"Request Review\" flags this notice as needing another look -- for requests, changes, or disagreements, add them in the notes below -- and clears any existing approval.";
        }
      }
      updateReviewControls();

      // Applies a shed_items row (from either RPC below) back onto item/CONTENT/the visible
      // approval meta line -- shared by both the approve/unapprove path and the
      // request-review path, since both return the same shape and touch the same fields.
      function applyApprovalRow(row){
        item.approved = row.approved;
        item.approvedBy = row.approved_by;
        item.approvedAt = row.approved_at;
        item.reviewRequested = row.review_requested;
        item.reviewRequestedBy = row.review_requested_by;
        item.reviewRequestedAt = row.review_requested_at;
        item.notes = row.notes;
        item.updatedAt = row.updated_at;
        item.updatedBy = row.updated_by;
        if(item.loc && CONTENT[item.loc]){
          var found = CONTENT[item.loc].items.find(function(it){ return it.id === item.id; });
          if(found){
            found.approved = item.approved; found.approvedBy = item.approvedBy; found.approvedAt = item.approvedAt;
            found.reviewRequested = item.reviewRequested; found.reviewRequestedBy = item.reviewRequestedBy; found.reviewRequestedAt = item.reviewRequestedAt;
            found.notes = item.notes;
          }
        }
        check.checked = !!item.approved;
        updateApprovalMeta(true);
        updateReviewControls();
        updateBoardBadge();
        refreshStatusRow();
        // Same gap as the status dropdown above, for the decision itself: approving (or
        // requesting/cancelling review) here didn't show up in an already-open To-Do List
        // tab's decision badge, or another notice panel open on this same notice, until that
        // window was closed and reopened. Reported directly, 10 September 2026.
        refreshRelatedDeskWindows(stageEl, { todoId: item.todoId, skip: win });
      }

      function persistApproval(isApproved, noteText){
        return sb.rpc("shed_set_notice_approval", { p: window.SHED_PASSPHRASE, item_id: item.id, is_approved: isApproved, note_text: noteText }).then(function(res){
          if(res.error){
            alert("Couldn't save that. Please try again.");
            return;
          }
          applyApprovalRow(res.data);
        });
      }

      check.addEventListener("change", function(){
        check.disabled = true;
        persistApproval(check.checked, null).then(function(){ check.disabled = false; });
      });
      saveNotesBtn.addEventListener("click", function(){
        saveNotesBtn.disabled = true;
        persistApproval(check.checked, notesArea.value).then(function(){ saveNotesBtn.disabled = false; });
      });
      reviewBtn.addEventListener("click", function(){
        reviewBtn.disabled = true;
        // Which RPC fires depends on the CURRENT state, checked at click time (not baked in
        // when the button was created) -- applyApprovalRow/updateReviewControls keep the
        // button's label in sync with item.reviewRequested after every save, approval change,
        // or review action, so this always matches what's on screen.
        var call = item.reviewRequested
          ? sb.rpc("shed_clear_notice_review", { p: window.SHED_PASSPHRASE, item_id: item.id })
          : sb.rpc("shed_request_notice_review", { p: window.SHED_PASSPHRASE, item_id: item.id, note_text: notesArea.value });
        call.then(function(res){
          reviewBtn.disabled = false;
          if(res.error){
            alert("Couldn't save that. Please try again.");
            return;
          }
          applyApprovalRow(res.data);
        });
      });

      body.appendChild(block);
    } else if(item.id != null){
      // The reverse direction of the notice's own "Review: <document>" button: if some
      // notice is still awaiting a decision and links to *this* item, say so here and offer
      // a one-click way to open that notice, so approval status is visible from either side.
      var pending = pendingNoticesFor(item.id);
      if(pending.length){
        var pendingBtn = document.createElement("button");
        pendingBtn.type = "button";
        pendingBtn.className = "pending-notice-link";
        pendingBtn.innerHTML = "⚑ " + (pending.length === 1 ? "1 approval notice pending" : (pending.length + " approval notices pending"));
        pendingBtn.addEventListener("click", function(e){
          e.stopPropagation();
          addToDesk(stageEl, pending[0]);
        });
        body.appendChild(pendingBtn);
      }
    }

    // Reply box + attachments (10 September 2026): independent of the approval block above --
    // gated on item.hasReply/hasUpload, not item.requiresApproval, since a plain task notice
    // like "Karla: legal document formatting info needed" (requires_approval false) still
    // needs somewhere for Karla to type/paste a reply and attach a file. Set at creation, see
    // shed_notice_templates ("info_request") and shed_add_notice's want_reply/want_upload params.
    if((item.hasReply || item.hasUpload) && item.id != null){
      var replyBlock = document.createElement("div");
      replyBlock.className = "approval-block";

      if(item.hasReply){
        var replyLabel = document.createElement("label");
        replyLabel.className = "notes-label";
        replyLabel.textContent = item.createdBy ? ("Reply to " + item.createdBy) : "Reply";
        replyBlock.appendChild(replyLabel);

        var replyMeta = document.createElement("p");
        replyMeta.className = "empty-note";
        replyMeta.style.margin = "2px 0 6px";
        replyMeta.style.fontSize = ".76rem";
        function updateReplyMeta(){
          var when = item.replyAt ? " on " + fmtSavedDate(item.replyAt).replace("Saved ", "") : "";
          replyMeta.textContent = item.replyBy ? ("Last saved by " + item.replyBy + when) : "No reply yet.";
        }
        updateReplyMeta();
        replyBlock.appendChild(replyMeta);

        var replyArea = document.createElement("textarea");
        replyArea.className = "notes-textarea";
        replyArea.placeholder = "Type or paste your reply here…";
        replyArea.value = item.replyBody || "";
        replyBlock.appendChild(replyArea);

        var saveReplyRow = document.createElement("div");
        saveReplyRow.className = "actions";
        saveReplyRow.style.marginTop = "8px";
        var saveReplyBtn = document.createElement("button");
        saveReplyBtn.type = "button";
        saveReplyBtn.className = "btn";
        saveReplyBtn.textContent = "Save Reply";
        saveReplyRow.appendChild(saveReplyBtn);
        replyBlock.appendChild(saveReplyRow);

        saveReplyBtn.addEventListener("click", function(){
          saveReplyBtn.disabled = true;
          sb.rpc("shed_set_notice_reply", { p: window.SHED_PASSPHRASE, item_id: item.id, reply_text: replyArea.value }).then(function(res){
            saveReplyBtn.disabled = false;
            if(res.error){ alert("Couldn't save that. Please try again."); return; }
            item.replyBody = res.data.reply_body;
            item.replyBy = res.data.reply_by;
            item.replyAt = res.data.reply_at;
            updateReplyMeta();
            refreshRelatedDeskWindows(stageEl, { todoId: item.todoId, skip: win });
          });
        });
      }

      if(item.hasUpload){
        var uploadLabel = document.createElement("label");
        uploadLabel.className = "notes-label";
        uploadLabel.style.marginTop = "14px";
        uploadLabel.textContent = "Attachments";
        replyBlock.appendChild(uploadLabel);

        var attachListEl = document.createElement("div");
        replyBlock.appendChild(attachListEl);

        // Each row now also gets a Remove button (17 September 2026 -- "there should be a way
        // to remove attachments", there wasn't one before this), and a row that was linked in
        // from elsewhere in the shed (see "Link a document.../Link a photo..." below and
        // shed_link_item_attachment) shows that plainly instead of claiming to have been
        // "uploaded" -- it shares that other item's own bytes, nothing was actually uploaded here.
        function renderAttachList(){
          var files = ATTACHMENTS[item.id] || [];
          attachListEl.innerHTML = "";
          if(!files.length){
            attachListEl.innerHTML = '<p class="empty-note" style="margin:2px 0;">No files attached yet.</p>';
            return;
          }
          files.forEach(function(f){
            var row = document.createElement("div");
            row.style.cssText = "margin:3px 0; display:flex; align-items:center; gap:8px;";
            var link = document.createElement("a");
            link.href = "#";
            link.style.flex = "1";
            var linkedSource = f.linked_gallery_item_id ? findItemById(f.linked_gallery_item_id) : null;
            link.textContent = (f.linked_gallery_item_id ? "🔗 " : "📎 ") + f.file_name +
              (f.linked_gallery_item_id ? " — linked from " + (linkedSource && linkedSource.loc === "gallery" ? "Gallery" : "the File Cabinet") : (f.uploaded_by ? " — uploaded by " + f.uploaded_by : ""));
            link.addEventListener("click", function(e){
              e.preventDefault();
              // A linked attachment points at a real item elsewhere in the shed (a Gallery
              // photo or a Cabinet document) -- open THAT item on the desk, same as clicking it
              // anywhere else in the app, rather than firing its raw file into a new browser
              // tab like a plain upload (17 September 2026, reported: a linked photo was
              // opening in a new tab instead of on the desk).
              if(linkedSource){
                addToDesk(stageEl, linkedSource);
                return;
              }
              sb.storage.from("shed-attachments").createSignedUrl(f.storage_path, 3600).then(function(res){
                if(res.error || !res.data){ alert("Couldn't open that file. Please try again."); return; }
                window.open(res.data.signedUrl, "_blank");
              });
            });
            row.appendChild(link);
            var removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.className = "btn ghost";
            removeBtn.style.cssText = "padding:2px 8px; font-size:.75rem; flex:none;";
            removeBtn.textContent = "Remove";
            removeBtn.addEventListener("click", function(){
              var msg = f.linked_gallery_item_id
                ? 'Remove this link to "' + f.file_name + '"? The photo stays in the Gallery.'
                : 'Remove "' + f.file_name + '" from this item\'s attachments?';
              if(!confirm(msg)) return;
              removeBtn.disabled = true;
              sb.rpc("shed_remove_attachment", { p: window.SHED_PASSPHRASE, attachment_id: f.id }).then(function(res){
                if(res.error){ removeBtn.disabled = false; alert("Couldn't remove that. Please try again."); return; }
                ATTACHMENTS[item.id] = (ATTACHMENTS[item.id] || []).filter(function(x){ return x.id !== f.id; });
                renderAttachList();
                refreshRelatedDeskWindows(stageEl, { todoId: item.todoId, skip: win });
              });
            });
            row.appendChild(removeBtn);
            attachListEl.appendChild(row);
          });
        }
        renderAttachList();

        var uploadRow = document.createElement("div");
        uploadRow.className = "actions";
        uploadRow.style.marginTop = "8px";
        var fileInput = document.createElement("input");
        fileInput.type = "file";
        uploadRow.appendChild(fileInput);
        var uploadBtn = document.createElement("button");
        uploadBtn.type = "button";
        uploadBtn.className = "btn";
        uploadBtn.textContent = "Upload";
        uploadRow.appendChild(uploadBtn);
        replyBlock.appendChild(uploadRow);

        var uploadHint = document.createElement("p");
        uploadHint.className = "empty-note";
        uploadHint.style.margin = "6px 0 0";
        uploadHint.style.fontSize = ".76rem";
        uploadHint.textContent = "Choose a file from your computer and Upload. To point at something already in the Cabinet or Gallery, or at a web page, use Links above.";
        replyBlock.appendChild(uploadHint);

        uploadBtn.addEventListener("click", function(){
          var file = fileInput.files && fileInput.files[0];
          if(!file){ alert("Choose a file first."); return; }
          uploadBtn.disabled = true;
          var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          var path = item.id + "/" + Date.now() + "-" + safeName;
          sb.storage.from("shed-attachments").upload(path, file).then(function(upRes){
            if(upRes.error){
              uploadBtn.disabled = false;
              alert("Upload failed. Please try again.");
              return;
            }
            return sb.rpc("shed_add_attachment", { p: window.SHED_PASSPHRASE, item_id: item.id, file_name: file.name, storage_path: path, size_bytes: file.size }).then(function(res){
              uploadBtn.disabled = false;
              if(res.error){ alert("The file uploaded, but couldn't be recorded. Please tell Shaphan."); return; }
              if(!ATTACHMENTS[item.id]) ATTACHMENTS[item.id] = [];
              ATTACHMENTS[item.id].push(res.data);
              fileInput.value = "";
              renderAttachList();
              refreshRelatedDeskWindows(stageEl, { todoId: item.todoId, skip: win });
            });
          });
        });
      }

      body.appendChild(replyBlock);
    }
  }

  // The File Cabinet's root is a set of named folders. "PIP AI OS", "Company Docs", "From
  // the Desk" and "Drafts" are flat, user-managed folders (unchanged since before the sync).
  // Foundations / Knowledge Curation System / MVP / Standards / Working / AI / Graphics are
  // synced wholesale, recursively, from the matching folders in Core by a GitHub Action
  // (source = 'synced', not user-editable -- see .github/workflows/shed-doc-sync.yml in the
  // core repo) -- as of 9 September 2026 the sync preserves each file's full subfolder path
  // (item.folder can be "Knowledge Curation System/Mother Information Library/ARCs", not
  // just the top-level name), and the cabinet browser below (cabinetChildFolders /
  // cabinetItemsAt / renderCabinetLevel) walks that nested structure the same way a real
  // file explorer would, so the shed's File Cabinet mirrors Core's actual layout rather than
  // flattening it. "Completed Tasks" (10 September 2026) is where a notice lands on its own,
  // automatically, once its shared to-do reaches Completed -- see shed_set_todo_status -- as
  // a queue of decisions the shed has recorded but Core itself doesn't reflect yet (the
  // document still needs its actual Status line changed to Approved and committing to the
  // right place); nothing files anything there by hand.
  var CABINET_FOLDERS = [
    {name:"PIP AI OS", icon:"🤖"},
    {name:"Company Docs", icon:"🏢"},
    {name:"From the Desk", icon:"🗒️"},
    {name:"Drafts", icon:"✏️"},
    {name:"Completed Tasks", icon:"✅"},
    // "Formatted for Legal" (17 September 2026) -- where the Toolbox's "Format Legal Docs"
    // tool files its output (see openFormatLegalDocsTool). A plain top-level folder like
    // every other entry here; nothing about cabinet rendering needed to change for it.
    {name:"Formatted for Legal", icon:"⚖️"},
    // "Annotated Photos" (23 September 2026) -- where the Toolbox's "Annotate Photo" tool
    // files its output (see openAnnotatePhotoTool). A plain top-level folder like every
    // other entry here; nothing about cabinet rendering needed to change for it.
    {name:"Annotated Photos", icon:"🖼️"},
    {name:"Foundations", icon:"🧱"},
    {name:"Knowledge Curation System", icon:"📚"},
    {name:"MVP", icon:"🚀"},
    {name:"Standards", icon:"📐"},
    {name:"Working", icon:"🛠️"},
    {name:"AI", icon:"🤖"},
    {name:"Graphics", icon:"🎨"}
  ];
  // Cabinet folders where an item is disposable, user/tool-generated output rather than
  // governed content -- these two get the Recycle-Bin-style select-then-delete toolbar
  // (see buildSelectableItemListEl) instead of the plain "click to open, delete from inside"
  // flow every other folder keeps, per direct request (17 September 2026). "Annotated Photos"
  // (23 September 2026) joins them for the same reason: tool-generated output, not governed
  // content.
  var CABINET_BULK_DELETE_FOLDERS = ["From the Desk", "Formatted for Legal", "Annotated Photos"];
  var CABINET_DEFAULT_FOLDER = "Company Docs";

  // Every distinct next path segment among items whose folder is a strict descendant of
  // parentPath -- e.g. for parentPath "Knowledge Curation System" and an item filed under
  // "Knowledge Curation System/Mother Information Library/ARCs", returns "Mother Information
  // Library" (not the full remaining path -- one level of drill-down at a time).
  function cabinetChildFolders(items, parentPath){
    var prefix = parentPath + "/";
    var seen = {};
    items.forEach(function(it){
      var f = it.folder || CABINET_DEFAULT_FOLDER;
      if(f.indexOf(prefix) !== 0) return;
      var rest = f.slice(prefix.length);
      if(!rest) return;
      seen[rest.split("/")[0]] = true;
    });
    return Object.keys(seen).sort(function(a, b){ return a.localeCompare(b); });
  }

  // Items filed exactly at this path (not in a deeper subfolder of it).
  function cabinetItemsAt(items, path){
    return items.filter(function(it){ return (it.folder || CABINET_DEFAULT_FOLDER) === path; });
  }

  // `initialPath` (cabinet only) reopens straight into a specific nested folder instead of
  // the folder root -- used by the desk window's "back" button (see buildBackBtn) so
  // returning to the File Cabinet after opening a document lands back in the same folder it
  // was sent to the desk from, not the top-level folder grid.
  function openPanel(key, stageEl, initialPath){
    if(key === "deskpad"){ openCreatePanel(stageEl); return; }
    var data = CONTENT[key];
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="bg" style="background-image:url(' + data.bg + ')"></div>' +
      '<div class="scrim"></div>' +
      '<div class="panel">' +
        '<div class="panel-head"><h3></h3><button class="closebtn" type="button">&times;</button></div>' +
        '<div class="panel-body"></div>' +
      '</div>';
    stageEl.appendChild(overlay);
    requestAnimationFrame(function(){ overlay.classList.add("open"); });

    var titleEl = overlay.querySelector(".panel-head h3");
    var panelBody = overlay.querySelector(".panel-body");

    function close(){
      overlay.classList.remove("open");
      setTimeout(function(){ overlay.remove(); }, 250);
    }
    overlay.querySelector(".closebtn").addEventListener("click", close);

    // Populated only for the Notice Board (see the final "else" branch below) with the
    // linked to-do row for every requires-approval notice, keyed by todo_id -- lets
    // buildItemListEl show each notice's shared status right in the list, at a glance,
    // without opening it. null until that fetch resolves; cabinet/bookshelf items are never
    // notices (shed_add_notice always inserts location='board'), so they never read this.
    var boardTodoStatus = null;

    // Which cabinet folder path the item list currently on screen actually belongs to (null
    // outside the File Cabinet, or at its folder-grid root where no items are shown directly)
    // -- set by renderCabinetLevel just before it renders, read by buildItemRow's Desktop
    // button below so the "back" context it hands to addToDesk points at the exact folder a
    // document was opened from, not just "the cabinet" in general.
    var currentCabinetPath = null;
    // Selection state for the bulk select-then-delete list (renderSelectableItemList),
    // shared across CABINET_BULK_DELETE_FOLDERS for the life of this one File Cabinet panel
    // open -- stale ids from a different folder are filtered out on each render rather than
    // explicitly reset on navigation, since item ids are unique across the whole table (see
    // renderSelectableItemList).
    var bulkDeleteSelected = {};

    // A document whose title ends in the literal suffix " (Revision N)" is one entry in a
    // governed revision series (Founder Review Dossiers that can never be edited in place
    // once submitted -- FRDS §5.3 -- so a later round of research becomes a whole new
    // document instead). Matches title text only, never source_path/filename -- deliberately
    // conservative, since plenty of unrelated documents in the cabinet (PKRs, ARCs) end in a
    // number without being revisions of anything. Returns the shared base title with that
    // suffix stripped, or null if `title` doesn't carry the marker.
    var REVISION_SUFFIX_RE = /^(.*) \(Revision (\d+)\)$/;
    function seriesRevisionMatch(title){
      return REVISION_SUFFIX_RE.exec(title);
    }

    // Groups `items` into an ordered list of entries -- {type:"item", item} for anything
    // standalone, {type:"series", baseTitle, members} for 2+ items that share a base title
    // where at least one carries the "(Revision N)" marker (see seriesRevisionMatch). A
    // group of items that merely happen to share a title, with none marked as a revision,
    // is deliberately left ungrouped -- the marker is the actual signal, not the collision.
    function groupIntoSeries(items){
      var byBase = {};
      items.forEach(function(item){
        var m = seriesRevisionMatch(item.title);
        var base = m ? m[1] : item.title;
        if(!byBase[base]) byBase[base] = [];
        byBase[base].push({ item:item, revision: m ? parseInt(m[2], 10) : 1, marked: !!m });
      });

      var entries = [];
      var seenBase = {};
      items.forEach(function(item){
        var m = seriesRevisionMatch(item.title);
        var base = m ? m[1] : item.title;
        if(seenBase[base]) return;
        seenBase[base] = true;

        var members = byBase[base];
        var isSeries = members.length > 1 && members.some(function(x){ return x.marked; });
        if(isSeries){
          members.sort(function(a, b){ return a.revision - b.revision; });
          entries.push({ type:"series", baseTitle: base, members: members.map(function(x){ return x.item; }) });
        } else {
          members.forEach(function(x){ entries.push({ type:"item", item: x.item }); });
        }
      });
      return entries;
    }

    // Builds one normal item row (title, pending/status chip, Desktop button). `labelText`
    // overrides the row's displayed title without changing what's sent to the desk --
    // used for a series member row, where the base title is already shown once on the
    // group's header and repeating it on every revision would just be noise.
    function buildItemRow(item, labelText){
      var row = document.createElement("div");
      row.className = "item-row";

      var titleEl = document.createElement("span");
      titleEl.className = "item-row-title";
      var rowTitleText = labelText != null ? labelText : item.title;
      // Every requires-approval notice not tied to a standalone suggestion carries the same
      // generic title ("Founder Approval Required") -- fine once opened (the panel already
      // shows the linked document as a subtitle), but indistinguishable from one another in
      // this closed list, which is exactly what made "which one did I just approve?" a real
      // problem (Karla, 10 September 2026). Appending the linked document's own title here
      // means a notice reads e.g. "Founder Approval Required — AskPIP Founding Principles"
      // without needing to open it first.
      if(item.requiresApproval && item.linkedItemId != null){
        var linkedForRow = findItemById(item.linkedItemId);
        if(linkedForRow) rowTitleText += " — " + linkedForRow.title;
      }
      titleEl.textContent = rowTitleText;
      row.appendChild(titleEl);

      // A small flag, not a preview -- consistent with keeping this list to title + Send
      // to Desktop only, but worth surfacing since otherwise the only way to know a
      // document has a notice awaiting a decision is to find that notice first.
      if(!item.requiresApproval && item.id != null && pendingNoticesFor(item.id).length){
        var pendingBadge = document.createElement("span");
        pendingBadge.className = "pending-notice-badge";
        pendingBadge.textContent = "⚑ Pending";
        row.appendChild(pendingBadge);
      }

      // A notice's shared status (same value as its linked to-do -- see
      // renderDeskPanelBody's Status control), shown as a small read-only chip so it's
      // visible right in the Notice Board list, not just once the notice is opened. Still
      // just a glance, not a preview: no dropdown here, consistent with this list staying
      // click-to-open for anything editable.
      if(item.requiresApproval && item.todoId != null && boardTodoStatus && boardTodoStatus[item.todoId]){
        var statusChip = document.createElement("span");
        statusChip.className = "item-row-status";
        var chipStatus = boardTodoStatus[item.todoId].status;
        statusChip.textContent = STATUS_LABELS[chipStatus] || chipStatus;
        row.appendChild(statusChip);
      }

      // The to-do-status chip above is the shared WORKFLOW status (New/Received/.../
      // Completed) -- it says nothing about whether this notice itself has actually been
      // approved, which is a separate decision (shed_items.approved/review_requested). Added
      // 10 September 2026 after that exact gap let two to-dos read "Completed" while their
      // notice had never been approved: a second, distinct badge for the notice's own
      // decision, visible without opening it -- "so if you tick and save a notice it's
      // visible when closed," per the direct request.
      if(item.requiresApproval){
        var decisionChip = document.createElement("span");
        if(item.approved){
          decisionChip.className = "item-row-decision decision-approved";
          decisionChip.textContent = "✓ Approved";
        } else if(item.reviewRequested){
          decisionChip.className = "item-row-decision decision-review";
          decisionChip.textContent = "⚑ Review Requested";
        } else {
          decisionChip.className = "item-row-decision decision-pending";
          decisionChip.textContent = "Not Yet Approved";
        }
        row.appendChild(decisionChip);
      }

      var sendBtn = document.createElement("button");
      sendBtn.type = "button";
      sendBtn.className = "btn send-row";
      sendBtn.textContent = "Desktop";
      sendBtn.addEventListener("click", function(){
        // Remembers exactly which panel (and, for the File Cabinet, which folder) this item
        // was sent to the desk from, so its desk window can offer a "back" button straight to
        // it -- see buildBackBtn/openPanel's initialPath, added 10 September 2026 per direct
        // request: closing (x) always dropped back to the plain shed view, with no way back
        // to "wherever you just left" to open another item from the same list.
        addToDesk(stageEl, item, { key: key, path: (key === "cabinet") ? currentCabinetPath : null, label: data.title });
        close();
      });
      row.appendChild(sendBtn);

      return row;
    }

    // getItems is a function (not a plain array) so the list can be recomputed fresh
    // after content changes. Builds a ".item-list" element for `items`, used everywhere an
    // item list appears (a flat cabinet folder, a cabinet folder that also has items filed
    // directly in it, the bookshelf, the board, ...).
    //
    // Deliberately minimal, per the Founder's direction (9 September 2026): a list appearing
    // in the Notice Board, File Cabinet or Bookshelf shows only an item's title and a "Send
    // to Desktop" button -- no inline preview, no edit-in-place here. Viewing, editing and
    // deleting all happen only once an item is open on the desk (see renderDeskPanelBody) --
    // that's the one and only place an item can be edited. `refresh` is accepted for
    // call-site compatibility but no longer used internally.
    //
    // One deliberate, purely cosmetic exception to "one row per item" (9 September 2026,
    // reported directly: a governed revision series read as clutter, four rows -- eight,
    // counting its mirrored archive copy -- for what's really one evolving answer): same-
    // series items (see groupIntoSeries) collapse into a single expandable row instead of
    // one row each. Nothing about the underlying items changes -- this is List-rendering
    // only, recomputed fresh every time the list renders, and every revision is still just
    // as directly reachable once expanded.
    function buildItemListEl(items, refresh){
      var list = document.createElement("div");
      list.className = "item-list";
      groupIntoSeries(items).forEach(function(entry){
        if(entry.type === "item"){
          list.appendChild(buildItemRow(entry.item));
          return;
        }

        var group = document.createElement("div");
        group.className = "item-series";

        var header = document.createElement("button");
        header.type = "button";
        header.className = "item-series-header";

        var titleEl = document.createElement("span");
        titleEl.className = "item-series-title";
        titleEl.textContent = entry.baseTitle;
        header.appendChild(titleEl);

        var countBadge = document.createElement("span");
        countBadge.className = "item-series-count";
        countBadge.textContent = entry.members.length + " revisions";
        header.appendChild(countBadge);

        var chevron = document.createElement("span");
        chevron.className = "item-series-chevron";
        chevron.textContent = "▸";
        header.appendChild(chevron);

        var membersEl = document.createElement("div");
        membersEl.className = "item-series-members";
        entry.members.forEach(function(item){
          var m = seriesRevisionMatch(item.title);
          var label = m ? ("Revision " + m[2]) : "Original";
          membersEl.appendChild(buildItemRow(item, label));
        });

        header.addEventListener("click", function(){
          group.classList.toggle("open");
        });

        group.appendChild(header);
        group.appendChild(membersEl);
        list.appendChild(group);
      });
      return list;
    }

    function renderItemList(getItems, title, onBack){
      var items = getItems();
      titleEl.textContent = title;
      panelBody.innerHTML = "";

      if(onBack){
        var back = document.createElement("button");
        back.type = "button";
        back.className = "backbtn";
        back.textContent = "← Folders";
        back.addEventListener("click", onBack);
        panelBody.appendChild(back);
      }

      if(items.length === 0){
        var empty = document.createElement("p");
        empty.className = "empty-note";
        empty.textContent = "Nothing filed here yet.";
        panelBody.appendChild(empty);
      }

      function refresh(){ renderItemList(getItems, title, onBack); }
      panelBody.appendChild(buildItemListEl(items, refresh));
    }

    // Recycle-Bin-style select-then-delete list, used only for CABINET_BULK_DELETE_FOLDERS
    // (17 September 2026) -- everywhere else keeps the plain click-to-open list
    // (renderItemList) per the Founder's original "no edit/delete from a closed list"
    // direction (9 September 2026); this is a deliberate, narrowly-scoped exception for
    // disposable, tool/user-generated output, not a reversal of that rule. Deletion here is
    // the same soft-delete-to-bin as a single item's own "delete-item" button
    // (shed_delete_item per id, not shed_purge_items), so a mistaken bulk delete is still
    // recoverable from the Recycle Bin exactly like any other delete.
    function renderSelectableItemList(getItems, title, onBack, folderPath){
      var items = getItems();
      var itemIds = items.map(function(it){ return it.id; });
      Object.keys(bulkDeleteSelected).forEach(function(id){
        if(itemIds.indexOf(Number(id)) === -1) delete bulkDeleteSelected[id];
      });

      titleEl.textContent = title;
      panelBody.innerHTML = "";

      if(onBack){
        var back = document.createElement("button");
        back.type = "button";
        back.className = "backbtn";
        back.textContent = "← Folders";
        back.addEventListener("click", onBack);
        panelBody.appendChild(back);
      }

      function refresh(){ renderSelectableItemList(getItems, title, onBack, folderPath); }

      if(items.length === 0){
        var empty = document.createElement("p");
        empty.className = "empty-note";
        empty.textContent = "Nothing filed here yet.";
        panelBody.appendChild(empty);
        return;
      }

      var selectedIds = Object.keys(bulkDeleteSelected).filter(function(id){ return bulkDeleteSelected[id]; });
      var allSelected = selectedIds.length > 0 && selectedIds.length === items.length;

      var toolbar = document.createElement("div");
      toolbar.className = "bin-toolbar";
      toolbar.innerHTML =
        '<button type="button" class="btn ghost select-all">' + (allSelected ? "Deselect All" : "Select All") + '</button>' +
        '<span class="bin-count">' + selectedIds.length + ' selected</span>' +
        '<button type="button" class="btn danger delete-selected"' + (selectedIds.length === 0 ? " disabled" : "") + '>Delete Selected</button>';
      panelBody.appendChild(toolbar);

      toolbar.querySelector(".select-all").addEventListener("click", function(){
        if(allSelected){
          bulkDeleteSelected = {};
        } else {
          items.forEach(function(it){ bulkDeleteSelected[it.id] = true; });
        }
        refresh();
      });

      toolbar.querySelector(".delete-selected").addEventListener("click", function(){
        var ids = Object.keys(bulkDeleteSelected)
          .filter(function(id){ return bulkDeleteSelected[id]; })
          .map(function(id){ return Number(id); })
          .filter(function(id){ return itemIds.indexOf(id) > -1; });
        if(ids.length === 0) return;
        if(!confirm('Move ' + ids.length + ' item' + (ids.length === 1 ? "" : "s") + ' to the Recycle Bin?')) return;
        var delBtn = toolbar.querySelector(".delete-selected");
        delBtn.disabled = true;
        Promise.all(ids.map(function(id){
          return sb.rpc("shed_delete_item", { p: window.SHED_PASSPHRASE, item_id: id });
        })).then(function(results){
          var failed = 0;
          results.forEach(function(res, i){
            if(res.error){ failed++; return; }
            delete bulkDeleteSelected[ids[i]];
            var found = findItemById(ids[i]);
            if(found) moveItemToBin(found);
          });
          if(failed) alert(failed + " item" + (failed === 1 ? "" : "s") + " couldn't be deleted. Please try again.");
          refresh();
        });
      });

      var list = document.createElement("div");
      list.className = "item-list";
      items.forEach(function(item){
        var row = document.createElement("div");
        row.className = "bin-item";

        var check = document.createElement("input");
        check.type = "checkbox";
        check.checked = !!bulkDeleteSelected[item.id];
        check.addEventListener("change", function(e){
          if(e.target.checked){ bulkDeleteSelected[item.id] = true; } else { delete bulkDeleteSelected[item.id]; }
          refresh();
        });
        row.appendChild(check);

        var itemBody = document.createElement("div");
        itemBody.className = "bin-item-body";
        itemBody.innerHTML = "<b>" + item.title + "</b>" +
          (fmtSavedLine(item) ? '<span class="item-date">' + fmtSavedLine(item) + '</span>' : "");
        row.appendChild(itemBody);

        var actions = document.createElement("div");
        actions.className = "bin-item-actions";
        var openBtn = document.createElement("button");
        openBtn.type = "button";
        openBtn.className = "btn ghost";
        openBtn.textContent = "Desktop";
        openBtn.addEventListener("click", function(){
          addToDesk(stageEl, item, { key: "cabinet", path: currentCabinetPath, label: title });
          close();
        });
        actions.appendChild(openBtn);

        // Formatted for Legal items are a finished, downloadable file, not just a document
        // to read on the desk -- Open/Download here so getting the actual file back out
        // doesn't require opening it on the desk first and hunting for its attachment link
        // (reported directly, 17 September 2026: that round-trip was "much too long a
        // process"). Uses the same signed-URL storage pattern the desk's own Attachments
        // list already uses; Download passes Supabase Storage's own `download` option so the
        // browser saves the file straight to Downloads instead of just navigating to it.
        if(folderPath === "Formatted for Legal"){
          var legalFile = (ATTACHMENTS[item.id] || [])[0];
          if(legalFile){
            var viewBtn = document.createElement("button");
            viewBtn.type = "button";
            viewBtn.className = "btn ghost";
            viewBtn.textContent = "Open";
            viewBtn.addEventListener("click", function(){
              sb.storage.from("shed-attachments").createSignedUrl(legalFile.storage_path, 3600).then(function(res){
                if(res.error || !res.data){ alert("Couldn't open that file. Please try again."); return; }
                window.open(res.data.signedUrl, "_blank");
              });
            });
            actions.appendChild(viewBtn);

            var dlBtn = document.createElement("button");
            dlBtn.type = "button";
            dlBtn.className = "btn alt";
            dlBtn.textContent = "Download";
            dlBtn.addEventListener("click", function(){
              sb.storage.from("shed-attachments")
                .createSignedUrl(legalFile.storage_path, 3600, { download: legalFile.file_name })
                .then(function(res){
                  if(res.error || !res.data){ alert("Couldn't download that file. Please try again."); return; }
                  window.open(res.data.signedUrl, "_blank");
                });
            });
            actions.appendChild(dlBtn);
          }
        }

        row.appendChild(actions);

        list.appendChild(row);
      });
      panelBody.appendChild(list);
    }

    if(key === "cabinet"){
      // Total items filed at `path` or anywhere in a subfolder beneath it -- used for the
      // folder-card counts, at both the root list and every nested level.
      function cabinetCountUnder(path){
        var prefix = path + "/";
        return data.items.filter(function(it){
          var f = it.folder || CABINET_DEFAULT_FOLDER;
          return f === path || f.indexOf(prefix) === 0;
        }).length;
      }

      // Count of items at or under `path` that themselves have a pending (unapproved) notice
      // linked to them -- same predicate buildItemListEl uses for a row's own "⚑ Pending"
      // flag, just summed across a folder's whole subtree so a folder card can carry a live
      // count the same way the Notice Board hotspot does (see updateBoardBadge).
      function cabinetPendingCountUnder(path){
        var prefix = path + "/";
        return data.items.filter(function(it){
          var f = it.folder || CABINET_DEFAULT_FOLDER;
          if(f !== path && f.indexOf(prefix) !== 0) return false;
          return it.id != null && pendingNoticesFor(it.id).length > 0;
        }).length;
      }

      function folderBadgeHtml(pendingCount){
        return pendingCount > 0
          ? '<span class="folder-pending-badge">' + pendingCount + '</span>'
          : "";
      }

      function renderFolders(){
        titleEl.textContent = data.title;
        panelBody.innerHTML = "";
        var grid = document.createElement("div");
        grid.className = "folder-list";
        CABINET_FOLDERS.forEach(function(f){
          var count = cabinetCountUnder(f.name);
          var pendingCount = cabinetPendingCountUnder(f.name);
          var card = document.createElement("button");
          card.type = "button";
          card.className = "folder-card";
          card.innerHTML = folderBadgeHtml(pendingCount) +
            '<span class="folder-icon">' + f.icon + '</span>' +
            '<span class="folder-name">' + f.name + '</span>' +
            '<span class="folder-count">' + count + (count === 1 ? " document" : " documents") + '</span>';
          card.addEventListener("click", function(){ renderCabinetLevel(f.name, renderFolders); });
          grid.appendChild(card);
        });
        panelBody.appendChild(grid);
      }

      // Renders one level of a (possibly nested) cabinet folder: any subfolders found
      // directly under `path`, as their own folder cards drilling further down, plus the
      // documents filed exactly at `path`. A folder with no subfolders falls straight
      // through to the plain flat item list, same as before nesting existed.
      function renderCabinetLevel(path, onBack){
        currentCabinetPath = path;
        var label = data.title + " – " + path;
        var subfolders = cabinetChildFolders(data.items, path);

        if(subfolders.length === 0){
          if(CABINET_BULK_DELETE_FOLDERS.indexOf(path) > -1){
            renderSelectableItemList(function(){ return cabinetItemsAt(data.items, path); }, label, onBack, path);
          } else {
            renderItemList(function(){ return cabinetItemsAt(data.items, path); }, label, onBack);
          }
          return;
        }

        titleEl.textContent = label;
        panelBody.innerHTML = "";

        var back = document.createElement("button");
        back.type = "button";
        back.className = "backbtn";
        back.textContent = "← Back";
        back.addEventListener("click", onBack);
        panelBody.appendChild(back);

        var grid = document.createElement("div");
        grid.className = "folder-list";
        subfolders.forEach(function(name){
          var childPath = path + "/" + name;
          var count = cabinetCountUnder(childPath);
          var pendingCount = cabinetPendingCountUnder(childPath);
          var card = document.createElement("button");
          card.type = "button";
          card.className = "folder-card";
          card.innerHTML = folderBadgeHtml(pendingCount) +
            '<span class="folder-icon">📁</span>' +
            '<span class="folder-name">' + name + '</span>' +
            '<span class="folder-count">' + count + (count === 1 ? " document" : " documents") + '</span>';
          card.addEventListener("click", function(){
            renderCabinetLevel(childPath, function(){ renderCabinetLevel(path, onBack); });
          });
          grid.appendChild(card);
        });
        panelBody.appendChild(grid);

        var itemsHere = cabinetItemsAt(data.items, path);
        if(itemsHere.length){
          var heading = document.createElement("p");
          heading.className = "empty-note";
          heading.style.margin = "16px 2px 8px";
          heading.textContent = "Filed directly in this folder:";
          panelBody.appendChild(heading);
          function refresh(){ renderCabinetLevel(path, onBack); }
          panelBody.appendChild(buildItemListEl(itemsHere, refresh));
        }
      }

      // A "back"-triggered reopen names the exact folder a document was sent to the desk
      // from (initialPath) -- walk straight to it instead of starting at the folder-grid
      // root, rebuilding the same onBack chain a real click-by-click drill-down would have
      // built (each level's "back" returns to its parent, ending at the folder grid), so the
      // normal in-panel "← Back" button still works correctly from wherever this landed.
      if(initialPath){
        var pathSegs = initialPath.split("/");
        var pathChain = [];
        var acc = "";
        pathSegs.forEach(function(seg){ acc = acc ? (acc + "/" + seg) : seg; pathChain.push(acc); });
        (function openChain(idx){
          if(idx < 0){ renderFolders(); return; }
          renderCabinetLevel(pathChain[idx], idx === 0 ? renderFolders : function(){ openChain(idx - 1); });
        })(pathChain.length - 1);
      } else {
        renderFolders();
      }
    } else if(key === "bin"){
      var binSelected = {};
      function renderBin(){
        titleEl.textContent = data.title;
        panelBody.innerHTML = "";
        var items = data.items;

        if(items.length === 0){
          binSelected = {};
          var empty = document.createElement("p");
          empty.className = "empty-note";
          empty.textContent = "The bin is empty.";
          panelBody.appendChild(empty);
          return;
        }

        var selectedIds = Object.keys(binSelected).filter(function(id){ return binSelected[id]; });
        var allSelected = selectedIds.length > 0 && selectedIds.length === items.length;

        var toolbar = document.createElement("div");
        toolbar.className = "bin-toolbar";
        toolbar.innerHTML =
          '<button type="button" class="btn ghost select-all">' + (allSelected ? "Deselect All" : "Select All") + '</button>' +
          '<span class="bin-count">' + selectedIds.length + ' selected</span>' +
          '<button type="button" class="btn danger purge-selected"' + (selectedIds.length === 0 ? " disabled" : "") + '>Delete Selected Permanently</button>';
        panelBody.appendChild(toolbar);

        toolbar.querySelector(".select-all").addEventListener("click", function(){
          if(allSelected){
            binSelected = {};
          } else {
            items.forEach(function(it){ binSelected[it.id] = true; });
          }
          renderBin();
        });

        toolbar.querySelector(".purge-selected").addEventListener("click", function(){
          var ids = Object.keys(binSelected).filter(function(id){ return binSelected[id]; }).map(function(id){ return Number(id); });
          if(ids.length === 0) return;
          if(!confirm("Permanently delete " + ids.length + " item" + (ids.length === 1 ? "" : "s") + "? This can't be undone.")) return;
          var purgeBtn = toolbar.querySelector(".purge-selected");
          purgeBtn.disabled = true;
          sb.rpc("shed_purge_items", { p: window.SHED_PASSPHRASE, item_ids: ids }).then(function(res){
            if(res.error){
              alert("Couldn't permanently delete those items. Please try again.");
              purgeBtn.disabled = false;
              return;
            }
            var purgedIds = (res.data || []).map(function(r){ return r.id; });
            purgedIds.forEach(function(id){
              delete binSelected[id];
              var idx = data.items.findIndex(function(it){ return it.id === id; });
              if(idx > -1) data.items.splice(idx, 1);
            });
            renderBin();
          });
        });

        var list = document.createElement("div");
        list.className = "item-list";
        items.forEach(function(item){
          var row = document.createElement("div");
          row.className = "bin-item";
          row.innerHTML =
            '<input type="checkbox"' + (binSelected[item.id] ? " checked" : "") + '>' +
            '<div class="bin-item-body"><b>' + item.title + '</b>' +
              (fmtSavedLine(item) ? '<span class="item-date">' + fmtSavedLine(item) + '</span>' : "") +
              item.body.slice(0, 80) + (item.body.length > 80 ? "..." : "") + '</div>' +
            '<div class="bin-item-actions"><button type="button" class="btn ghost restore-item">Restore</button></div>';

          row.querySelector("input[type=checkbox]").addEventListener("change", function(e){
            if(e.target.checked){ binSelected[item.id] = true; } else { delete binSelected[item.id]; }
            renderBin();
          });

          row.querySelector(".restore-item").addEventListener("click", function(){
            var restoreBtn = row.querySelector(".restore-item");
            restoreBtn.disabled = true;
            sb.rpc("shed_restore_item", { p: window.SHED_PASSPHRASE, item_id: item.id }).then(function(res){
              if(res.error){
                alert("Couldn't restore that item. Please try again.");
                restoreBtn.disabled = false;
                return;
              }
              delete binSelected[item.id];
              moveItemFromBin(item);
              renderBin();
            });
          });

          list.appendChild(row);
        });
        panelBody.appendChild(list);
      }
      renderBin();
    } else if(key === "calendar"){
      var events = [];
      var todayD = new Date();
      var viewYear = todayD.getFullYear();
      var viewMonth = todayD.getMonth();
