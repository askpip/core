      function pad2(n){ return (n < 10 ? "0" : "") + n; }
      function fmtDate(y, m, d){ return y + "-" + pad2(m + 1) + "-" + pad2(d); }
      function parseDateStr(s){ var parts = s.split("-"); return { y:+parts[0], m:+parts[1] - 1, d:+parts[2] }; }

      var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      var DAY_LABELS = ["Su","Mo","Tu","We","Th","Fr","Sa"];

      function loadEvents(){
        titleEl.textContent = data.title;
        panelBody.innerHTML = '<p class="empty-note">Loading events…</p>';
        sb.rpc("shed_list_events", { p: window.SHED_PASSPHRASE }).then(function(res){
          if(res.error){
            panelBody.innerHTML = "<p class='empty-note'>Couldn't load the calendar. Please try again.</p>";
            return;
          }
          events = res.data || [];
          renderMonth();
        });
      }

      function renderMonth(){
        titleEl.textContent = data.title;
        panelBody.innerHTML = "";

        var nav = document.createElement("div");
        nav.className = "cal-nav";
        nav.innerHTML =
          '<button type="button" class="navbtn prev-month">&larr;</button>' +
          '<h4>' + MONTH_NAMES[viewMonth] + " " + viewYear + '</h4>' +
          '<button type="button" class="navbtn next-month">&rarr;</button>';
        panelBody.appendChild(nav);
        nav.querySelector(".prev-month").addEventListener("click", function(){
          viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; }
          renderMonth();
        });
        nav.querySelector(".next-month").addEventListener("click", function(){
          viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; }
          renderMonth();
        });

        var grid = document.createElement("div");
        grid.className = "cal-grid";
        DAY_LABELS.forEach(function(lbl){
          var el = document.createElement("div");
          el.className = "cal-daylabel";
          el.textContent = lbl;
          grid.appendChild(el);
        });

        var firstOfMonth = new Date(viewYear, viewMonth, 1);
        var startDow = firstOfMonth.getDay();
        var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        var daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
        var totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;
        var todayStr = fmtDate(todayD.getFullYear(), todayD.getMonth(), todayD.getDate());

        for(var i = 0; i < totalCells; i++){
          var cellDay = i - startDow + 1;
          var cellY = viewYear, cellM = viewMonth, isOther = false;
          if(cellDay < 1){
            isOther = true; cellM = viewMonth - 1; cellY = viewYear;
            if(cellM < 0){ cellM = 11; cellY--; }
            cellDay = daysInPrevMonth + cellDay;
          } else if(cellDay > daysInMonth){
            isOther = true; cellM = viewMonth + 1; cellY = viewYear;
            if(cellM > 11){ cellM = 0; cellY++; }
            cellDay = cellDay - daysInMonth;
          }
          var dateStr = fmtDate(cellY, cellM, cellDay);
          var dayEvents = events.filter(function(ds){
            return function(ev){ return ev.event_date === ds; };
          }(dateStr));

          var cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cal-cell" + (isOther ? " other-month" : "") + (dateStr === todayStr ? " today" : "");
          var html = '<span class="cal-daynum">' + cellDay + '</span>';
          dayEvents.slice(0, 3).forEach(function(ev){
            html += '<span class="cal-event-chip">' + ev.title + '</span>';
          });
          if(dayEvents.length > 3){
            html += '<span class="cal-event-chip more">+' + (dayEvents.length - 3) + ' more</span>';
          }
          cell.innerHTML = html;
          cell.addEventListener("click", function(ds){
            return function(){ renderDay(ds); };
          }(dateStr));
          grid.appendChild(cell);
        }

        panelBody.appendChild(grid);
      }

      function renderDay(dateStr){
        titleEl.textContent = data.title;
        panelBody.innerHTML = "";

        var back = document.createElement("button");
        back.type = "button";
        back.className = "backbtn";
        back.textContent = "← Calendar";
        back.addEventListener("click", renderMonth);
        panelBody.appendChild(back);

        var parts = parseDateStr(dateStr);
        var heading = document.createElement("h4");
        heading.className = "cal-day-heading";
        heading.textContent = MONTH_NAMES[parts.m] + " " + parts.d + ", " + parts.y;
        panelBody.appendChild(heading);

        var dayEvents = events.filter(function(ev){ return ev.event_date === dateStr; });

        var list = document.createElement("div");
        list.className = "cal-day-events";
        if(dayEvents.length === 0){
          var empty = document.createElement("p");
          empty.className = "empty-note";
          empty.textContent = "No events yet on this day.";
          list.appendChild(empty);
        }
        dayEvents.forEach(function(ev){
          var group = document.createElement("div");
          group.className = "item-group open";
          var card = document.createElement("div");
          card.className = "detail";
          card.style.display = "block";
          card.innerHTML =
            '<div class="view-mode">' +
              '<b class="cal-ev-title">' + ev.title + '</b>' +
              (ev.updated_by ? '<span class="item-date">by ' + ev.updated_by + '</span>' : "") +
              '<p style="margin:0 0 10px;">' + (ev.body || "") + '</p>' +
              '<div class="actions" style="border-bottom:none;margin-bottom:0;">' +
                '<button type="button" class="btn ghost edit-ev">Edit</button>' +
                '<button type="button" class="btn danger delete-ev">Delete</button>' +
              '</div>' +
            '</div>' +
            '<div class="edit-mode" style="display:none;">' +
              '<input type="text" class="edit-ev-title" value="">' +
              '<textarea class="edit-ev-body"></textarea>' +
              '<div class="actions" style="border-bottom:none;margin-bottom:0;">' +
                '<button type="button" class="btn save-ev">Save</button>' +
                '<button type="button" class="btn ghost cancel-ev">Cancel</button>' +
              '</div>' +
            '</div>';

          var viewMode = card.querySelector(".view-mode");
          var editMode = card.querySelector(".edit-mode");
          card.querySelector(".edit-ev").addEventListener("click", function(){
            card.querySelector(".edit-ev-title").value = ev.title;
            card.querySelector(".edit-ev-body").value = ev.body || "";
            viewMode.style.display = "none";
            editMode.style.display = "block";
          });
          card.querySelector(".cancel-ev").addEventListener("click", function(){
            editMode.style.display = "none";
            viewMode.style.display = "block";
          });
          card.querySelector(".save-ev").addEventListener("click", function(){
            var newTitle = card.querySelector(".edit-ev-title").value.trim() || "Untitled";
            var newBody = card.querySelector(".edit-ev-body").value.trim();
            var saveBtn = card.querySelector(".save-ev");
            saveBtn.disabled = true;
            sb.rpc("shed_update_event", { p: window.SHED_PASSPHRASE, event_id: ev.id, edate: dateStr, ttl: newTitle, bdy: newBody }).then(function(res){
              saveBtn.disabled = false;
              if(res.error){ alert("Couldn't save that event. Please try again."); return; }
              ev.title = res.data.title; ev.body = res.data.body; ev.updated_by = res.data.updated_by;
              renderDay(dateStr);
            });
          });
          card.querySelector(".delete-ev").addEventListener("click", function(){
            if(!confirm("Delete '" + ev.title + "'? This can't be undone.")) return;
            var delBtn = card.querySelector(".delete-ev");
            delBtn.disabled = true;
            sb.rpc("shed_delete_event", { p: window.SHED_PASSPHRASE, event_id: ev.id }).then(function(res){
              if(res.error){ alert("Couldn't delete that event. Please try again."); delBtn.disabled = false; return; }
              var idx = events.findIndex(function(e){ return e.id === ev.id; });
              if(idx > -1) events.splice(idx, 1);
              renderDay(dateStr);
            });
          });

          group.appendChild(card);
          list.appendChild(group);
        });
        panelBody.appendChild(list);

        var addWrap = document.createElement("div");
        addWrap.className = "cal-day-add";
        addWrap.innerHTML =
          '<input type="text" class="new-ev-title" placeholder="Event title...">' +
          '<textarea class="new-ev-body" placeholder="Details (optional)..."></textarea>' +
          '<button type="button" class="btn add-ev">Add Event</button>';
        addWrap.querySelector(".add-ev").addEventListener("click", function(){
          var titleIn = addWrap.querySelector(".new-ev-title");
          var bodyIn = addWrap.querySelector(".new-ev-body");
          var ttl = titleIn.value.trim();
          if(!ttl){ titleIn.focus(); return; }
          var bdy = bodyIn.value.trim();
          var addBtn = addWrap.querySelector(".add-ev");
          addBtn.disabled = true;
          sb.rpc("shed_add_event", { p: window.SHED_PASSPHRASE, edate: dateStr, ttl: ttl, bdy: bdy }).then(function(res){
            addBtn.disabled = false;
            if(res.error){ alert("Couldn't add that event. Please try again."); return; }
            events.push(res.data);
            renderDay(dateStr);
          });
        });
        panelBody.appendChild(addWrap);
      }

      loadEvents();
    } else {
      // CONTENT is otherwise only ever fetched once, at unlock -- a session left open for a
      // while (or one that just watched someone else change something, e.g. an approval, a
      // new notice, a correction made directly in the database) would keep showing that
      // stale unlock-time snapshot until a full page reload. Re-fetching every time one of
      // these lists is opened means it's never more than a click away from current, at the
      // cost of one extra round-trip per open -- worth it after a stale list of test rows
      // was mistaken for something still-live on the actual board (2026-09-10).
      panelBody.innerHTML = '<p class="empty-note">Loading…</p>';
      fetchAllItems(window.SHED_PASSPHRASE).then(function(){
        renderItemList(function(){ return data.items; }, data.title, null);

        // Notice Board only (bookshelf/other keys land here too, but never contain
        // requires-approval items -- see boardTodoStatus's comment above): fetch every
        // to-do once, then re-render so each notice row's status chip fills in.
        if(key === "board"){
          sb.rpc("shed_list_todos", { p: window.SHED_PASSPHRASE }).then(function(res){
            if(res.error) return;
            boardTodoStatus = {};
            (res.data || []).forEach(function(t){ boardTodoStatus[t.id] = t; });
            renderItemList(function(){ return data.items; }, data.title, null);
          });
        }
      }).catch(function(){
        // If the refresh itself fails (network hiccup), fall back to whatever CONTENT
        // already held rather than leaving the panel stuck on "Loading…" forever.
        renderItemList(function(){ return data.items; }, data.title, null);
      });
    }
  }


  // ---------------------------------------------------------------------------------------
  // Markdown display for synced documents (21 September 2026). Documents synced from Core are
  // .md files, but the desk used to show them as raw text (asterisks, pipes and all). This
  // renders the common subset -- headings, paragraphs, bold/italic/code, links, quotes, bullet
  // and numbered lists (nested), tables, rules, code blocks -- straight into DOM nodes with
  // textContent only, never innerHTML, so a document can't inject markup. Only http/https
  // links are made clickable. Used for source === "synced" items only; notices and documents
  // written in the Shed stay plain text exactly as typed.
  // ---------------------------------------------------------------------------------------
  function mdInline(parent, text){
    var re = /(`[^`\n]+`)|(\*\*[^*\n]+?\*\*)|(\*[^*\s][^*\n]*?\*)|(\[[^\]\n]+\]\([^)\s]+\))|(<https?:\/\/[^>\s]+>)/g;
    var last = 0, m;
    // Backslash escapes (\* \` \[ \] \\ \|) become private-use placeholders so they can't be read as
    // markup, and are turned back into the plain character when text is emitted.
    var ESC = { "*": "\uE000", "`": "\uE001", "[": "\uE002", "]": "\uE003", "\\": "\uE004", "|": "|", "_": "_" };
    var UNESC = { "\uE000": "*", "\uE001": "`", "\uE002": "[", "\uE003": "]", "\uE004": "\\" };
    text = String(text).replace(/\\([|*_`\[\]\\])/g, function(_, ch){ return ESC[ch]; });
    function unesc(t){ return t.replace(/[\uE000-\uE004]/g, function(c){ return UNESC[c]; }); }
    function plain(t){ if(t) parent.appendChild(document.createTextNode(unesc(t))); }
    while((m = re.exec(text))){
      plain(text.slice(last, m.index));
      var tok = m[0], el;
      if(m[1]){ el = document.createElement("code"); el.textContent = unesc(tok.slice(1, -1)); parent.appendChild(el); }
      else if(m[2]){ el = document.createElement("strong"); mdInline(el, tok.slice(2, -2)); parent.appendChild(el); }
      else if(m[3]){ el = document.createElement("em"); mdInline(el, tok.slice(1, -1)); parent.appendChild(el); }
      else if(m[4]){
        var lm = /^\[([^\]]+)\]\(([^)\s]+)\)$/.exec(tok);
        var href = safeHttpUrl(lm[2]);
        if(href){
          el = document.createElement("a"); el.href = href; el.target = "_blank"; el.rel = "noopener noreferrer";
          mdInline(el, lm[1]); parent.appendChild(el);
        } else { mdInline(parent, lm[1]); }     // relative / non-web link: show the words only
      }
      else if(m[5]){
        var u = safeHttpUrl(tok.slice(1, -1));
        if(u){ el = document.createElement("a"); el.href = u; el.target = "_blank"; el.rel = "noopener noreferrer"; el.textContent = u; parent.appendChild(el); }
        else plain(tok);
      }
      last = m.index + tok.length;
    }
    plain(text.slice(last));
  }

  function mdParagraph(parent, lines){
    var p = document.createElement("p");
    lines.forEach(function(l, i){
      var hard = / {2,}$/.test(l) || /\\$/.test(l);
      mdInline(p, l.replace(/\s+$/, "").replace(/\\$/, ""));
      if(i < lines.length - 1){ if(hard) p.appendChild(document.createElement("br")); else p.appendChild(document.createTextNode(" ")); }
    });
    parent.appendChild(p);
  }

  var MD_LIST_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  var MD_TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  function mdCells(line){
    var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    return t.split(/(?<!\\)\|/).map(function(c){ return c.trim(); });
  }
  function mdIsBlockStart(l, next){
    return /^#{1,6}\s/.test(l) || /^\s*>/.test(l) || MD_LIST_RE.test(l) || /^(\*{3,}|-{3,}|_{3,})\s*$/.test(l.trim()) ||
      /^\s*```/.test(l) || (l.indexOf("|") > -1 && next != null && MD_TABLE_SEP.test(next) && next.indexOf("-") > -1 && next.indexOf("|") > -1);
  }

  function mdBlocks(parent, lines){
    var i = 0;
    while(i < lines.length){
      var l = lines[i], t = l.trim(), m;
      if(!t){ i++; continue; }
      if(/^<!--.*-->$/.test(t)){ i++; continue; }
      if(/^\s*```/.test(l)){
        var code = []; i++;
        while(i < lines.length && !/^\s*```/.test(lines[i])){ code.push(lines[i]); i++; }
        i++;
        var pre = document.createElement("pre"); var cd = document.createElement("code"); cd.textContent = code.join("\n"); pre.appendChild(cd); parent.appendChild(pre);
        continue;
      }
      if((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l))){
        var h = document.createElement("h" + Math.min(6, m[1].length + 1));   // shift down one: the title is already an h4
        h.className = "md-h";
        mdInline(h, m[2]); parent.appendChild(h); i++; continue;
      }
      if(/^(\*{3,}|-{3,}|_{3,})\s*$/.test(t)){ parent.appendChild(document.createElement("hr")); i++; continue; }
      if(l.indexOf("|") > -1 && i + 1 < lines.length && MD_TABLE_SEP.test(lines[i + 1]) && lines[i + 1].indexOf("-") > -1 && lines[i + 1].indexOf("|") > -1){
        var head = mdCells(l); i += 2;
        var wrap = document.createElement("div"); wrap.className = "md-tablewrap";
        var tbl = document.createElement("table");
        var thead = document.createElement("thead"), htr = document.createElement("tr");
        head.forEach(function(c){ var th = document.createElement("th"); mdInline(th, c); htr.appendChild(th); });
        thead.appendChild(htr); tbl.appendChild(thead);
        var tb = document.createElement("tbody");
        while(i < lines.length && lines[i].trim() && lines[i].indexOf("|") > -1){
          var cells = mdCells(lines[i]), tr = document.createElement("tr");
          for(var c = 0; c < head.length; c++){ var td = document.createElement("td"); mdInline(td, cells[c] || ""); tr.appendChild(td); }
          tb.appendChild(tr); i++;
        }
        tbl.appendChild(tb); wrap.appendChild(tbl); parent.appendChild(wrap);
        continue;
      }
      if(/^\s*>/.test(l)){
        var q = [];
        while(i < lines.length && /^\s*>/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        var bq = document.createElement("blockquote"); mdBlocks(bq, q); parent.appendChild(bq);
        continue;
      }
      if(MD_LIST_RE.test(l)){
        var items = [];
        while(i < lines.length){
          var lm = MD_LIST_RE.exec(lines[i]);
          if(lm){ items.push({ indent: lm[1].replace(/\t/g, "    ").length, ordered: /\d/.test(lm[2]), text: [lm[3]] }); i++; }
          else if(lines[i].trim() && /^\s{2,}\S/.test(lines[i]) && items.length){ items[items.length - 1].text.push(lines[i].trim()); i++; }
          else if(!lines[i].trim() && i + 1 < lines.length && (MD_LIST_RE.test(lines[i + 1]))){ i++; }
          else break;
        }
        var stack = [];      // {indent, list}
        items.forEach(function(it){
          while(stack.length && it.indent < stack[stack.length - 1].indent) stack.pop();
          var top = stack[stack.length - 1];
          if(!top || it.indent > top.indent){
            var list = document.createElement(it.ordered ? "ol" : "ul");
            if(top){ var host = top.list.lastElementChild; (host || top.list).appendChild(list); } else parent.appendChild(list);
            stack.push({ indent: it.indent, list: list }); top = stack[stack.length - 1];
          }
          var li = document.createElement("li");
          it.text.forEach(function(tx, k){ if(k) li.appendChild(document.createTextNode(" ")); mdInline(li, tx); });
          top.list.appendChild(li);
        });
        continue;
      }
      var para = [];
      while(i < lines.length && lines[i].trim() && !(para.length && mdIsBlockStart(lines[i], lines[i + 1]))){ para.push(lines[i]); i++; }
      if(!para.length){ para.push(l); i++; }
      mdParagraph(parent, para);
    }
  }

  function renderMarkdownInto(container, text){
    var lines = String(text).replace(/\r\n?/g, "\n").split("\n");
    // The first "# Title" line repeats the window's own title -- drop it.
    for(var k = 0; k < lines.length; k++){
      if(!lines[k].trim() || /^<!--.*-->$/.test(lines[k].trim())) continue;
      if(/^#\s/.test(lines[k])) lines.splice(k, 1);
      break;
    }
    container.textContent = "";
    mdBlocks(container, lines);
  }

  // ---------------------------------------------------------------------------------------
  // Fillable forms (21 September 2026)
  //
  // A synced .md document whose first line is <!-- shed-form v1 --> is shown as a real form
  // instead of raw text: radio buttons, tick boxes, text boxes, a progress count, and answers
  // that save automatically to shed_form_responses -- one row per person per form, private to
  // that person until both have pressed Finish (enforced in shed_get_form_responses, not here).
  // The document stays ordinary readable Markdown for Core; the form syntax is a handful of
  // one-line directives, see Shed/README.md "Fillable forms" for the full list:
  //   [[choice:id|Question|Option A;Option B;...|comment|why]]  pick one (5th/4th arg optional)
  //   [[claim:id|Option A;Option B;...]]     pick one, for the card above (auto-asks "why")
  //   [[checks:id|Question|Option A;Option B]]  tick any            [[check:id|Label]]  one box
  //   [[text:id|Label]]  [[area:id|Label]]   short / long free text
  //   [[comment:id|Link text]]               an optional comment box behind a small link
  //   [[more:id|Label|Text]]                 a folded-away note
  // Headings: "## " opens a section (add " | optional" to keep its questions out of the
  // progress count), "### " a sub-heading, "#### " a card (add " | Tag" for a small tag).
  // "> " lines are quoted text; everything else is a paragraph. Answers are keyed by id, so an
  // id must never be renamed once anyone has answered.
  // ---------------------------------------------------------------------------------------
  function isShedForm(item){
    return !!(item && typeof item.body === "string" && /^\s*<!--\s*shed-form\b/.test(item.body));
  }

  function parseShedForm(text){
    var nodes = [], para = [];
    function flush(){ if(para.length){ nodes.push({ t: "p", text: para.join(" ") }); para = []; } }
    String(text).split(/\r?\n/).forEach(function(raw, idx){
      var line = raw.replace(/\s+$/, "");
      var tl = line.trim();
      if(idx === 0 && /^\s*<!--/.test(line)) return;
      if(!tl){ flush(); return; }
      var m;
      if((m = /^\[\[(\w+):([^\]]*)\]\]$/.exec(tl))){
        flush();
        var parts = m[2].split("|");
        nodes.push({ t: "ctl", kind: m[1], id: parts[0].trim(), args: parts.slice(1).map(function(s){ return s.trim(); }) });
        return;
      }
      if(/^# /.test(line)) { flush(); return; }                       // title -- already shown
      if((m = /^## (.*)$/.exec(line))){
        flush();
        var st = m[1].split("|");
        nodes.push({ t: "section", text: st[0].trim(), optional: /optional/i.test(st[1] || "") });
        return;
      }
      if((m = /^### (.*)$/.exec(line))){ flush(); nodes.push({ t: "sub", text: m[1].trim() }); return; }
      if((m = /^#### (.*)$/.exec(line))){
        flush();
        var ct = m[1].split("|");
        nodes.push({ t: "card", text: ct[0].trim(), tag: (ct[1] || "").trim() });
        return;
      }
      if(/^---+$/.test(tl)){ flush(); nodes.push({ t: "end" }); return; }
      if((m = /^>\s?(.*)$/.exec(line))){ flush(); nodes.push({ t: "quote", text: m[1] }); return; }
      para.push(tl);
    });
    flush();
    return nodes;
  }

  // **bold** and `code` only; everything goes in as text nodes, never as HTML.
  function fmInline(parent, text){
    String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(function(seg){
      if(!seg) return;
      var el;
      if(seg.slice(0, 2) === "**" && seg.slice(-2) === "**" && seg.length > 4){ el = document.createElement("strong"); el.textContent = seg.slice(2, -2); parent.appendChild(el); }
      else if(seg.charAt(0) === "`" && seg.slice(-1) === "`" && seg.length > 2){ el = document.createElement("code"); el.textContent = seg.slice(1, -1); parent.appendChild(el); }
      else parent.appendChild(document.createTextNode(seg));
    });
  }

  var FORM_UID = 0;

  function renderFormBody(stageEl, win, item, body){
    var uid = ++FORM_UID;
    var me = window.SHED_ACTIVE_USER || "";
    var answers = {}, finished = false, finishedAt = null, others = [];
    var meta = [];            // every control, in document order, for progress / export / compare
    var inputs = [];          // every input element, so Finish can lock them all
    var saveTimer = null, saving = false, again = false, dirty = false;

    body.innerHTML = "";
    var page = document.createElement("div");
    page.className = "doc-page fm-form";
    var h = document.createElement("h4");
    h.textContent = item.title;
    page.appendChild(h);
    var host = document.createElement("div");
    page.appendChild(host);
    body.appendChild(page);

    function msg(text, cls){
      host.innerHTML = "";
      var p = document.createElement("p");
      p.className = "empty-note" + (cls ? " " + cls : "");
      p.textContent = text;
      host.appendChild(p);
      return p;
    }
    msg("Loading your answers…");

    function load(keepMine){
      return sb.rpc("shed_get_form_responses", { p: window.SHED_PASSPHRASE, p_item_id: item.id }).then(function(res){
        if(res.error) throw res.error;
        var rows = res.data || [];
        others = rows.filter(function(r){ return !r.is_me; });
        var mine = rows.filter(function(r){ return r.is_me; })[0];
        if(keepMine) return;
        answers = (mine && mine.answers) ? mine.answers : {};
        finished = !!(mine && mine.submitted_at);
        finishedAt = mine ? mine.submitted_at : null;
      });
    }

    function fmDate(iso){
      var d = new Date(iso);
      if(isNaN(d.getTime())) return "";
      return d.getDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] + " " + d.getFullYear();
    }

    load().then(build).catch(function(){
      var p = msg("Couldn't load this form just now, so it is not open for editing (that protects any answers you have already saved). ");
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn ghost"; b.textContent = "Try again";
      b.addEventListener("click", function(){ msg("Loading your answers…"); load().then(build).catch(function(){ msg("Still couldn't load it. Please try again in a moment."); }); });
      p.appendChild(b);
    });

    function build(){
      host.innerHTML = "";
      meta = []; inputs = [];
      var nodes = parseShedForm(item.body);

      // ---- top bar: progress, save state, actions
      var bar = document.createElement("div");
      bar.className = "fm-bar";
      var barTop = document.createElement("div");
      barTop.className = "fm-bar-top";
      var progText = document.createElement("span"); progText.className = "fm-prog-text";
      var saveText = document.createElement("span"); saveText.className = "fm-save-text";
      barTop.appendChild(progText); barTop.appendChild(saveText);
      var track = document.createElement("div"); track.className = "fm-track";
      var fill = document.createElement("div"); fill.className = "fm-fill"; track.appendChild(fill);
      var barBtns = document.createElement("div"); barBtns.className = "fm-bar-btns";
      var finishBtn = document.createElement("button"); finishBtn.type = "button"; finishBtn.className = "btn"; finishBtn.textContent = "Finish";
      var dlBtn = document.createElement("button"); dlBtn.type = "button"; dlBtn.className = "btn ghost"; dlBtn.textContent = "Download my answers";
      barBtns.appendChild(finishBtn); barBtns.appendChild(dlBtn);
      bar.appendChild(barTop); bar.appendChild(track); bar.appendChild(barBtns);
      var notice = document.createElement("div"); notice.className = "fm-notice"; notice.style.display = "none";
      bar.appendChild(notice);
      host.appendChild(bar);

      var who = document.createElement("p");
      who.className = "fm-who";
      who.textContent = "Filling in as " + (me || "you") + ".";
      host.appendChild(who);

      var content = document.createElement("div");
      host.appendChild(content);
      var compareHost = document.createElement("div");
      host.appendChild(compareHost);

      function setSave(text, bad){ saveText.textContent = text; saveText.className = "fm-save-text" + (bad ? " bad" : ""); }
      function nowTime(){ var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

      function isBlank(v){ return v == null || v === "" || (Array.isArray(v) && !v.length) || v === false; }
      function refreshProgress(){
        var req = meta.filter(function(m){ return m.required && (m.kind === "choice" || m.kind === "claim" || m.kind === "checks" || m.kind === "check"); });
        var done = req.filter(function(m){ return !isBlank(answers[m.id]); }).length;
        progText.textContent = done + " of " + req.length + " questions answered";
        fill.style.width = (req.length ? Math.round(100 * done / req.length) : 0) + "%";
        return { req: req, done: done };
      }

      function doSave(){
        if(saving){ again = true; return; }
        saving = true; dirty = false; setSave("Saving…");
        sb.rpc("shed_save_form_response", { p: window.SHED_PASSPHRASE, p_item_id: item.id, p_answers: answers }).then(function(res){
          saving = false;
          if(res.error){ dirty = true; setSave("Couldn't save just now, will retry on your next change", true); return; }
          setSave("Saved " + nowTime());
          if(dirty || again){ again = false; scheduleSave(); }
        });
      }
      function scheduleSave(){
        dirty = true; setSave("Unsaved changes…");
        clearTimeout(saveTimer);
        saveTimer = setTimeout(doSave, 600);
      }
      function changed(){ refreshProgress(); scheduleSave(); }

      // ---- control builders
      function optsOf(s){ return String(s || "").split(";").map(function(x){ return x.trim(); }).filter(Boolean); }

      function commentBox(id, linkText, mode, getFirstOpt, owned){
        // A comment field behind a small link; opens by itself once it has text, or (mode "why")
        // whenever the chosen option is not the first one (the "yes / approve" answer).
        var wrap = document.createElement("div"); wrap.className = "fm-comment";
        var link = document.createElement("button"); link.type = "button"; link.className = "fm-link"; link.textContent = "＋ " + linkText;
        var ta = document.createElement("textarea"); ta.className = "fm-area"; ta.rows = 3;
        ta.value = typeof answers[id] === "string" ? answers[id] : "";
        ta.placeholder = mode === "why" ? "Please say why, so your partner can see" : "Type here…";
        ta.style.display = "none";
        wrap.appendChild(link); wrap.appendChild(ta);
        inputs.push(ta);
        meta.push({ id: id, kind: "comment", label: linkText, required: false, owned: !!owned });
        link.addEventListener("click", function(){ link.style.display = "none"; ta.style.display = "block"; ta.focus(); });
        ta.addEventListener("input", function(){ answers[id] = ta.value; changed(); });
        function sync(){
          var chosen = mode === "why" ? answers[id.replace(/__c$/, "")] : null;
          var open = ta.value.length > 0 || (mode === "why" && !isBlank(chosen) && chosen !== getFirstOpt());
          if(open){ link.style.display = "none"; ta.style.display = "block"; }
          else if(ta.style.display === "block" && !ta.value){ ta.style.display = "none"; link.style.display = ""; }
        }
        wrap._sync = sync;
        sync();
        return wrap;
      }

      function radioGroup(id, opts){
        var grp = document.createElement("div"); grp.className = "fm-opts";
        opts.forEach(function(o){
          var lab = document.createElement("label"); lab.className = "fm-opt";
          var r = document.createElement("input"); r.type = "radio"; r.name = "fm" + uid + "_" + id; r.value = o;
          r.checked = answers[id] === o;
          inputs.push(r);
          var sp = document.createElement("span"); sp.textContent = o;
          lab.appendChild(r); lab.appendChild(sp); grp.appendChild(lab);
        });
        return grp;
      }

      function addChoice(parent, kind, id, question, opts, flags, required, cardTitle, sectionTitle){
        var q = document.createElement("div"); q.className = "fm-q";
        if(question){ var qt = document.createElement("div"); qt.className = "fm-qtext"; fmInline(qt, question); q.appendChild(qt); }
        var grp = radioGroup(id, opts);
        q.appendChild(grp);
        var myMeta = { id: id, kind: kind, label: question || cardTitle || id, card: cardTitle, section: sectionTitle, opts: opts, required: required };
        meta.push(myMeta);
        var cbox = null;
        if(flags.indexOf("comment") > -1 || flags.indexOf("why") > -1){
          var mode = flags.indexOf("why") > -1 ? "why" : "comment";
          cbox = commentBox(id + "__c", "Add a comment", mode, function(){ return opts[0]; }, true);
          q.appendChild(cbox);
          myMeta.commentId = id + "__c";
        }
        grp.addEventListener("change", function(e){
          if(e.target && e.target.type === "radio"){ answers[id] = e.target.value; if(cbox) cbox._sync(); changed(); }
        });
        parent.appendChild(q);
      }

      var cur = content, card = null, sectionTitle = "", sectionOptional = false, cardTitle = "";
      function target(){ return card || cur; }

      nodes.forEach(function(n){
        if(n.t === "section"){
          card = null; cardTitle = "";
          sectionTitle = n.text; sectionOptional = n.optional;
          var sec = document.createElement("h5"); sec.className = "fm-section";
          sec.textContent = n.text;
          if(n.optional){ var o = document.createElement("span"); o.className = "fm-optional"; o.textContent = "optional"; sec.appendChild(o); }
          content.appendChild(sec);
          meta.push({ kind: "section", label: n.text });
        } else if(n.t === "sub"){
          card = null; cardTitle = "";
          var sb2 = document.createElement("h6"); sb2.className = "fm-sub"; sb2.textContent = n.text; content.appendChild(sb2);
          meta.push({ kind: "sub", label: n.text });
        } else if(n.t === "card"){
          card = document.createElement("div"); card.className = "fm-card";
          var ch = document.createElement("div"); ch.className = "fm-card-title";
          var cs = document.createElement("span"); cs.textContent = n.text; ch.appendChild(cs);
          if(n.tag){ var tg = document.createElement("span"); tg.className = "fm-tag"; tg.textContent = n.tag; ch.appendChild(tg); }
          card.appendChild(ch);
          content.appendChild(card);
          cardTitle = n.text;
        } else if(n.t === "end"){
          card = null;
        } else if(n.t === "quote"){
          var qd = document.createElement("blockquote"); qd.className = "fm-quote"; fmInline(qd, n.text); target().appendChild(qd);
        } else if(n.t === "p"){
          var pp = document.createElement("p"); pp.className = "fm-p"; fmInline(pp, n.text); target().appendChild(pp);
        } else if(n.t === "ctl"){
          var a = n.args, req = !sectionOptional;
          if(n.kind === "claim"){
            addChoice(target(), "claim", n.id, "", optsOf(a[0]), ["why"], req, cardTitle, sectionTitle);
          } else if(n.kind === "choice"){
            addChoice(target(), "choice", n.id, a[0], optsOf(a[1]), a.slice(2), req, cardTitle, sectionTitle);
          } else if(n.kind === "checks"){
            var q = document.createElement("div"); q.className = "fm-q";
            var qt = document.createElement("div"); qt.className = "fm-qtext"; fmInline(qt, a[0]); q.appendChild(qt);
            var grp = document.createElement("div"); grp.className = "fm-opts";
            var chosen = Array.isArray(answers[n.id]) ? answers[n.id] : [];
            optsOf(a[1]).forEach(function(o){
              var lab = document.createElement("label"); lab.className = "fm-opt";
              var c = document.createElement("input"); c.type = "checkbox"; c.value = o; c.checked = chosen.indexOf(o) > -1;
              inputs.push(c);
              var sp = document.createElement("span"); sp.textContent = o;
              lab.appendChild(c); lab.appendChild(sp); grp.appendChild(lab);
            });
            grp.addEventListener("change", function(){
              answers[n.id] = Array.prototype.slice.call(grp.querySelectorAll("input:checked")).map(function(x){ return x.value; });
              changed();
            });
            q.appendChild(grp); target().appendChild(q);
            meta.push({ id: n.id, kind: "checks", label: a[0], section: sectionTitle, card: cardTitle, required: false });
          } else if(n.kind === "check"){
            var lab2 = document.createElement("label"); lab2.className = "fm-opt fm-single";
            var c2 = document.createElement("input"); c2.type = "checkbox"; c2.checked = answers[n.id] === true;
            inputs.push(c2);
            var sp2 = document.createElement("span"); fmInline(sp2, a[0]);
            lab2.appendChild(c2); lab2.appendChild(sp2);
            c2.addEventListener("change", function(){ answers[n.id] = c2.checked; changed(); });
            target().appendChild(lab2);
            meta.push({ id: n.id, kind: "check", label: a[0], section: sectionTitle, card: cardTitle, required: false });
          } else if(n.kind === "text" || n.kind === "area"){
            var f = document.createElement("div"); f.className = "fm-q";
            var fl = document.createElement("label"); fl.className = "fm-qtext"; fmInline(fl, a[0]); f.appendChild(fl);
            var inp = document.createElement(n.kind === "text" ? "input" : "textarea");
            if(n.kind === "text") inp.type = "text"; else inp.rows = 4;
            inp.className = n.kind === "text" ? "fm-text" : "fm-area";
            inp.value = typeof answers[n.id] === "string" ? answers[n.id] : "";
            inp.addEventListener("input", function(){ answers[n.id] = inp.value; changed(); });
            inputs.push(inp); f.appendChild(inp); target().appendChild(f);
            meta.push({ id: n.id, kind: n.kind, label: a[0], section: sectionTitle, card: cardTitle, required: false });
          } else if(n.kind === "comment"){
            target().appendChild(commentBox(n.id, a[0] || "Add a comment", "comment", function(){ return null; }));
            meta[meta.length - 1].section = sectionTitle; meta[meta.length - 1].card = cardTitle;
          } else if(n.kind === "more"){
            var det = document.createElement("details"); det.className = "fm-more";
            var sm = document.createElement("summary"); sm.textContent = a[0] || "More";
            var bd = document.createElement("div"); fmInline(bd, a.slice(1).join("|"));
            det.appendChild(sm); det.appendChild(bd); target().appendChild(det);
          }
        }
      });

      // ---- finished / open state
      function lock(){
        inputs.forEach(function(i){ i.disabled = finished; });
        finishBtn.textContent = finished ? "Re-open to edit" : "Finish";
        finishBtn.className = finished ? "btn ghost" : "btn";
        notice.style.display = "none";
        if(finished){
          setSave("Finished " + fmDate(finishedAt));
          notice.style.display = "block";
          notice.className = "fm-notice ok";
          notice.textContent = "You finished this form on " + fmDate(finishedAt) + ". Your answers are locked until you re-open it.";
        }
        renderStatus();
      }

      function renderStatus(){
        compareHost.innerHTML = "";
        var box = document.createElement("div"); box.className = "fm-compare";
        var t = document.createElement("h5"); t.className = "fm-section"; t.textContent = "Comparing with your partner"; box.appendChild(t);
        var lines = others.map(function(o){
          return o.user_name + (o.submitted_at ? " finished on " + fmDate(o.submitted_at) + "." : (o.updated_at ? " has started but not finished." : " has not started."));
        });
        if(!others.length) lines = ["Nobody else has started this form yet."];
        var p = document.createElement("p"); p.className = "fm-p"; p.textContent = lines.join(" "); box.appendChild(p);
        var recheck = document.createElement("button"); recheck.type = "button"; recheck.className = "btn ghost"; recheck.textContent = "Check again";
        recheck.addEventListener("click", function(){ load(!finished).then(function(){ renderStatus(); }).catch(function(){}); });
        box.appendChild(recheck);
        if(finished){
          var theirs = others.filter(function(o){ return o.submitted_at && o.answers; });
          if(!theirs.length){
            var hint = document.createElement("p"); hint.className = "empty-note"; hint.textContent = "Once you have both finished, the differences between your answers appear here.";
            box.appendChild(hint);
          } else {
            theirs.forEach(function(o){ box.appendChild(buildCompare(o)); });
          }
        } else {
          var hint2 = document.createElement("p"); hint2.className = "empty-note"; hint2.textContent = "Press Finish when you are done. Once you have both finished, you can each see where your answers differ.";
          box.appendChild(hint2);
        }
        compareHost.appendChild(box);
      }

      function shown(v){ if(Array.isArray(v)) return v.join(", "); if(v === true) return "Yes"; return (v == null || v === "" || v === false) ? "(no answer)" : String(v); }

      function buildCompare(o){
        var wrap = document.createElement("div"); wrap.className = "fm-cmp";
        var mine = answers, theirs = o.answers || {};
        var diffs = [], same = 0;
        meta.forEach(function(m){
          if(!m.id || m.owned || m.kind === "section" || m.kind === "sub") return;
          var a = shown(mine[m.id]), b = shown(theirs[m.id]);
          var ca = m.commentId ? shown(mine[m.commentId]) : "", cb = m.commentId ? shown(theirs[m.commentId]) : "";
          if(a !== b){ diffs.push({ m: m, a: a, b: b, ca: ca, cb: cb }); }
          else if(!isBlank(mine[m.id])) same++;
        });
        var s = document.createElement("p"); s.className = "fm-p";
        s.textContent = "You and " + o.user_name + " gave the same answer to " + same + (same === 1 ? " question" : " questions") + " and different answers to " + diffs.length + ".";
        wrap.appendChild(s);
        diffs.forEach(function(d){
          var r = document.createElement("div"); r.className = "fm-cmp-row";
          var lab = document.createElement("div"); lab.className = "fm-cmp-label";
          lab.textContent = (d.m.card ? d.m.card + (d.m.label && d.m.label !== d.m.card ? " — " + d.m.label : "") : d.m.label);
          r.appendChild(lab);
          [[me || "You", d.a, d.ca], [o.user_name, d.b, d.cb]].forEach(function(x){
            var l = document.createElement("div"); l.className = "fm-cmp-line";
            var strong = document.createElement("strong"); strong.textContent = x[0] + ": "; l.appendChild(strong);
            l.appendChild(document.createTextNode(x[1]));
            if(x[2] && x[2] !== "(no answer)"){ var c = document.createElement("div"); c.className = "fm-cmp-comment"; c.textContent = x[2]; l.appendChild(c); }
            r.appendChild(l);
          });
          wrap.appendChild(r);
        });
        return wrap;
      }

      // ---- export: a plain Markdown copy of this person's answers
      function exportMarkdown(){
        var out = ["# " + item.title + " — answers by " + (me || "unknown"), "", "Downloaded " + fmDate(new Date().toISOString()) + (finished ? "; marked finished " + fmDate(finishedAt) : "; not yet marked finished") + ".", ""];
        var lastCard = null;
        meta.forEach(function(m){
          if(m.kind === "section"){ out.push("", "## " + m.label, ""); lastCard = null; return; }
          if(m.kind === "sub"){ out.push("", "### " + m.label, ""); lastCard = null; return; }
          if(!m.id) return;
          var v = answers[m.id];
          if(m.kind === "comment"){ if(m.owned) return; if(!isBlank(v)){ out.push("> " + (m.label || "Comment") + ": " + String(v).replace(/\n/g, "\n> ")); out.push(""); } return; }
          var lab = m.card ? (m.card + (m.label && m.label !== m.card ? " — " + m.label : "")) : m.label;
          out.push("**" + lab + "**: " + shown(v));
          if(m.commentId && !isBlank(answers[m.commentId])) out.push("> Comment: " + String(answers[m.commentId]).replace(/\n/g, "\n> "));
          out.push("");
        });
        return out.join("\n");
      }
      dlBtn.addEventListener("click", function(){
        var blob = new Blob([exportMarkdown()], { type: "text/markdown;charset=utf-8" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (item.title.replace(/[^A-Za-z0-9]+/g, "_").slice(0, 60) || "form") + "_answers_" + (me || "me") + ".md";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
      });

      function submit(flag){
        clearTimeout(saveTimer);
        finishBtn.disabled = true;
        setSave("Saving…");
        sb.rpc("shed_save_form_response", { p: window.SHED_PASSPHRASE, p_item_id: item.id, p_answers: answers, p_submit: flag }).then(function(res){
          finishBtn.disabled = false;
          if(res.error || !res.data){ setSave("Couldn't do that just now. Please try again.", true); return; }
          finished = !!res.data.submitted_at; finishedAt = res.data.submitted_at;
          return load().then(function(){ lock(); }, function(){ lock(); });
        });
      }
      finishBtn.addEventListener("click", function(){
        if(finished){ submit(false); return; }
        var pr = refreshProgress();
        var missing = pr.req.filter(function(m){ return isBlank(answers[m.id]); });
        if(missing.length){
          notice.style.display = "block"; notice.className = "fm-notice warn"; notice.innerHTML = "";
          notice.appendChild(document.createTextNode(missing.length + " question" + (missing.length === 1 ? " is" : "s are") + " still unanswered. If you can't decide, choose Flag (or the closest option) and say why. "));
          var go = document.createElement("button"); go.type = "button"; go.className = "btn ghost"; go.textContent = "Go to the first one";
          go.addEventListener("click", function(){
            var first = missing[0];
            var el = host.querySelector('input[name="fm' + uid + '_' + first.id + '"]');
            if(el){ el.scrollIntoView({ block: "center" }); }
          });
          var anyway = document.createElement("button"); anyway.type = "button"; anyway.className = "btn ghost"; anyway.textContent = "Finish anyway";
          anyway.addEventListener("click", function(){ submit(true); });
          notice.appendChild(go); notice.appendChild(anyway);
          return;
        }
        submit(true);
      });

      // Set comment boxes' initial open state now that answers are known, then draw.
      host.querySelectorAll(".fm-comment").forEach(function(c){ if(c._sync) c._sync(); });
      refreshProgress();
      setSave(finished ? "" : "Answers save as you go");
      lock();
    }
  }

  // The "Links" block on a notice's desk panel (21 September 2026, Founder instruction: a
  // notice must take more than one link -- documents, photos, web addresses). Lists every
  // shed_item_links row for the notice, each openable (documents/photos open on the desk,
  // web addresses in a new tab) and removable, plus controls to add more. The single headline
  // link (linked_item_id) is still the big button above this block.
  function buildItemLinksBlock(stageEl, item){
    var wrap = document.createElement("div");
    wrap.className = "item-links-block";
    var label = document.createElement("label");
    label.className = "notes-label";
    label.textContent = "Links";
    wrap.appendChild(label);
    var listEl = document.createElement("div");
    wrap.appendChild(listEl);

    function render(){
      var links = ITEM_LINKS[item.id] || [];
      listEl.innerHTML = "";
      if(!links.length){
        var none = document.createElement("p");
        none.className = "empty-note";
        none.style.margin = "2px 0";
        none.textContent = item.linkedItemId ? "No other links yet." : "No links yet.";
        listEl.appendChild(none);
        return;
      }
      links.forEach(function(l){
        var row = document.createElement("div");
        row.className = "item-link-row";
        var a = document.createElement("a");
        a.href = "#";
        var target = l.linked_item_id ? findItemById(l.linked_item_id) : null;
        if(l.url){
          var href = safeHttpUrl(l.url);
          a.textContent = "🔗 " + (l.label || l.url);
          a.title = l.url;
          if(href){
            a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
          } else {
            a.addEventListener("click", function(e){ e.preventDefault(); });
          }
        } else {
          a.textContent = (target && target.loc === "gallery" ? "🖼️ " : "📄 ") + (l.label || (target ? target.title : ("Document #" + l.linked_item_id + " (no longer available)")));
          a.addEventListener("click", function(e){
            e.preventDefault();
            var fresh = findItemById(l.linked_item_id);
            if(!fresh){ alert("That item couldn't be found (it may have been removed)."); return; }
            addToDesk(stageEl, fresh);
          });
        }
        row.appendChild(a);
        var rm = document.createElement("button");
        rm.type = "button";
        rm.className = "btn ghost";
        rm.style.cssText = "padding:2px 8px; font-size:.75rem; flex:none;";
        rm.textContent = "Remove";
        rm.addEventListener("click", function(){
          rm.disabled = true;
          sb.rpc("shed_remove_item_link", { p: window.SHED_PASSPHRASE, p_link_id: l.id }).then(function(res){
            if(res.error){ rm.disabled = false; alert("Couldn't remove that link. Please try again."); return; }
            ITEM_LINKS[item.id] = (ITEM_LINKS[item.id] || []).filter(function(x){ return x.id !== l.id; });
            render();
          });
        });
        row.appendChild(rm);
        listEl.appendChild(row);
      });
    }
    render();

    var addRow = document.createElement("div");
    addRow.className = "item-link-add";
    var docBtn = document.createElement("button");
    docBtn.type = "button"; docBtn.className = "btn ghost"; docBtn.textContent = "Link a document…";
    var photoBtn = document.createElement("button");
    photoBtn.type = "button"; photoBtn.className = "btn ghost"; photoBtn.textContent = "Link a photo…";
    var webBtn = document.createElement("button");
    webBtn.type = "button"; webBtn.className = "btn ghost"; webBtn.textContent = "Add a web link…";
    addRow.appendChild(docBtn); addRow.appendChild(photoBtn); addRow.appendChild(webBtn);
    wrap.appendChild(addRow);

    var webRow = document.createElement("div");
    webRow.className = "item-link-add";
    webRow.style.display = "none";
    var urlIn = document.createElement("input");
    urlIn.type = "text"; urlIn.placeholder = "https://…";
    var labIn = document.createElement("input");
    labIn.type = "text"; labIn.placeholder = "Label (optional)";
    var goBtn = document.createElement("button");
    goBtn.type = "button"; goBtn.className = "btn"; goBtn.textContent = "Add";
    var webMsg = document.createElement("span");
    webMsg.style.cssText = "flex-basis:100%; font-size:.78rem; color:#a33;";
    webRow.appendChild(urlIn); webRow.appendChild(labIn); webRow.appendChild(goBtn); webRow.appendChild(webMsg);
    wrap.appendChild(webRow);

    function addLink(args, btn, done){
      var links = ITEM_LINKS[item.id] || [];
      var dup = links.some(function(x){
        return (args.p_linked_id != null && x.linked_item_id === args.p_linked_id) || (args.p_url && x.url === args.p_url);
      }) || (args.p_linked_id != null && item.linkedItemId === args.p_linked_id);
      if(dup){ if(done) done(true); return; }
      btn.disabled = true;
      var params = { p: window.SHED_PASSPHRASE, p_item_id: item.id };
      Object.keys(args).forEach(function(k){ params[k] = args[k]; });
      sb.rpc("shed_add_item_link", params).then(function(res){
        btn.disabled = false;
        if(res.error || !res.data){ alert((res.error && res.error.message) || "Couldn't add that link. Please try again."); return; }
        if(!ITEM_LINKS[item.id]) ITEM_LINKS[item.id] = [];
        ITEM_LINKS[item.id].push(res.data);
        render();
        if(done) done(true);
      });
    }
    docBtn.addEventListener("click", function(){
      openDocumentPicker(stageEl, function(d){ addLink({ p_linked_id: d.id }, docBtn); });
    });
    photoBtn.addEventListener("click", function(){
      openGalleryImagePicker(stageEl, function(g){ addLink({ p_linked_id: g.id }, photoBtn); });
    });
    webBtn.addEventListener("click", function(){
      webRow.style.display = webRow.style.display === "none" ? "flex" : "none";
      if(webRow.style.display !== "none") urlIn.focus();
    });
    function submitWeb(){
      var href = safeHttpUrl(urlIn.value);
      if(!href){ webMsg.textContent = "Please enter a full web address starting with http:// or https://"; return; }
      webMsg.textContent = "";
      addLink({ p_url: href, p_label: labIn.value.trim() || null }, goBtn, function(){
        urlIn.value = ""; labIn.value = ""; webRow.style.display = "none";
      });
    }
    goBtn.addEventListener("click", submitWeb);
    urlIn.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submitWeb(); } });
    return wrap;
  }

  // Builds an item object from a shed_items row in the same shape applyItems uses, so

  function itemFromRow(row, loc){

  // Lightweight document picker for linking a notice to a cabinet document. Reuses the same
  // nested-folder logic as the cabinet browser (cabinetChildFolders/cabinetItemsAt), but in a
  // simpler "click a folder to drill in, click a document to pick it" flow with no Send to
  // desk/Edit/Delete -- this overlay only exists to choose one document and hand it to
  // `onPick`.
  function openDocumentPicker(stageEl, onPick){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="bg" style="background-image:url(__ASSET_CABINET__)"></div>' +
      '<div class="scrim"></div>' +
      '<div class="panel">' +
        '<div class="panel-head"><h3>Choose a Document</h3><button class="closebtn" type="button">&times;</button></div>' +
        '<div class="panel-body"></div>' +
      '</div>';
    stageEl.appendChild(overlay);
    requestAnimationFrame(function(){ overlay.classList.add("open"); });
    function close(){
      overlay.classList.remove("open");
      setTimeout(function(){ overlay.remove(); }, 250);
    }
    overlay.querySelector(".closebtn").addEventListener("click", close);
    var body = overlay.querySelector(".panel-body");

    function renderRoot(){
      body.innerHTML = "";
      var grid = document.createElement("div");
      grid.className = "folder-list";
      CABINET_FOLDERS.forEach(function(f){
        var card = document.createElement("button");
        card.type = "button";
        card.className = "folder-card";
        card.innerHTML = '<span class="folder-icon">' + f.icon + '</span><span class="folder-name">' + f.name + '</span>';
        card.addEventListener("click", function(){ renderLevel(f.name, renderRoot); });
        grid.appendChild(card);
      });
      body.appendChild(grid);
    }

    function renderLevel(path, onBack){
      var subfolders = cabinetChildFolders(CONTENT.cabinet.items, path);
      body.innerHTML = "";
      var back = document.createElement("button");
      back.type = "button";
      back.className = "backbtn";
      back.textContent = "← Back";
      back.addEventListener("click", onBack);
      body.appendChild(back);

      if(subfolders.length){
        var grid = document.createElement("div");
        grid.className = "folder-list";
        subfolders.forEach(function(name){
          var childPath = path + "/" + name;
          var card = document.createElement("button");
          card.type = "button";
          card.className = "folder-card";
          card.innerHTML = '<span class="folder-icon">📁</span><span class="folder-name">' + name + '</span>';
          card.addEventListener("click", function(){ renderLevel(childPath, function(){ renderLevel(path, onBack); }); });
          grid.appendChild(card);
        });
        body.appendChild(grid);
      }

      var items = cabinetItemsAt(CONTENT.cabinet.items, path);
      if(items.length){
        var list = document.createElement("div");
        list.className = "item-list";
        list.style.marginTop = subfolders.length ? "14px" : "0";
        items.forEach(function(item){
          var pick = document.createElement("button");
          pick.type = "button";
          pick.className = "item-card";
          pick.innerHTML = "<b>" + item.title + "</b>" + item.body.slice(0, 60) + (item.body.length > 60 ? "..." : "");
          pick.addEventListener("click", function(){
            onPick(item);
            close();
          });
          list.appendChild(pick);
        });
        body.appendChild(list);
      } else if(!subfolders.length){
        var empty = document.createElement("p");
        empty.className = "empty-note";
        empty.textContent = "Nothing filed here yet.";
        body.appendChild(empty);
      }
    }

    renderRoot();
  }

  // Same picking flow as openDocumentPicker (browse-to-pick, no Send to desk/Edit/Delete),

    var overlay = document.createElement("div");

      '<div class="bg" style="background-image:url(__ASSET_CABINET__)"></div>' +
      '<div class="scrim"></div>' +
      '<div class="panel">' +
        '<div class="panel-head"><h3>Choose a Document</h3><button class="closebtn" type="button">&times;</button></div>' +

    function renderRoot(){
      body.innerHTML = "";
      var grid = document.createElement("div");
      grid.className = "folder-list";
      CABINET_FOLDERS.forEach(function(f){
        var card = document.createElement("button");

      bookshelfCard.addEventListener("click", function(){

        var back = document.createElement("button");

          empty.textContent = "Nothing on the bookshelf yet.";
          body.appendChild(empty);

    function renderCabinetFolder(path, onBack){
      var subfolders = cabinetChildFolders(CONTENT.cabinet.items, path);
      body.innerHTML = "";
      var back = document.createElement("button");
      back.type = "button";
      back.className = "backbtn";
      back.textContent = "← Back";

      body.appendChild(back);

      if(subfolders.length){
        var grid = document.createElement("div");
        grid.className = "folder-list";
        subfolders.forEach(function(name){

          var card = document.createElement("button");
          card.type = "button";
          card.className = "folder-card";
          card.innerHTML = '<span class="folder-icon">📁</span><span class="folder-name">' + name + '</span>';
          card.addEventListener("click", function(){ renderCabinetFolder(childPath, function(){ renderCabinetFolder(path, onBack); }); });

      var grid = document.createElement("div");
      grid.className = "gallery-grid";
      CONTENT.gallery.items.forEach(function(item){

            if(!res.error && res.data) card.querySelector(".gallery-thumb").src = res.data.signedUrl;
          });
        }
        card.addEventListener("click", function(){
          close();
          addToDesk(stageEl, item);
        });
        grid.appendChild(card);
      });
      gridWrap.appendChild(grid);
    }
    render();

    fileInput.addEventListener("change", function(){
      var files = Array.prototype.slice.call(fileInput.files || []);
      if(!files.length) return;
      addBtn.disabled = true;
      var done = 0, failed = 0;
      function uploadNext(){
        if(done >= files.length){
          addBtn.disabled = false;
          fileInput.value = "";
          statusEl.textContent = "";
          if(failed) alert(failed + " of " + files.length + " photo" + (files.length === 1 ? "" : "s") + " couldn't be added. Please try again.");
          render();
          return;
        }
        var file = files[done];
        statusEl.textContent = "Adding " + (done + 1) + " of " + files.length + "…";
        sb.rpc("shed_add_item", {
          p: window.SHED_PASSPHRASE, loc: "gallery", ttl: file.name,
          bdy: "Added to the Gallery.", fld: null, want_upload: true
        }).then(function(res){
          if(res.error || !res.data){ failed++; done++; uploadNext(); return; }
          var newItem = itemFromRow(res.data, "gallery");
          CONTENT.gallery.items.push(newItem);
          var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
          var path = newItem.id + "/" + Date.now() + "-" + safeName;
          sb.storage.from("shed-attachments").upload(path, file).then(function(upRes){
            if(upRes.error){ failed++; done++; uploadNext(); return; }
            sb.rpc("shed_add_attachment", { p: window.SHED_PASSPHRASE, item_id: newItem.id, file_name: file.name, storage_path: path, size_bytes: file.size }).then(function(attRes){
              if(!attRes.error && attRes.data){
                if(!ATTACHMENTS[newItem.id]) ATTACHMENTS[newItem.id] = [];
                ATTACHMENTS[newItem.id].push(attRes.data);
              }
              done++;
              uploadNext();
            });
          });
        });
      }
      uploadNext();
    });
  }

  // The Format Legal Docs tool (17 September 2026): pick any document in the shed, pick an
  // output format, and export it matching Karla's legal-formatting spec (`shed_items` id
  // 2025 -- 2.54cm margins, Times New Roman 12pt, 1.5 line spacing, 0pt paragraph spacing,
  // top header with document title + author, footer page numbers starting at page 1). Two
  // assumptions made where her spec was ambiguous, flagged directly to her once this shipped
  // rather than guessed at silently: "1.5 cm Line spacing" is read as ordinary 1.5 line
  // spacing, not a literal 1.5cm measurement; and no separate title page is generated (so
  // page numbering always starts at 1), since her spec branches on a title page's presence
  // without saying which documents warrant one.
  //
  // The actual .docx/PDF bytes are generated server-side by the shed-export-document Edge
  // Function (App/supabase/functions/shed-export-document/) -- this stays a thin client: it
  // sends {p, title, body, format}, gets a file back, then reuses the exact same
  // create-item-then-upload-then-attach sequence the "Upload a document…" composer already
  // uses (shed_add_item ... want_upload, then Storage upload, then shed_add_attachment) so
  // the result is an ordinary Cabinet document -- same attachment/download UI, same
  // edit/delete, nothing new to maintain on that side.
  function openFormatLegalDocsTool(stageEl){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="bg" style="background-image:url(__ASSET_PAPER__)"></div>' +

    body.innerHTML =
      '<label class="notes-label">Document</label>' +

        '<button type="button" class="btn ghost choose-doc">Select Document…</button>' +

      '</div>' +
      '<label class="notes-label">Output format</label>' +

        '<label style="display:flex;align-items:center;gap:6px;font-family:\'Nunito\',sans-serif;font-size:.85rem;cursor:pointer;">' +
          '<input type="radio" name="legal-format" value="docx" checked> Word (.docx)</label>' +
        '<label style="display:flex;align-items:center;gap:6px;font-family:\'Nunito\',sans-serif;font-size:.85rem;cursor:pointer;">' +
          '<input type="radio" name="legal-format" value="pdf"> PDF (.pdf)</label>' +

      '<p class="empty-note tool-status" style="margin:0 0 10px;"></p>' +
      '<div class="actions"><button type="button" class="btn create-doc" disabled>Create Formatted Document</button></div>' +
      '<div class="tool-result" style="margin-top:14px;"></div>';

    var chosenLabel = body.querySelector(".chosen-doc");
    var createBtn = body.querySelector(".create-doc");
    var statusEl = body.querySelector(".tool-status");
    var resultEl = body.querySelector(".tool-result");

    body.querySelector(".choose-doc").addEventListener("click", function(){

    Array.prototype.forEach.call(body.querySelectorAll('input[name="legal-format"]'), function(radio){

    createBtn.addEventListener("click", function(){
      if(!selectedDoc) return;
      createBtn.disabled = true;
      resultEl.innerHTML = "";
      statusEl.textContent = "Formatting…";

      fetch(SUPABASE_URL + "/functions/v1/shed-export-document", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ p: window.SHED_PASSPHRASE, title: selectedDoc.title, body: selectedDoc.body, format: format })
      }).then(function(res){
        if(!res.ok){
          return res.json().catch(function(){ return {}; }).then(function(errJson){
            throw new Error(errJson.error || "The formatting tool couldn't create that file.");
          });
        }
        return res.blob();
      }).then(function(blob){
        statusEl.textContent = "Filing it in the Cabinet…";
        var ext = format === "pdf" ? "pdf" : "docx";
        var outTitle = selectedDoc.title + " (Legal Format)." + ext;
        return sb.rpc("shed_add_item", {
